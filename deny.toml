# cargo-deny — Rust license / bans / sources gate.
#
# Single responsibility: enforce the ADR 0110 + ADR 0111 license posture
# (Tier 1-4 permissive allowlist; Tier-5 disqualified by omission) plus
# wildcard / duplicate-version / unknown-source bans on the Rust dep tree.
#
# RustSec advisory scanning is the responsibility of the sibling workflow
# `.github/workflows/rust-audit.yml` (cargo-audit, workspace-wide matrix +
# Sunday cron, with documented `--ignore` advisories carrying F-NNN
# traceability per F-082). This file deliberately does NOT carry an
# `[advisories]` section so the two workflows have distinct jobs and
# RustSec is not double-scanned per PR.
#
# Runs in `.github/workflows/cargo-deny.yml`. To run locally:
#   cargo install cargo-deny
#   cargo deny check licenses bans sources

[graph]
all-features = true
no-default-features = false

# ---------------------------------------------------------------------------
# Licenses — permissive allowlist per ADR 0111. Add only after confirming
# the license is on the Tier 1-4 ladder; never add a Tier-5 (SSPL /
# Commons Clause / Elastic v2 / restrictive BSL / "non-commercial").
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Permissive DATA license (Community Data License Agreement) carried by the
    # Mozilla CA trust-store crates (webpki-roots / webpki-root-certs, the rustls
    # ecosystem standard since their MPL->CDLA relicense). No copyleft, no
    # field-of-use restriction — same tier as CC0/Unicode-DFS above.
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8
exceptions = []

# ---------------------------------------------------------------------------
# Bans — guard against duplicate / wildcard crates.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only crates.io + the explicitly-named git remotes below.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
