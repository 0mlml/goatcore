// Upstream Netbird signal-exchange contract. Implemented identically so that
// unmodified upstream clients can connect. Field numbers preserved to match.
// Reference: https://github.com/netbirdio/netbird/blob/main/signal/proto/signalexchange.proto
syntax = "proto3";

package signalexchange;

option go_package = "github.com/usareur-af/goatcore/signal-server/gen/signalexchange;signalexchange";

service SignalExchange {
    // Send is a one-shot relay of an EncryptedMessage to the target peer via
    // this signal server's in-memory peer registry.
    rpc Send(EncryptedMessage) returns (EncryptedMessage) {}

    // ConnectStream opens a bidirectional stream. The client registers its
    // WireGuard public key via the x-wiretrustee-peer-id gRPC metadata header;
    // the server replies with x-wiretrustee-peer-registered: 1 and holds the
    // stream open so inbound messages addressed to this peer can be pushed.
    rpc ConnectStream(stream EncryptedMessage) returns (stream EncryptedMessage) {}
}

message EncryptedMessage {
    reserved 1;           // preserved from upstream for wire compatibility
    string key = 2;       // sender WireGuard public key
    string remoteKey = 3; // target WireGuard public key
    bytes body = 4;       // NaCl-box encrypted payload (opaque to the server)
}
