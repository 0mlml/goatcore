# Workspace-wide clippy configuration.
#
# disallowed-methods: ADR 0709 D7 layer 3 enforcement. Tasks in goat-relay's
# hot path are pinned to one shard for life; spawning must use
# `local_set.spawn_local()` — the global `tokio::spawn` and
# `tokio::task::spawn` APIs would let tasks migrate (if a multi-threaded
# runtime ever appeared) and are forbidden by lint.
#
# This list applies workspace-wide; the goat-relay-protocol lib crate and
# the goat-relay-conformance binary have no tokio dep so the lint is a
# no-op for them. The goat-relay binary is the only consumer; if a future
# edit accidentally introduces a forbidden spawn, clippy fires at CI.
#
# A non-hot-path use (e.g., a supervisor task that genuinely needs to
# spawn across threads — currently none anticipated) requires
# `#[allow(clippy::disallowed_methods)]` with an explanatory comment, so
# the deviation is visible in code review.

disallowed-methods = [
    { path = "tokio::spawn", reason = "Use local_set.spawn_local() — see ADR 0709 D7 layer 3" },
    { path = "tokio::task::spawn", reason = "Use local_set.spawn_local() — see ADR 0709 D7 layer 3" },
    { path = "tokio::task::spawn_blocking", reason = "Hot path forbids spawn_blocking; admin-path use requires explicit allow + review" },
]
