# goatbuilder — the platform admin's book (mdBook).
# Built by .github/workflows/goatbuilder-release.yml from the SAME tag as the
# binary and served mesh-internally at docs.<site>.<zone>/goatbuilder/
# (docs/design/goatbuilder-distribution.md). Every chapter but the welcome
# page is COMPOSED at build time from the canonical files in docs/ by
# compose.sh — never forked, never hand-maintained here; the command
# reference is the binary's own --help.

[book]
title = "goatbuilder — declare, converge, verify"
description = "The build/release command-line for a goat environment, for the platform admins who deploy and release."
authors = ["the goat team"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
# theme/goat.css is copied from ../goat-cli-book/theme/ by compose.sh (one home).
additional-css = ["theme/goat.css"]
smart-punctuation = true
# Mesh-internal: no source/edit links to any code host.

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1
