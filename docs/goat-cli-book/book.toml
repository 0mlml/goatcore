# goat — the operator's field guide (mdBook).
# Built into static HTML and served mesh-internally at docs.nova.<zone>
# (docs/design/goat-cli-hosted-docs.md). The reference chapter is
# generated at build time from the same tagged binary via
# `goat docs --markdown` — never hand-maintained.

[book]
title = "goat — the operator's field guide"
description = "The data fabric, in your hands. Browsable, searchable docs for the goat operator CLI."
authors = ["the goat team"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
additional-css = ["theme/goat.css"]
additional-js = ["theme/built-langs.js", "theme/language-picker.js", "theme/install-host.js"]
smart-punctuation = true
# Vendor-facing, mesh-internal: no source/edit links to any code host.

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

# mdbook-i18n-helpers: the gettext preprocessor applies po/<lang>.po when a
# per-language build sets `book.language` (e.g. MDBOOK_BOOK__LANGUAGE=fr).
# With the source language (en) it is a no-op. LP2 (docs/design/goat-cli-hosted-docs.md).
[preprocessor.gettext]
after = ["links"]
