name: goat-zenoh-portal-spec

# The served API document must be a valid OpenAPI 3.1 document. The validator
# is the one the partner-facing API grader runs, installed from a hash-pinned
# requirements file so the job pulls nothing unreviewed.
#
# Its own workflow so the path filter can be narrow: the portal backend's Go
# tests (goat-zenoh-portal-test.yml) fire on any change under the portal, and a
# pure-Go change cannot make this document invalid. This checks the document's
# shape only. Whether it matches the routes the portal serves is not checked
# here.

on:
  # Guard, not a publisher: no push on main (see goat-zenoh-portal-test.yml).
  pull_request:
    paths:
      - 'ops/goat-zenoh-portal/web/static/openapi.yaml'
      - 'ops/goat-zenoh-portal/requirements-spec-lint.txt'
      - '.github/workflows/goat-zenoh-portal-spec.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ops/goat-zenoh-portal/requirements-spec-lint.txt

      - name: install the validator
        working-directory: ops/goat-zenoh-portal
        run: python -m pip install --require-hashes --no-deps -r requirements-spec-lint.txt

      - name: validate openapi.yaml
        working-directory: ops/goat-zenoh-portal
        run: openapi-spec-validator web/static/openapi.yaml
