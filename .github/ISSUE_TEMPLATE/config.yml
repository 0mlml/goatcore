blank_issues_enabled: false
contact_links:
  - name: Security report
    url: https://github.com/usareur-af/goatcore/security/advisories/new
    about: >-
      Use GitHub Private Vulnerability Reporting for any security-impacting issue.
      Do not open a public issue.
  - name: Question or open-ended idea
    url: https://github.com/usareur-af/goatcore/discussions
    about: >-
      General questions and design discussions belong in Discussions. Bring it back
      as a user story once there is something concrete to build.
