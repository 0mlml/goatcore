name: User story
description: A new capability or behaviour change, described from the point of view of whoever benefits.
title: "feat(<scope>): <what changes, in plain language>"
labels: ["enhancement", "needs-triage", "needs-estimate"]
body:
  - type: markdown
    attributes:
      value: |
        Every issue that enters a sprint is a user story with acceptance criteria.
        If you cannot write the "so that" clause, the work may not be worth doing yet -
        file it as a Discussion instead.

        Use this form for new capability. Something broken is a **Bug report**;
        maintenance, infrastructure, docs or process work is a **Chore**. Both of those
        are user stories too, with fields suited to them.

        Security-impacting? Use
        [private vulnerability reporting](https://github.com/usareur-af/goatcore/security/advisories/new),
        not this form.

  - type: dropdown
    id: points
    attributes:
      label: Estimate (story points)
      description: >-
        Leave "Not yet estimated" if you are filing rather than planning.
        8 means "too big" - split it before it enters a sprint.
      options:
        - Not yet estimated
        - "1"
        - "2"
        - "3"
        - "5"
        - "8 - too big, split it"
    validations:
      required: true

  - type: input
    id: as-a
    attributes:
      label: As a...
      description: Who benefits? A role, not a person.
      placeholder: site platform engineer
    validations:
      required: true

  - type: input
    id: i-want
    attributes:
      label: I want...
      description: The capability, stated as an outcome rather than an implementation.
      placeholder: peer traffic between two hosts on one LAN to stay on the LAN
    validations:
      required: true

  - type: input
    id: so-that
    attributes:
      label: So that...
      description: Why it matters. If this is hard to write, reconsider the work.
      placeholder: local traffic stops consuming the site's scarce satellite uplink
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        What a reader needs in order to act - current behaviour, prior decisions,
        links to design docs or ADRs, and anything already tried.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Testable conditions in Given / When / Then form. Each must be something a
        second person could verify without asking you. "Works correctly" is not a
        criterion; "returns 404 with error code X when the slot is unbound" is.
      value: |
        - [ ] **Given** ..., **when** ..., **then** ...
        - [ ] **Given** ..., **when** ..., **then** ...
        - [ ] **Given** ..., **when** ..., **then** ...
    validations:
      required: true

  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      description: >-
        Beyond the criteria passing - docs updated, deployed, measured, tracking
        state refreshed.
      value: |
        - [ ] Acceptance criteria all pass
        - [ ] Design doc / ADR updated if the change is architectural
        - [ ] `docs/project/` tracking state updated
        - [ ] Validated on a live goatnet (state which)
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this story deliberately does not cover. Prevents scope creep mid-sprint.

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: >-
        Blocking issues, hardware or access needed, and anything that would make the
        estimate wrong.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and did not find this
          required: true
        - label: This issue contains no CUI and no PII
          required: true
