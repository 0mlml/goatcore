name: Chore
description: Maintenance, infrastructure, documentation, or process work.
title: "chore(<scope>): <what changes>"
labels: ["chore", "needs-triage", "needs-estimate"]
body:
  - type: markdown
    attributes:
      value: |
        A chore still needs a beneficiary and acceptance criteria. "Clean up X" with
        no definition of clean is how a chore runs forever.

  - type: dropdown
    id: points
    attributes:
      label: Estimate (story points)
      options:
        - Not yet estimated
        - "1"
        - "2"
        - "3"
        - "5"
        - "8 - too big, split it"
    validations:
      required: true

  - type: input
    id: as-a
    attributes:
      label: As a...
      placeholder: engineer onboarding to this repo
    validations:
      required: true

  - type: input
    id: i-want
    attributes:
      label: I want...
      placeholder: the repo to build from a fresh clone with no sibling checkout
    validations:
      required: true

  - type: input
    id: so-that
    attributes:
      label: So that...
      placeholder: I can contribute on day one without asking anyone
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Current state, why it needs to change now, and prior decisions that constrain it.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        Testable and finite. For cleanup work, say explicitly what "done" covers and
        what it does not, so the chore has an end.
      value: |
        - [ ] **Given** ..., **when** ..., **then** ...
        - [ ] **Given** ..., **when** ..., **then** ...
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Required for chores - this is the boundary that lets the issue close.
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and did not find this
          required: true
        - label: This issue contains no CUI and no PII
          required: true
