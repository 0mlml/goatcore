name: Documentation gap
description: Existing documentation is missing, wrong, unclear, or hard to find.
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For general questions about how to use the project, please use [Discussions](https://github.com/usareur-af/goatcore/discussions). Use this template specifically when you can point at a doc that is missing, wrong, or hard to find.
  - type: textarea
    id: where
    attributes:
      label: Where in the docs
      description: Path to the file, or where you expected to find a doc and did not.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: If you have a concrete suggestion, drop it here. PRs welcome.
