name: Bug report
description: Something is broken or behaves contrary to documented intent.
title: "fix(<scope>): <the symptom, not the guessed cause>"
labels: ["bug", "needs-triage", "needs-estimate"]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Use
        [private vulnerability reporting](https://github.com/usareur-af/goatcore/security/advisories/new)
        instead - do not file it here.

        A bug is still a user story: it has someone it hurts and a condition that
        proves it fixed.

  - type: dropdown
    id: points
    attributes:
      label: Estimate (story points)
      options:
        - Not yet estimated
        - "1"
        - "2"
        - "3"
        - "5"
        - "8 - too big, split it"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence. What is broken, and for whom?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Who is affected and how badly
      description: >-
        Which role hits this, how often, and what they cannot do because of it.
        This is what drives priority.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: >-
        Minimal commands that reproduce it. Include the goatnet, the host, and exact
        versions or image digests.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: And where that expectation is documented, if it is.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Logs or error output. Redact secrets, names, and any CUI.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: >-
        How we will know it is fixed - including the regression test that stops it
        coming back. A fix with no test that would have caught it is not done.
      value: |
        - [ ] **Given** the reproduction above, **when** it is re-run, **then** ...
        - [ ] **Given** the fix, **when** CI runs, **then** a regression test covers this case
        - [ ] **Given** the fix, **when** deployed to <goatnet>, **then** verified live
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "goatnet: zagros | host: mgmt-zagros-01-orin | version/digest: ..."
    validations:
      required: true

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and did not find this
          required: true
        - label: This issue contains no CUI and no PII
          required: true
