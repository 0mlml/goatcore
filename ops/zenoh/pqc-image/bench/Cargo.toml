[package]
name = "tls-handshake-bench"
version = "0.1.0"
edition = "2021"

# Handshake microbenchmark for the zenoh-pqc-tls track. Deliberately zenoh-free:
# it drives raw TLS 1.3 handshakes against a zenohd TLS listener so the measured
# delta is exactly the thing PQC changes (key exchange + handshake flights),
# selectable per-run between the aws-lc-rs provider (X25519MLKEM768 preferred)
# and the ring provider (classical only — today's fleet posture).

# Standalone — not a member of the repo-root cargo workspace (Block 33);
# the empty table stops cargo from walking up and refusing to build
# in-repo (Docker builds copied the dir out and never noticed).
[workspace]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "prefer-post-quantum", "ring", "logging", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# QUIC handshake path (quic-handshake-bench binary). quinn rides the SAME
# rustls 0.23 provider as the TCP path, so X25519MLKEM768-vs-X25519 is the
# identical seam — the only new surface is the transport, which is the
# point of the QUIC cell. Both provider features enabled so one binary covers
# pq (aws-lc-rs) and classical (ring), selected at runtime as in main.rs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "rustls-ring", "log"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }

[profile.release]
debug = false
