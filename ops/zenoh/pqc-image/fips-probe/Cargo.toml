[package]
name = "fips-probe"
version = "0.1.0"
edition = "2021"

# FIPS-PQC verification gate for the zenoh-pqc-fips image
# (docs/design/zenoh-pqc-tls.md §5). Two modes:
#
#   fips-probe                      loopback suite — asserts the AWS-LC FIPS
#                                   module enters FIPS mode, the rustls FIPS
#                                   provider offers X25519MLKEM768 (fips=true,
#                                   preferred), a FIPS<->FIPS handshake
#                                   negotiates it, and a classical ring client
#                                   still connects (down-negotiates to P-256).
#
#   fips-probe --connect <host:port> <sni> <ca.pem>
#                                   dials a live TLS listener (the smoke-booted
#                                   zenohd) with the FIPS provider and asserts
#                                   the negotiated group is X25519MLKEM768.
#
# The image build pins aws-lc-fips-sys =0.13.11 — verified (crate source
# inspected) to vendor exactly the AWS-LC-FIPS-3.1.0 tag that CMVP
# certificates #5298 (dynamic) / #5314 (static) validate, with
# ML-KEM-512/768/1024 approved in-boundary. Later 0.13.x versions vendor
# 3.2.0/3.3.0/3.4.0, which are still in the CMVP queue — do NOT float this pin.

# Standalone — not a member of the repo-root cargo workspace (Block 33);
# the empty table stops cargo from walking up and refusing to build.
[workspace]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "fips", "prefer-post-quantum", "ring", "logging"] }
aws-lc-rs = { version = "1", features = ["fips"] }
aws-lc-fips-sys = "=0.13.11"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls-pki-types = "1"
