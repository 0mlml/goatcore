version: v1.3.1

dsn: postgres://kratos:kratos@postgres:5432/kratos?sslmode=disable

serve:
  public:
    base_url: http://127.0.0.1:4433/
  admin:
    base_url: http://127.0.0.1:4434/

# Throwaway values for a loopback-only, ephemeral stack. These are NOT secrets:
# the stack is created and destroyed per CI run and is never reachable off the
# runner. Kratos requires them to be set — `cipher` in particular, because the
# TOTP credential's config.totp_url is stored encrypted, so enrolment cannot
# complete without it.
secrets:
  default:
    - integration-harness-only-not-a-real-secret
  cipher:
    - 0123456789abcdef0123456789abcdef

selfservice:
  default_browser_return_url: http://127.0.0.1:4433/
  allowed_return_urls:
    - http://127.0.0.1:4433/
  methods:
    password:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: goat-id-console-integration
    lookup_secret:
      enabled: true
    webauthn:
      enabled: true
      config:
        # Explicitly keep webauthn in 2FA mode, not passwordless.
        passwordless: false
  flows:
    # The settings flow is what makes a REAL second factor seedable: Kratos
    # v1.3.1 admin identity-import rejects credentials.totp outright
    # (`json: unknown field "totp"`, verified against a live v1.3.1), so
    # enrolment has to go through self-service. Without a settings ui_url the
    # flow cannot initialise and the seeder has nothing to drive.
    settings:
      ui_url: http://127.0.0.1:4433/settings
      privileged_session_max_age: 15m
      required_aal: aal1
    login:
      ui_url: http://127.0.0.1:4433/login
    registration:
      ui_url: http://127.0.0.1:4433/registration

session:
  whoami:
    required_aal: aal1

log:
  level: debug

identity:
  default_schema_id: default
  schemas:
    - id: default
      # The integration harness focuses on HTTP semantics and 2FA plumbing.
      # A minimal identity schema is sufficient for these tests and can be
      # extended in phase 2 when TOTP-specific interactions are added.
      url: file:///etc/config/identity.schema.json
