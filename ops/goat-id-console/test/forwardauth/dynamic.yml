http:
  middlewares:
    probation:
      forwardAuth:
        address: http://127.0.0.1:18081/auth
        trustForwardHeader: false
  routers:
    petition:
      # Traefik 3.7 (from the 3.7.13 request-target fixes) matches Path() against
      # the request target as sent, so an encoded slash no longer decodes into
      # the plain rule; the encoded spelling is named explicitly. Traefik folds
      # %2F and %2f together. A trailing slash still falls to the gated app.
      rule: Path(`/__goat/probation/request`) || Path(`/__goat/probation%2Frequest`)
      priority: 10000
      entryPoints:
        - web
      service: console
    application:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      middlewares:
        - probation
      service: backend
  services:
    backend:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:18082
    console:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:18083
