# Sample image manifest for goat-image-bundle-build.sh.
#
# Lists every container image needed to bring up the nova-lan platform.
# Operator on the WAN-connected box builds the bundle:
#
#   ops/scripts/goat-image-bundle-build.sh \
#     --manifest ops/bootstrap/nova-lan/sample-image-manifest.yaml \
#     --signing-key ~/.config/cosign/nova-lan-operator.key \
#     --output /tmp/nova-lan-images-2026-05-22.tar
#
# Bundle is carried to the closed LAN via USB, unpacked on nova-lan-A:
#
#   ops/scripts/goat-image-import.sh /mnt/usb/nova-lan-images-2026-05-22.tar
#
# This list MUST stay aligned with what the nova-lan Ansible roles
# actually pull (each role's deploy-history.yml top row is the image
# pin of record). Keep this manifest in lockstep when image pins move.
images:
  # ---- Phase 1 (OS baseline + LUKS) — no images ----

  # ---- Phase 2 (DNS) ----
  - name: coredns/coredns
    tag: "1.11.3"

  # ---- Phase 3 (Postgres) ----
  - name: postgres
    tag: 16-alpine

  # ---- Phase 4 (Traefik) ----
  - name: traefik
    tag: v3.2

  # ---- Phase 5 (Zenoh router) ----
  - name: eclipse/zenoh
    tag: "1.9.0"

  # ---- Phase 6 (MinIO) ----
  - name: minio/minio
    tag: latest    # pin to a real release tag at bundle time

  # ---- Phase 7 (audit-subscriber) ----
  - name: ghcr.io/usareur-af/goat-audit-subscriber
    tag: latest    # replace with current sha-* pin from
                   # ops/ansible/roles/audit-subscriber/deploy-history.yml

  # ---- Phase 8 (goat-zenoh-portal) ----
  - name: ghcr.io/usareur-af/goat-zenoh-portal
    tag: latest    # replace with current sha-* pin from
                   # ops/ansible/roles/goat-zenoh-portal/deploy-history.yml

  # ---- Phase 9 (panoscope) ----
  - name: ghcr.io/usareur-af/panoscope
    tag: latest    # replace with current sha-* pin from
                   # ops/ansible/roles/panoscope/deploy-history.yml

  # ---- Phase 10 (registry-mirror) ----
  - name: registry
    tag: "2"
