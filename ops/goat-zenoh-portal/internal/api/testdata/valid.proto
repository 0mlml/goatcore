syntax = "proto3";
package vendor.tracks.v1;
import "google/protobuf/timestamp.proto";

// DenObservation is the test-fixture message for schema-upload happy
// path. Uses google.protobuf.Timestamp deliberately so the test can
// assert google/protobuf/timestamp.proto lands in the persisted
// FileDescriptorSet (proves --include_imports equivalence).
message DenObservation {
  string id = 1;
  google.protobuf.Timestamp seen_at = 2;
  double confidence = 3;
}
