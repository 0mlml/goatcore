# site-infra.yml — Tier 1: VPS relays + NETHOST infrastructure
#
# Deploys the core infrastructure: VPS relay servers, NETHOST firewall,
# mesh DNS, and NETHOST relay client configuration.
#
# Usage:
#   ansible-playbook site-infra.yml
#   ansible-playbook site-infra.yml -e shared_turn_secret=abc123
#   ansible-playbook site-infra.yml -e nb_relay_auth_secret=abc123
#
# Prerequisites:
#   - terraform apply
#   - inventory/generate.sh

- import_playbook: relay-server.yml
