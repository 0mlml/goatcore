---
# SPDX-License-Identifier: Apache-2.0
#
# Deploy the grant-keyd E1 key-distribution daemon (data-access M2.1,
# docs/design/grant-keyed-encryption.md §8). Reversible via the deploy-rollback
# ledger; the container is an `image` artifact.
#
# Golden path: goat-standup.sh phase 12 on a new goatnet; the release ladder
# (ops/release/graduate.py, pin `grant-keyd` in ops/pins/fleet-pins.yaml) for a
# new image on a standing one. By hand, single-homed on the founder:
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec usareur-af --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#       grant-keyd-deploy.yml -e target=<site>_hosts -l 'mgmt-<site>-01*'
#
# Prerequisites, all rendered by roles on the golden path (no hand steps):
#   - zenoh router up (phase 11); its `infra-keyd` ACL subject is unconditional.
#   - SPIRE server on the founder (phase 11); the `grant-keyd` entry is a spire
#     role default for every goatnet.
#   - the portal up (phase 13). The portal token is resolved on the host,
#     registered in the portal's operator-keys.d and proven before the play
#     succeeds — nothing to export.
#
# Reversal: `docker compose -f /opt/grant-keyd/docker-compose.yml down` and
# remove operator-keys.d/grant-keyd.key.

- name: Deploy grant-keyd
  hosts: "{{ target | mandatory }}"
  gather_facts: true
  roles:
    - grant-keyd
