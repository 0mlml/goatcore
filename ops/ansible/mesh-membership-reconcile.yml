---
# Install (or remove) the daily NetBird membership audit on a goatnet's mgmt host.
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec usareur-af --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini \
#     mesh-membership-reconcile.yml -e target=zagros_hosts
#
# To remove it again, everywhere it was installed:
#   ... mesh-membership-reconcile.yml -e target=zagros_hosts \
#       -e mesh_membership_reconcile_enabled=false
#
# WHY THIS IS NOT A GITHUB ACTION. The check needs an admin-scoped NetBird PAT —
# listing setup keys is admin-only and the setup key is the baseline it compares
# against. This repo has 15 collaborators with push access, and Actions secrets
# are readable by any workflow on a same-repo branch, so a repo secret would have
# converted push access into mesh admin on a production goatnet. The mgmt host
# already holds a token for this API. F-332, and
# docs/design/live-state-guard-scheduling.md.

- name: NetBird membership audit timer
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true
  roles:
    - role: mesh-membership-reconcile
