---
# Install (or remove) the daily Kanidm door credential audit on a mgmt host.
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec <profile> --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini \
#     door-credential-audit.yml -e target=<site>_hosts \
#     -e door_credential_audit_enabled=true \
#     -e door_credential_audit_token="$DOOR_AUDIT_TOKEN" \
#     -e door_credential_audit_textfile_dir=/opt/<site>-obs/expected-vendors/textfile
#
# To remove it again, everywhere it was installed:
#   ... door-credential-audit.yml -e target=<site>_hosts \
#       -e door_credential_audit_enabled=false
#
# WHAT IT WATCHES. The off-mesh dashboard door and, with
# `-e door_credential_audit_plane=collab`, the collab door. Both are cloud
# Kanidm instances; the audit is two HTTPS GETs and is read-only.
#
# WHY THIS IS NOT A GITHUB ACTION. It needs a credential for a production
# identity plane. This repo has 15 collaborators with push access and Actions
# secrets are readable by any workflow on a same-repo branch, so a repo secret
# would convert push access into read access over the whole partner roster —
# names and addresses of everyone on the door. The mgmt host is where
# goatnet-scoped identity credentials already live.
# docs/design/live-state-guard-scheduling.md, F-351.
#
# WHY IT IS DEFAULT-OFF. The role needs a read-scoped Kanidm api-token, and
# minting one needs a privileged Kanidm session that the REST password flow
# cannot reach (`/v1/reauth` answers "invalidstate"); the `kanidm` CLI does it.
# Until that token exists the only alternative is the idm_admin PASSWORD on the
# mgmt host, which is full admin over the identity plane to run two GETs. That
# is a trade to decide deliberately, not to arrive at by leaving a default on.
# Mint the token: ops/scripts/create-door-audit-identity.sh --plane public

- name: Kanidm door credential audit timer
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true
  roles:
    - role: door-credential-audit
