---
# e2e-canary-secret — a canary that templates ONE secret from the deployer's
# environment, so the harness can prove a deploy is refused before any host
# when the variable is unset, naming it (docs/design/deployment-e2e.md).
- name: e2e-canary-secret
  hosts: "{{ target | mandatory }}"
  become: true
  roles:
    - e2e-canary-secret
