---
# ops/ansible/goat-relay-host-tuning.yml
#
# Apply the goat-relay-host-tuning role to all goat-relay-tier4b mgmt
# + peer hosts. Each lever is opt-in via its own `*_enable` var; pass
# them with -e on the command line per the bench/run plan.
#
# Examples:
#
#   # M-018 baseline (Tier-1 sysctl, H3 hugepages):
#   ansible-playbook -i inventory/goat-relay-tier4b.ini \
#     goat-relay-host-tuning.yml \
#     -e goat_relay_tier1_sysctl_enable=true \
#     -e goat_relay_h3_hugepages_enable=true
#
#   # M-020 (Tier-1 + H2 mitigations=off — operator-fired reboot to apply):
#   ansible-playbook -i inventory/goat-relay-tier4b.ini \
#     goat-relay-host-tuning.yml \
#     -e goat_relay_tier1_sysctl_enable=true \
#     -e goat_relay_h2_mitigations_off_enable=true \
#     -e goat_relay_h3_hugepages_enable=true
#
# Block 33C.1 H1-H4 + Tier-1.

- name: Apply goat-relay host-tuning
  hosts: goat_relay_tier4b
  become: true
  any_errors_fatal: true
  roles:
    - goat-relay-host-tuning
