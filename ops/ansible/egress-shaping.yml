---
# ops/ansible/egress-shaping.yml
#
# ADR 1081 Layer 3 — apply the egress-shaping role standalone to a mgmt-host
# (Thor first). The role is ALSO wired into mgmt-host-baseline.yml so a routine
# baseline keeps it converged; this playbook is the targeted apply used to
# enable/canary a single host without a full baseline run.
#
# Default OFF — a bare run is a no-op. Enable per-host after the tc-netem
# canary gate (roles/egress-shaping/README.md §Verification):
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini \
#     -l mgmt-zagros-01-thor egress-shaping.yml \
#     -e egress_shaping_enabled=true \
#     -e egress_shaping_bandwidth_mbit=<measured-90pct-of-line-rate>
#
# HOST-LOCAL egress shaping only — NOT fabric QoS (ADR 1033 boundary, L3).

- name: ADR 1081 L3 — host-local egress shaping (cake/BBR + control-plane priority)
  hosts: "{{ target | mandatory }}"
  become: true
  roles:
    - egress-shaping
