---
# warrant-membership.yml — install (or remove) the warrant membership converger
# on a governed goatnet's mgmt host. docs/design/mesh-change-control.md §4.4,
# ADR 1189.
#
# Needs, in the operator's shell, the svc-<site>-warrant PAT under the name
# group_vars gives as warrant_membership_token_env (zagros-dev:
# ZAGROS_DEV_WARRANT_NB_API_TOKEN). Mint it once:
#   ops/scripts/netbird-service-identities.py <goatnet> --mint
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini \
#     warrant-membership.yml -e target=zagros_dev_hosts
#
# Remove it again:
#   ... warrant-membership.yml -e target=zagros_dev_hosts -e warrant_membership_enabled=false
#
# The declaration installed is the directory ops/warrant/membership/<scope>/
# from THIS checkout (mirrored: a fragment the repo no longer has is removed
# from the host), so run from a worktree at the merged ref
# (ansible-preflight.sh refuses a stale trunk).

- name: Warrant membership converger
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: false
  roles:
    - role: warrant-membership
