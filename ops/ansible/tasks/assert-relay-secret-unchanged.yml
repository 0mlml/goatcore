---
# Refuse to write a management.json whose Relay.Secret differs from the one the
# host is already running, unless the change is declared.
#
# A relay accepts a client only with a token signed by the relay's own shared
# secret (NB_AUTH_SECRET on the relay). Management signs those tokens with
# Relay.Secret. When the two differ nothing errors at deploy time: management
# restarts healthy, peers that already hold a token keep working, and every
# NEW token is refused, so devices fall off relays one by one as they reconnect.
#
# A stale copy of the relay secret in the operator's local environment does
# this: a routine mgmt-config-refresh rewrites the secret from the stale copy
# and breaks new relay auth until it is re-rendered with the relays' value.
#
# Compared by SHA-256 on both sides so the secret is never rendered, logged or
# put on a command line. A fresh host (no file yet) passes.
#
# Rotating the relay secret is a coordinated change — relays and management
# together — declare it with -e relay_secret_change_is_intentional=true.
- name: Pre-flight | read the hash of the relay secret this host already signs with
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import hashlib, json, sys
        try:
            with open(sys.argv[1]) as fh:
                s = (json.load(fh).get("Relay") or {}).get("Secret") or ""
        except FileNotFoundError:
            print("ABSENT"); raise SystemExit(0)
        except Exception:
            print("UNREADABLE"); raise SystemExit(0)
        print(hashlib.sha256(s.encode()).hexdigest() if s else "EMPTY")
      - "{{ compose_dir }}/management-a/management.json"
  register: _relay_secret_onhost
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pre-flight | refuse a relay secret that differs from the one this host signs with
  ansible.builtin.assert:
    that:
      - _relay_secret_onhost.stdout | default('') in ['ABSENT', 'EMPTY', 'UNREADABLE']
        or _relay_secret_onhost.stdout | trim == ((relay_secret | default('')) | hash('sha256'))
    fail_msg: >-
      REFUSING: the relay_secret resolved here is NOT the one
      {{ inventory_hostname }} is already signing relay tokens with. The relays
      verify tokens against their own secret, so writing this would leave
      management healthy while every new relay connection is refused.
      Most likely your environment resolved a stale copy: ansible-preflight.sh
      sources the goat clone's .envrc.local.d when the worktree has none, and
      the two clones' env files can disagree. Compare sha256 of the env value
      with the relay's NB_AUTH_SECRET before going further.
      If you are rotating the relay secret on the relays and management
      together, re-run with -e relay_secret_change_is_intentional=true.
    quiet: true
  when: not (relay_secret_change_is_intentional | default(false) | bool)
