---
# What `goat federate apply` rendered for this run, read by every peering play the
# driver runs after phase 9. The driver names the directory by passing fed_work and
# fed_edge_group; a play run by hand without them reads group_vars as usual.
- name: peering | read the rendered agreement values
  ansible.builtin.include_vars:
    dir: "{{ fed_work }}/applied/ops/ansible/group_vars/{{ fed_edge_group }}"
  when:
    - fed_work is defined
    - fed_edge_group is defined
