---
# ops/ansible/tasks/ntp-preflight.yml
#
# Reusable "NTP must be healthy before proceeding" task file.
#
# Import from any playbook that mutates state dependent on LWW-correct
# timestamps — most importantly:
#
#   - ops/ansible/vega-bootstrap.yml        (run at the TOP of site 1)
#   - ops/ansible/coordinated-upgrade.yml  (before stopping management)
#
# Pattern to import (plays target hosts, import_tasks doesn't):
#
#     - name: Preflight — NTP must be healthy before proceeding
#       ansible.builtin.import_tasks: tasks/ntp-preflight.yml
#
# The task delegates to the ntp-hygiene role's preflight.yml, which
# reads the same defaults — single source of truth for the threshold.
#
# Depends on:
#   - chrony package present + running (installed by the ntp-hygiene
#     role; preflight assumes you've already run it at least once).
#   - roles/ntp-hygiene/defaults/main.yml in the play's role_path.
#     If you're importing outside a play that uses the ntp-hygiene
#     role, pass the defaults explicitly via -e or group_vars.

- name: Ensure ntp-hygiene role defaults are available
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/roles/ntp-hygiene/defaults/main.yml"

- name: Run NTP preflight (from ntp-hygiene role)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/ntp-hygiene/tasks/preflight.yml"
