---
# Deploy the consistency domain of the environment-health surface
# (docs/design/consistency-foundation.md §5, ADR 1110 / ADR 1036).
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec legacy --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini \
#     consistency-health-deploy.yml -e target=zagros_hosts
#
# Default-off everywhere: the role's fail-closed assert refuses to run without
# consistency_health_enabled and a digest-pinned image, so this playbook is
# inert until a goatnet's group_vars opts in.
#
# Verify with a LIVE SUBSCRIBER, never a storage read-back — a default-deny
# storage read returns empty and looks identical to success:
#   goat sub --context <goatnet> 'ops/consistency/report/**' --take 2
#   goat health --domain consistency --context <goatnet>

- name: consistency-health | per-node convergence records + the goatnet rollup
  hosts: "{{ target | mandatory }}"
  become: true
  roles:
    - consistency-health
