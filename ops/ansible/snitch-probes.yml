---
# snitch-probes.yml — Deploy SNITCH probes to all managed mesh peers
#
# Installs the snitch binary and a systemd service that reports mesh
# performance data back to the collector on NETHOST every 60 seconds.
#
# Targets: bridge VPSes, NETHOST itself.
# Other mesh peers (laptops, desktops) must install manually — see
# docs/operations/snitch-probe-install.md for instructions.
#
# Usage:
#   ansible-playbook snitch-probes.yml
#
# Prerequisites:
#   - Collector running on NETHOST (nethost-snitch.yml deployed)
#   - SNITCH_ADMIN_KEY set in environment (operator+ role for binary download)
#   - SNITCH_PROBE_KEY set in environment (from collector first-run logs)

- name: Deploy SNITCH probes to managed hosts
  hosts: bridge_servers:nethost
  become: true

  vars:
    snitch_admin_key: "{{ lookup('env', 'SNITCH_ADMIN_KEY') }}"
    snitch_probe_key: "{{ lookup('env', 'SNITCH_PROBE_KEY') }}"
    snitch_collector: "https://snitch.netbird.legacy.example"
    snitch_bin: /usr/local/bin/snitch
    snitch_service: snitch-probe

  tasks:
    - name: Validate keys
      ansible.builtin.assert:
        that:
          - snitch_admin_key | length > 0
          - snitch_probe_key | length > 0
        fail_msg: "SNITCH_ADMIN_KEY and SNITCH_PROBE_KEY must be set in environment"

    - name: Copy snitch binary from Docker image (NETHOST)
      ansible.builtin.shell:
        cmd: docker cp snitch:/usr/local/bin/snitch {{ snitch_bin }} && chmod 0755 {{ snitch_bin }}
      when: inventory_hostname in groups.get('nethost', [])
      notify: Restart snitch probe

    - name: Download snitch binary from collector (remote hosts)
      ansible.builtin.get_url:
        url: "{{ snitch_collector }}/bin/snitch?os=linux&arch={{ ansible_facts['architecture'] | regex_replace('x86_64', 'amd64') | regex_replace('aarch64', 'arm64') }}"
        dest: "{{ snitch_bin }}"
        mode: "0755"
        headers:
          Authorization: "Bearer {{ snitch_admin_key }}"
        force: true
      when: inventory_hostname not in groups.get('nethost', [])
      notify: Restart snitch probe

    - name: Set collector URL (localhost on NETHOST, HTTPS elsewhere)
      ansible.builtin.set_fact:
        probe_collector: "{{ (inventory_hostname in groups.get('nethost', [])) | ternary('http://127.0.0.1:8080', snitch_collector) }}"

    - name: Install systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=SNITCH mesh performance probe
          After=network-online.target netbird.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStart={{ snitch_bin }} probe --collector {{ probe_collector }} --interval 60
          Restart=always
          RestartSec=30
          Environment=SNITCH_COLLECTOR={{ probe_collector }}
          Environment=SNITCH_PROBE_KEY={{ snitch_probe_key }}

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/{{ snitch_service }}.service
        mode: "0644"
      notify: Restart snitch probe

    - name: Enable and start probe service
      ansible.builtin.systemd:
        name: "{{ snitch_service }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify probe is running
      ansible.builtin.shell:
        cmd: systemctl is-active {{ snitch_service }}
      changed_when: false
      register: probe_status

    - name: Print status
      ansible.builtin.debug:
        msg: |
          SNITCH probe {{ probe_status.stdout }} on {{ inventory_hostname }}
            Collector: {{ snitch_collector }}
            Logs:      journalctl -u {{ snitch_service }} -f

  handlers:
    - name: Restart snitch probe
      ansible.builtin.systemd:
        name: "{{ snitch_service }}"
        state: restarted
        daemon_reload: true
