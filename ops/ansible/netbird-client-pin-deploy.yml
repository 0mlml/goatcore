---
# netbird-client-pin-deploy.yml — pin + restore the netbird CLIENT package on
# mesh hosts (standalone leg of roles/netbird-client-pin).
#
# WHY (zagros-a): during the peering-degradation chase an unsigned
# hand-built netbird (0.75.1-goat4083 — a mitigation for a theory later
# FALSIFIED, no validated benefit) was copied over /usr/bin/netbird. dpkg still
# said stock 0.75.1; apt held nothing, so the client would also silently float
# on the next upgrade. This playbook reverts such drift the durable way: the
# pinned STOCK package is reinstalled (checked against the RUNNING binary's
# version string, which dpkg can't see) and apt-held.
#
# Required var (group_vars, e.g. group_vars/zagros_hosts/vars.yml):
#   netbird_version: "0.75.1"        # exact pkgs.netbird.io version; empty = no-op
#
# NOTE: when the pin actually changes the binary, the netbird daemon restarts —
# a ~10-30s mesh blip on the target; the play rides it out (async + reconnect).
#
# Apply (mesh SSH; idempotent — a match+held host is a full no-op):
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec usareur-af --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#       -e target=zagros_hosts netbird-client-pin-deploy.yml

- name: Pin the netbird client package (mesh hosts)
  hosts: "{{ target | mandatory }}"
  become: true
  roles:
    - netbird-client-pin
