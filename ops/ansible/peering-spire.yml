---
# peering-spire.yml — phase 13 of a peering standup: ADR 1157 step 2.
#
#   Driver: ops/scripts/peering-standup.sh, goatbuilder federate
#   Role:   roles/goat-peering-spire
#
# Recognition, never authorization. This imports the partner's PUBLIC bundle and keeps
# it fresh; what the partner may do stays the edge's ACL (docs/design/federated-trust-model.md).
# No partner authority reaches a core router's trust file from here.
- name: Cross-sovereign SPIRE bundle federation
  hosts: peering_edges
  gather_facts: true
  become: true
  pre_tasks:
    - name: Read what `goat federate apply` rendered for this run
      ansible.builtin.include_tasks: tasks/peering-applied-vars.yml
  roles:
    - role: goat-peering-spire
