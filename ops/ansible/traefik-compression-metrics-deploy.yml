---
# SPDX-License-Identifier: Apache-2.0
#
# Deploy the Traefik compression exporter to one goatnet's mgmt hosts.
#
#   ansible-playbook -i inventory/mgmt-hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#     traefik-compression-metrics-deploy.yml -e target=zagros_hosts
#
# Why this exists at all: Traefik's own Prometheus output cannot see
# compression — traefik_service_responses_bytes_total counts what the backend
# produced, not what went on the wire. ADR 1139.
- name: Publish Traefik response-compression metrics
  hosts: "{{ target | mandatory }}"
  gather_facts: true
  roles:
    - role: traefik-compression-metrics
