# render-alertmanager.yml — render both Alertmanager templates (the
# observability role's, used by obs.yml on single-host sites, and the
# obs-host role's, used on dedicated obs hosts) for every host of a group,
# locally, touching no host. Used by ops/ci/check-alertmanager-config.py.
#
#   ansible-playbook -i inventory/mgmt-hosts.ini render-alertmanager.yml \
#     -e target=all -e out=<dir>
#
# Writes <out>/<host>.observability.yml and <out>/<host>.obs-host.yml.
- name: Render alertmanager.yml for each host (local; no host contact)
  hosts: "{{ target | mandatory }}"
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_become: false
  tasks:
    - name: Render each template into <out>/<host>.<role>.yml
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/roles/' ~ item ~ '/templates/alertmanager.yml.j2') }}"
        dest: "{{ out | mandatory }}/{{ inventory_hostname }}.{{ item }}.yml"
        mode: "0644"
      delegate_to: localhost
      loop: [observability, obs-host]
