---
# ops/ansible/vars/site-required-env-vars.yml
#
# Shared per-profile env-var requirements for site-preflight.yml +
# site-bootstrap.yml. Loaded via vars_files in both, so the source of
# truth for "what envrc.local needs to carry" is one file.
#
# Names are auto-derived from `site_id_upper` ({{ site_id | upper |
# replace('-', '_') }}) — e.g. site_id=site-a → SITE_A_*. Per-site
# group_vars can override `required_env_vars` directly to declare a
# different shape (e.g. a single-Orin site uses var names without an
# A/B router-role suffix).
#
# Profile taxonomy: see docs/design/turnkey-three-orin-bringup.md
# §"Mgmt-stack profile taxonomy".

# `full` profile — A/B mgmt-host pair + obs-host C. Carries the full
# mgmt-stack credential surface.
#
# Cluster-shared Ory secrets (KRATOS_COOKIE / KRATOS_CIPHER / HYDRA_SYSTEM /
# HYDRA_COOKIE) MUST be byte-identical across every site that joins the
# Spock-replicated kratos.* / hydra.* schemas. First-cluster-deploy
# genesis is operator-fired via ops/scripts/cluster-secrets-init.sh; subsequent
# sites mirror via _MIRRORS_<SITE>-style references in the env. Playbooks
# never auto-generate these — they only assert presence here, then read.
required_env_vars_full:
  - "{{ site_id_upper }}_PG_PASS"
  - "{{ site_id_upper }}_NB_ENCKEY"
  - "{{ site_id_upper }}_BKP_KEY"
  - "{{ site_id_upper }}_REPLICATOR_PASS"
  - "{{ site_id_upper }}_RELAY_SECRET"
  - "{{ site_id_upper }}_KRATOS_COOKIE"
  - "{{ site_id_upper }}_KRATOS_CIPHER"
  - "{{ site_id_upper }}_HYDRA_SYSTEM"
  - "{{ site_id_upper }}_HYDRA_COOKIE"
  - "{{ site_id_upper }}_A_HOST"
  - "{{ site_id_upper }}_A_USER"
  - "{{ site_id_upper }}_A_PASS"
  - "{{ site_id_upper }}_A_LUKS_PASS"
  - "{{ site_id_upper }}_B_HOST"
  - "{{ site_id_upper }}_B_USER"
  - "{{ site_id_upper }}_B_PASS"
  - "{{ site_id_upper }}_B_LUKS_PASS"

# `postgres-spock-only` profile — provisional sites
# (single Orin, postgres-spock only, no mgmt-API surface,
# no intra-site pair, replicates from publisher → no independent backup).
# Per ADR 0827 §"Mgmt-stack scope expansion" decision (a).
required_env_vars_postgres_only:
  - "{{ site_id_upper }}_PG_PASS"
  - "{{ site_id_upper }}_HOST"
  - "{{ site_id_upper }}_USER"
  - "{{ site_id_upper }}_PASS"
  - "{{ site_id_upper }}_LUKS_PASS"

# Map for selection. Future profiles (see design doc
# §"Future profiles deliberately deferred") add entries here when their
# absorption into the unified site-bootstrap.yml lands.
profile_required_env_vars:
  full: "{{ required_env_vars_full }}"
  postgres-spock-only: "{{ required_env_vars_postgres_only }}"
