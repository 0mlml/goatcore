---
# efforts.yml — Deploy efforts service to NETHOST
#
# Deploys:
#   - Go API server (built from source on host)
#   - PostgreSQL 16 database (dedicated container)
#   - Traefik integration for HTTPS at efforts.netbird.legacy.example
#
# Usage:
#   ansible-playbook efforts.yml
#   ansible-playbook efforts.yml -e efforts_pg_password=abc123
#
# Prerequisites:
#   - NETHOST accessible via mesh IP
#   - Docker + Traefik running on NETHOST

- name: Deploy efforts service
  hosts: nethost
  become: true

  vars:
    efforts_dir: /opt/goat/efforts
    efforts_src_dir: "{{ efforts_dir }}/src"
    local_efforts_dir: "{{ playbook_dir }}/../serve/efforts"

  tasks:
    # ==================================================================
    # Directories
    # ==================================================================
    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ nethost_user }}"
        group: "{{ nethost_user }}"
        mode: "0755"
      loop:
        - "{{ efforts_dir }}"
        - "{{ efforts_src_dir }}"

    # ==================================================================
    # Source files (for Docker build)
    # ==================================================================
    - name: Copy Go source files
      ansible.builtin.copy:
        src: "{{ local_efforts_dir }}/{{ item }}"
        dest: "{{ efforts_src_dir }}/{{ item }}"
        owner: "{{ nethost_user }}"
        group: "{{ nethost_user }}"
        mode: "0644"
      loop:
        - main.go
        - go.mod
        - go.sum
        - Dockerfile
      notify: Rebuild efforts

    # ==================================================================
    # PostgreSQL password (generate or read existing)
    # ==================================================================
    - name: Check for existing .env
      ansible.builtin.stat:
        path: "{{ efforts_dir }}/.env"
      register: env_file

    - name: Generate PostgreSQL password
      when: efforts_pg_password is not defined and not env_file.stat.exists
      block:
        - name: Generate random password
          ansible.builtin.command: openssl rand -hex 16
          register: generated_pg_pass
          changed_when: false

        - name: Set password fact
          ansible.builtin.set_fact:
            efforts_pg_password: "{{ generated_pg_pass.stdout }}"

    - name: Read existing password from .env
      when: efforts_pg_password is not defined and env_file.stat.exists
      block:
        - name: Read .env file
          ansible.builtin.slurp:
            src: "{{ efforts_dir }}/.env"
          register: env_contents

        - name: Parse password from .env
          ansible.builtin.set_fact:
            efforts_pg_password: "{{ (env_contents.content | b64decode) | regex_search('EFFORTS_PG_PASSWORD=(.+)', '\\1') | first }}"

    - name: Write .env file
      ansible.builtin.copy:
        dest: "{{ efforts_dir }}/.env"
        owner: "{{ nethost_user }}"
        mode: "0600"
        content: |
          EFFORTS_PG_PASSWORD={{ efforts_pg_password }}
      notify: Restart efforts

    # ==================================================================
    # Traefik network detection
    # ==================================================================
    - name: Detect Traefik Docker network
      ansible.builtin.command:
        cmd: >-
          docker inspect netbird-traefik
          --format {% raw %}'{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}'{% endraw %}
      register: traefik_net_result
      changed_when: false
      failed_when: false

    - name: Set Traefik network fact
      ansible.builtin.set_fact:
        traefik_network: "{{ traefik_net_result.stdout.split()[0] | default('netbird_netbird', true) }}"

    # ==================================================================
    # Docker Compose
    # ==================================================================
    - name: Write docker-compose.yml
      ansible.builtin.template:
        src: templates/efforts-docker-compose.yml.j2
        dest: "{{ efforts_dir }}/docker-compose.yml"
        owner: "{{ nethost_user }}"
        mode: "0644"
      notify: Restart efforts

    - name: Build and start efforts stack
      ansible.builtin.shell:
        cmd: "docker compose up -d --build"
        chdir: "{{ efforts_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stderr or 'Creating' in compose_result.stderr"

    - name: Wait for efforts API to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:8090/health"
        return_content: true
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status == 200

    # ==================================================================
    # Mesh DNS
    # ==================================================================
    - name: Add efforts to mesh-hosts
      ansible.builtin.lineinfile:
        path: /opt/goat/dns/mesh-hosts
        line: "{{ nethost_mesh_ip }}  efforts.{{ netbird_domain }}"
        regexp: "efforts\\.{{ netbird_domain }}"
        insertafter: "# Custom entries"
      notify: Reload coredns

    # ==================================================================
    # Verify
    # ==================================================================
    - name: Print deployment status
      ansible.builtin.debug:
        msg: |
          ========================================
            EFFORTS DEPLOYED
          ========================================
          API:     https://efforts.{{ netbird_domain }}/health
          UI:      https://explain.{{ netbird_domain }}/effort-tracker.html
          Config:  {{ efforts_dir }}/
          DB:      efforts-db container (Postgres 16)
          ========================================
          Health:  {{ health_check.json | to_nice_json }}

  handlers:
    - name: Rebuild efforts
      ansible.builtin.shell:
        cmd: "docker compose up -d --build efforts"
        chdir: "{{ efforts_dir }}"

    - name: Restart efforts
      ansible.builtin.shell:
        cmd: "docker compose up -d --force-recreate"
        chdir: "{{ efforts_dir }}"

    - name: Reload coredns
      ansible.builtin.command:
        cmd: docker exec mesh-dns kill -HUP 1
