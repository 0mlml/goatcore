---
# consistency-aggregator-deploy.yml — the CF-7 hosted aggregator
# (consistency-foundation.md §7.8 as-built; the aggregator-product change).
#
# Deploys the consistency console binary in --aggregate mode on a
# cloud relay-health host, BESIDE the multi-env relay-health dashboard: same
# host, same Traefik, sibling DNS, PLATFORM-ADMIN oauth2 fence (the
# per-goatnet console ceremony against the goatnet's Hydra over the mesh).
#
# DEFAULT-OFF + PENDING-pinned: this play refuses until the deploy phase
# flips consistency_aggregator_enabled AND pins a post-aggregator-product
# image (group_vars/<site>_relay_health/consistency-aggregator.yml carries
# the full checklist). Reached via SSM (port 22 closed).
#
# Why THIS host (the transport question, §7.8 as-built):
#   - it is a mesh peer of the goatnet, so the router is one mesh hop away,
#     the same cloud-host->router:7447 egress node-net-health uses;
#   - it already renders the multi-env relay-health overview and is the
#     operator's env-door peer (ADR 1117 Tier 1), so it is the
#     rear vantage trusted to look at several goatnets;
#   - a PEER env is reached through a cross-env door lane (no cross-env mesh
#     bridge, ADR 1117). Until it exists, the peer's row renders
#     indeterminate-with-age: visible, never green.
#
# Apply (deploy phase):
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec <profile> --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/<site>-relay-health.ini \
#       consistency-aggregator-deploy.yml

- name: Deploy the hosted cross-goatnet consistency aggregator (CF-7, §7.8)
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true
  tasks:
    - name: consistency-console role, aggregate mode
      ansible.builtin.include_role:
        name: consistency-console
        tasks_from: aggregate
