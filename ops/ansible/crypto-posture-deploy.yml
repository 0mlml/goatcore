---
# SPDX-License-Identifier: Apache-2.0
#
# Deploy goat-crypto-posture, the evidence-based crypto-posture publisher
# (ADR 1079, docs/design/zenoh-pqc-tls.md). One mTLS Zenoh client peer that
# probes the router's negotiated key exchange, reads the host FIPS attestation
# and publishes CryptoPostureV1 on ops/fabric/crypto/<site>. Persists nothing.
#
#   goatbuilder deploy --component crypto-posture --env <goatnet> --ack "<name>" --yes
#   ops/scripts/deploy-component.sh crypto-posture --env <goatnet>
#
# Pre-flight (checked by the role, which refuses with the fix):
#   1. The zenoh router is up on {{ zenoh_stack }}_default.
#   2. A CN=fabric-health-trial-peer leaf at /opt/crypto-posture/certs; when it
#      is absent the role copies the host's fabric-health leaf, which is that
#      same identity (the router ACL grants it write on ops/fabric/**).
#   3. The CA root at /etc/<zenoh_stack>/tls/ca-root-cert.pem.

- name: deploy goat-crypto-posture (ADR 1079)
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true

  roles:
    - role: crypto-posture
