# SPDX-License-Identifier: Apache-2.0
# Install the REST port connection tap and its log rotation on a router host.
#   cd ops/ansible
#   ../scripts/ansible-preflight.sh -i <inventory> zenoh-rest-tap.yml -e target=<site>_hosts
- name: zenoh REST port connection tap
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: false
  roles:
    - role: zenoh-rest-tap
