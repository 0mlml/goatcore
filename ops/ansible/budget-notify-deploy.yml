---
# SPDX-License-Identifier: Apache-2.0
# Deploy budget-notify (cardinality design 2c) to a router host.
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES ../scripts/ansible-preflight.sh \
#     -i <inventory> budget-notify-deploy.yml -e target=zagros_hosts
# Requires ZAGROS_SES_SMTP_USERNAME/PASSWORD in the deploy environment
# (30-site-services.envrc) and the fabric-crawler band JSON on the host.
- name: deploy budget-notify (topic-budget tenant notifier)
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: false
  roles:
    - role: budget-notify
