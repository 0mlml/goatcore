# render-mgmt-dynamic.yml — render traefik-acme's file-provider config
# (templates/traefik-acme/mgmt-dynamic.yml.j2) for every host of a group,
# locally, touching no host. Used by ops/ci/check-acme-san-requests.py to
# read the certificate requests each goatnet would send to Let's Encrypt.
#
#   ansible-playbook -i inventory/mgmt-hosts.ini render-mgmt-dynamic.yml \
#     -e target=all -e out=<dir>
#
# Hosts with no public_mgmt_fqdn (no ACME on that site) are skipped.
- name: Render mgmt-dynamic.yml for each host (local; no host contact)
  hosts: "{{ target | mandatory }}"
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_become: false
  tasks:
    - name: Render the template into <out>/<host>.yml
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/traefik-acme/mgmt-dynamic.yml.j2') }}"
        dest: "{{ out | mandatory }}/{{ inventory_hostname }}.yml"
        mode: "0644"
      delegate_to: localhost
      when: public_mgmt_fqdn is defined
