# F-300 — persist the Jetson nvethernet USO mitigation (disable-uso.service).
#
# Idempotent; converges hand-applied RCA units to the role-managed copy and
# makes the guard reimage-proof. Jetson Orin hosts only (nvethernet NIC).
#
# Usage (from ops/ansible, laptop on the target env's netbird profile):
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec usareur-af --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini \
#     nic-offload-guard.yml -e 'target=zagros_prod_hosts:zagros_prod_obs_hosts'

# `| mandatory` rather than a bare `{{ target }}`: unset, a bare lookup yields
# an empty pattern that matches nothing and the play reports success having
# touched no host — a silent no-op on a guard that exists to prevent malformed
# segments. Refusing is the only safe failure here.
- name: F-300 — persist the nvethernet USO guard
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: false
  roles:
    - nic-offload-guard
