[defaults]
inventory = inventory/hosts.ini
# ADR 1124 — the scope-qualified ACL reference resolver lives here and is
# shared with ops/ci/check-netbird-acl-parity.py. Declared explicitly rather
# than relying on playbook-adjacent auto-discovery, which ansible-core 2.20 no
# longer does dependably: a silently-unloaded filter surfaces as
# "No filter named 'acl_resolve_refs'" mid-cutover.
filter_plugins = ./filter_plugins
host_key_checking = false
timeout = 120
stdout_callback = ansible.builtin.default
display_args_to_stdout = false
# pgbackrest and other tools emit ANSI/binary bytes that SSM can't serialize
# as clean UTF-8. Disabling strict UTF-8 lets rc be the ground truth.
module_strict_utf8_response = false
# Bumped from 1 to 10 (2026-04-25). Default of 1 single-threaded every
# play, including ones over SSM where session start dominates wall-clock.
# 10 is well under SSM's per-account session-concurrency cap and gives a
# ~10x speedup on multi-host plays. Bump higher per-invocation with
# --forks N if a specific play needs it.
forks = 10
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

[privilege_escalation]
become = true

[ssh_connection]
pipelining = true
# One SSH connection per host, reused by every task (docs/design/goatbuilder-speed.md).
# Measured 2026-10-29 against mgmt-zagros-dev-01-thor over the mesh: 3.5 s per
# fresh connection vs 0.6 s multiplexed; an 11-call read-only play took 69.9 s
# with multiplexing off and 29.0 s with it on. ControlPersist is 10 min, not
# 60 s: F-556 measured the 60 s master expiring between long tasks, so every
# such task paid a fresh handshake. Inventory lines that ProxyJump keep
# ControlMaster=no (the May 2026 ProxyJump conflict); direct hosts inherit this.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -o ConnectTimeout=10
retries = 3

# SSM doesn't support pipelining — override per-host in inventory is not
# possible, so VPS playbooks may need: ansible_pipelining=false in group vars.
# SSH-based hosts (nethost, tak) keep pipelining enabled via the [ssh_connection] above.
