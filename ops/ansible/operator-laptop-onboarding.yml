---
# operator-laptop-onboarding.yml
#
# Canonical IaC for putting (or re-verifying) an operator's laptop on
# the goat prod mesh (`netbird-prod.goat.example`).
#
# (ADR 1083 Track B6) — migrated from the legacy three-piece
# flow (wg-cp0-bundle-apply + wg-quick + hand-built patched netbird +
# setup-key `netbird up`) to the goat-client model:
#
#   - ONE client: goat-clientd (daemon, embeds the netbird fork with the
#     offline-CA baked via go:embed + the ADR 1081 L1 storm backoff) +
#     goat-client (CLI/GUI over local IPC). Installed from the signed
#     public release at https://get.goat.example (Cloudflare R2, ADR 1083),
#     SHA256SUMS-verified. No more `go build ./client`.
#   - ONE artifact: the v0.2 enrollment bundle (CBOR, ECDSA P-256-signed
#     by the offline CA) now carries `inner_mesh_setup` (netbird mgmt
#     URL + setup-key + rosenpass policy) in addition to the wg-cp0
#     material. goat-clientd in `combined` mode brings up BOTH layers
#     from that single bundle — the outer wg-cp0 tunnel and the inner
#     netbird mesh. No setup-key minting at onboarding time; the key is
#     minted at bundle-issuance time (operator-bundle-issuance.md).
#   - Mode decision: `combined`. The operator laptop wants both layers
#     from one daemon. `wg-cp0-only` bundles (pre-v0.2 mints without
#     inner_mesh_setup) are rejected at Phase 1 with re-mint
#     instructions — fail-closed, no silent half-onboarding.
#   - OS scope: macOS only, matching the legacy Phase 3.6 scope. Linux
#     operator boxes install goat-client per the goat-client README
#     (.deb/.rpm); wiring that into this playbook is a follow-on.
#
# Known-bad packaging repair (v0.3.4/v0.3.5): the .pkg's LaunchDaemon
# plist passes `--bundle-dir=` / `--ipc-socket=` / `--log-file=`, but
# goat-clientd registers `-bundle` / `-socket` (and no log flag) — Go's
# flag package exits on unknown flags, so the system daemon crash-loops
# as shipped. The .pkg also ships no trust-roots PEM, which is fatal at
# daemon start by design. Phase 3 repairs both: writes a corrected
# plist and seeds trust-roots from the committed offline-CA pubkey.
# Both tasks self-disarm once a fixed goat-client release ships (they
# gate on the bad-flag probe / file absence).
#
# Sister artifacts:
#   - docs/operations/operator-laptop-onboarding.md (canonical runbook)
#   - docs/operations/operator-bundle-issuance.md   (bundle mint — now
#     including the inner-mesh setup-key leg; this playbook does NOT
#     issue bundles: that requires age identity + allowlist commit +
#     relay-side wg-cp0-bootstrap.yml, a separate ceremony)
#
# Scope:
#   IN  — goat-client install (signed release from get.goat.example),
#         daemon repair (plist flags + trust roots), legacy-flow
#         teardown, bundle import, combined-mode bring-up, end-to-end
#         verification.
#   OUT — bundle issuance (separate ceremony, age identity + setup-key
#         mint required), relay-side allowlist push (separate ceremony,
#         AWS creds required). Both surface as fail-loud assertions at
#         Phase 1 so the operator knows to run them first when needed.
#
# Operator usage:
#
#   # one-shot, no inventory file needed. `-K` is REQUIRED on macOS —
#   # several phases become root and macOS sudo has no NOPASSWD by
#   # default. Ansible prompts once + caches for the run.
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES \
#     ansible-playbook -i localhost, --connection local -K \
#       ops/ansible/operator-laptop-onboarding.yml
#
#   # If your bundle device_id is not the autodetected one (the playbook
#   # picks the first op-* allowlist entry), pass it explicitly:
#   ... -e operator_device_id=op-laptop
#
#   # Verify-only (no changes; same exit-code semantics as a real run):
#   ... --check
#
# Idempotency contract:
#   - All apply tasks gate on a stat / version / checksum / status probe
#     before re-doing work. Re-running on a fully onboarded laptop is a
#     no-op and prints "✓ Already onboarded" at the end.
#   - Each phase emits a debug message naming the state it observed
#     and the action it took (or skipped). The full run is audit-clear.

- name: Operator laptop onboarding (goat prod mesh, goat-client model)
  hosts: localhost
  connection: local
  gather_facts: true
  become: false   # we'll become per-task only where needed

  vars:
    # The repo root, computed from the playbook path so this works no
    # matter where the operator invokes it from.
    repo_root: "{{ playbook_dir | dirname | dirname }}"

    # Allowlist + CA paths. The offline-CA ECDSA P-256 pubkey (Block 79
    # rotation; committed via the ops/enrollment/public-keys/*.pem
    # gitignore exception) doubles as goat-clientd's trust-roots PEM —
    # LoadTrustRootsFromPEM accepts raw PUBLIC KEY blocks.
    allowlist_path: "{{ repo_root }}/ops/enrollment/wg-cp0-bundle-allowlist.json"
    ca_pubkey_path: "{{ repo_root }}/ops/enrollment/public-keys/dev-goat-ca-ecdsa-2026-05-09.pem"
    bundle_state_dir: "{{ ansible_env.HOME }}/.goat/state"

    # Bundle metadata reader (built from ops/enrollment on demand).
    bundle_extract_bin: "{{ repo_root }}/ops/enrollment/cmd/bundle-extract/bundle-extract"

    # goat-client release install. get.goat.example is the signed public
    # release page (Cloudflare R2, ADR 1083 B5 — LIVE). Artifacts are
    # cosign-signed + SHA256SUMS-listed; the playbook verifies the
    # SHA256 against the fetched SHA256SUMS. Bump the version here on
    # each goat-client release cut.
    # 0.3.7 = the assay-validated wedge-fix release (identity stability,
    # mesh supervisor, F-269 token self-heal — 6/6 live checks PASS) +
    # peer-bound token carry + packaging fixes. Note the Phase 3
    # known-bad-packaging repairs below self-disarm against ≥0.3.6
    # artifacts (launchd plist + trust-roots ship correct).
    goat_client_version: "0.3.7"
    goat_download_base: "https://get.goat.example"
    goat_client_arch: "{{ 'arm64' if ansible_architecture == 'arm64' else 'amd64' }}"
    goat_client_dmg: "goat-client-{{ goat_client_version }}-{{ goat_client_arch }}.dmg"

    # goat-client install layout (macOS .pkg payload + postinstall).
    gc_support_dir: "/Library/Application Support/goat-client"
    gc_bundle_path: "{{ gc_support_dir }}/bundle.cbor"
    gc_trust_roots_path: "{{ gc_support_dir }}/trust-roots.pem"
    gc_config_path: "{{ gc_support_dir }}/config.toml"
    gc_daemon_bin: /usr/local/bin/goat-clientd
    gc_cli_bin: /usr/local/bin/goat-client
    gc_plist_path: /Library/LaunchDaemons/io.goat-maintainer.goat-clientd.plist
    gc_launchd_label: io.goat-maintainer.goat-clientd

    # Mesh-daemon integrity guard. `/usr/local/bin/netbird` is a symlink;
    # a legacy ceremony (block-79 offline-CA rotation, retired Phase 3.6) could
    # repoint it at the goat netbird fork `/opt/goat/bin/netbird-goat`,
    # silently swapping the operator laptop's mesh daemon. Whether the fork is
    # the RIGHT target is per-laptop policy: on a legacy daily-driver the
    # fork is sanctioned (goat-client.md); on a stock laptop it should be plain
    # netbird. So this is a DRIFT check against a declared expectation, not a
    # hard "fork = bad". Set per-laptop: "stock" | "fork" | "" (report only).
    operator_laptop_netbird_expected: ""
    netbird_symlink_path: /usr/local/bin/netbird
    netbird_fork_target: /opt/goat/bin/netbird-goat
    gc_ipc_socket: /var/run/goat-client/ipc.sock
    gc_daemon_addr: "unix://{{ gc_ipc_socket }}"

    # Mode decision (see header): combined = goat-clientd owns both the
    # outer wg-cp0 tunnel and the inner netbird mesh.
    goat_client_mode: combined

    # Goat prod mgmt-API identifiers — used for legacy-netbird
    # detection (Phase 4) and mesh-DNS wiring/verification only. The
    # enrollment itself comes from the bundle's inner_mesh_setup.
    mgmt_api_host: "mgmt.vega.netbird-prod.goat.example"
    mgmt_api_target_ip: "198.18.0.1"

    # Operator device_id may be passed via -e operator_device_id=<name>
    # to disambiguate when multiple op-* allowlist entries exist. When
    # unset, the playbook autodetects and uses the first one.
    operator_device_id: ""

  tasks:

    # ==================================================================
    # Phase 0 — pre-flight
    # ==================================================================
    - name: "This playbook is macOS-scoped (see header for Linux)"
      ansible.builtin.assert:
        that:
          - ansible_system == 'Darwin'
        fail_msg: |
          This playbook's goat-client install path is macOS-only (same
          scope as the legacy Phase 3.6 it replaced). On a Linux
          operator box, install goat-client per the goat-client README
          (.deb/.rpm from {{ goat_download_base }}), then import your
          bundle with `sudo goat-clientd --import-bundle <path>` and
          re-use the verification steps from
          docs/operations/operator-laptop-onboarding.md.

    - name: "Pre-flight — confirm bundle-extract binary built"
      ansible.builtin.stat:
        path: "{{ bundle_extract_bin }}"
      register: _bx_stat

    - name: "Build bundle-extract if missing (idempotent)"
      ansible.builtin.command:
        cmd: "go build -o {{ bundle_extract_bin }} ./cmd/bundle-extract"
        chdir: "{{ repo_root }}/ops/enrollment"
      when: not _bx_stat.stat.exists
      changed_when: true

    # ==================================================================
    # Phase 1 — discover state (bundle + allowlist)
    # ==================================================================
    - name: "Find operator allowlist entries (op-* pattern)"
      ansible.builtin.shell:
        cmd: |
          # Allowlist is the Block 22R.1 v2 envelope ({schema_version, peers:
          # [{name, wg_cp0_address, current_pubkey}, ...]}) ;
          # the v1 flat-list shape ([{name, address, pubkey}, ...]) is kept as
          # a fallback, mirroring wg-cp0-bootstrap.yml Pass 2A.
          jq -r '(if type == "object" then .peers else . end)
                 | map(select(.name | test("^op-")))
                 | .[] | "\(.name)|\(.wg_cp0_address // .address)|\(.current_pubkey // .pubkey)"' {{ allowlist_path | quote }}
      register: _allowlist_entries
      changed_when: false

    - name: "Fail loudly if zero operator allowlist entries"
      ansible.builtin.assert:
        that:
          - _allowlist_entries.stdout | trim | length > 0
        fail_msg: |
          No operator-named entries (op-*) in {{ allowlist_path }}.
          A bundle has not yet been issued for any operator laptop.

          Run the bundle-issuance ceremony first:
            docs/operations/operator-bundle-issuance.md

          That ceremony requires your age identity + an allowlist commit +
          a relay-side wg-cp0-bootstrap.yml run with usareur-af AWS creds
          — outside the scope of this playbook.

    - name: "Resolve operator_device_id (autodetect if unset)"
      ansible.builtin.set_fact:
        _resolved_device_id: >-
          {{
            operator_device_id
            if (operator_device_id | length > 0)
            else (_allowlist_entries.stdout_lines[0].split('|')[0])
          }}

    - name: "Resolve operator wg-cp0 address from allowlist"
      ansible.builtin.set_fact:
        _resolved_wg_addr: >-
          {{
            _allowlist_entries.stdout_lines
              | map('split', '|')
              | selectattr('0', 'equalto', _resolved_device_id)
              | map(attribute=1)
              | first
          }}

    - name: "Find bundle file matching device_id"
      ansible.builtin.find:
        paths: "{{ bundle_state_dir }}"
        patterns: "{{ _resolved_device_id }}.bundle.cbor,*{{ _resolved_device_id }}*.bundle.cbor"
        recurse: true
      register: _bundle_files

    - name: "Fail loudly if bundle file missing"
      ansible.builtin.assert:
        that:
          - _bundle_files.matched > 0
        fail_msg: |
          No bundle file found under {{ bundle_state_dir }} matching
          device_id "{{ _resolved_device_id }}". Allowlist says one was
          issued (entry at {{ _resolved_wg_addr }}), but the operator-
          side cbor isn't on this laptop.

          Either:
            - Re-issue the bundle (operator-bundle-issuance.md), OR
            - Locate the existing bundle (search other operator
              workstations or the OOB-delivery channel) and place it
              under {{ bundle_state_dir }}/.

    - name: "Fix the bundle path (newest match wins if multiple)"
      ansible.builtin.set_fact:
        _bundle_file_path: >-
          {{
            (_bundle_files.files | sort(attribute='mtime', reverse=true) | first).path
          }}

    - name: "Read bundle metadata"
      ansible.builtin.command:
        argv:
          - "{{ bundle_extract_bin }}"
          - --field
          - "{{ item }}"
          - "{{ _bundle_file_path }}"
      register: _bundle_meta
      loop: [site, device_id, activation_deadline, expires_at, has_inner_mesh]
      changed_when: false

    - name: "Surface bundle metadata"
      ansible.builtin.debug:
        msg: |
          Bundle:           {{ _bundle_file_path }}
          Site:             {{ _bundle_meta.results[0].stdout }}
          Device:           {{ _bundle_meta.results[1].stdout }}
          Activate by:      {{ _bundle_meta.results[2].stdout }}
          Expires:          {{ _bundle_meta.results[3].stdout }}
          Inner mesh:       {{ 'yes (combined-mode eligible)' if (_bundle_meta.results[4].stdout | trim == 'true') else 'NO — wg-cp0-only bundle' }}
          wg-cp0 address:   {{ _resolved_wg_addr }} (from allowlist)

    - name: "Assert bundle carries inner_mesh_setup (combined-mode eligible)"
      # Pre-v0.2 bundles carry only the wg-cp0 material. The combined
      # onboarding this playbook drives needs the netbird mgmt URL +
      # setup-key INSIDE the bundle — fail-closed rather than silently
      # onboarding half a laptop.
      ansible.builtin.assert:
        that:
          - _bundle_meta.results[4].stdout | trim == 'true'
        fail_msg: |
          The bundle at {{ _bundle_file_path }} has no inner_mesh_setup
          field — it predates the v0.2 bundle format (or was minted
          without the --inner-mesh-* flags) and can only drive
          wg-cp0-only mode.

          Re-mint per docs/operations/operator-bundle-issuance.md
          §"Inner-mesh setup (operator laptops)": mint a netbird
          setup-key on the mgmt-host, then pass
            --inner-mesh-mgmt-url https://{{ mgmt_api_host }}:443
            --inner-mesh-setup-key <KEY>
          to bundle-create, deliver the new cbor to this laptop, and
          re-run this playbook.

    # ==================================================================
    # Phase 2 — install goat-client from the signed public release
    # ==================================================================
    - name: "Probe installed goat-client pkg receipt"
      ansible.builtin.command:
        argv: [pkgutil, --pkg-info, io.goat-maintainer.goat-client]
      register: _gc_pkg_info
      changed_when: false
      failed_when: false

    - name: "Parse installed version"
      ansible.builtin.set_fact:
        _gc_installed_version: >-
          {{
            (_gc_pkg_info.stdout | regex_search('version:\s+(\S+)', '\1') | first)
            if (_gc_pkg_info.rc == 0) else ''
          }}

    - name: "Download goat-client {{ goat_client_version }} dmg (SHA256SUMS-verified)"
      # get_url's checksum-URL form fetches SHA256SUMS from the release
      # page and matches the artifact's line — download + integrity
      # check in one step. The artifacts are additionally cosign-signed;
      # cosign verification is documented in the runbook for operators
      # who want the stronger check.
      ansible.builtin.get_url:
        url: "{{ goat_download_base }}/{{ goat_client_dmg }}"
        dest: "/tmp/{{ goat_client_dmg }}"
        checksum: "sha256:{{ goat_download_base }}/SHA256SUMS"
        mode: "0644"
      when: _gc_installed_version != goat_client_version
      register: _gc_download

    - name: "Install goat-client .pkg (LaunchDaemon + app + CLI symlink)"
      # The dmg wraps a .pkg ("Install goat-client <ver>.pkg"); its
      # postinstall registers the LaunchDaemon, creates the support/log
      # dirs, seeds config.toml (mode from GOAT_MODE, default combined)
      # and symlinks /usr/local/bin/goat-client.
      become: true
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          MNT=$(mktemp -d /tmp/goat-client-dmg.XXXXXX)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "/tmp/{{ goat_client_dmg }}" >/dev/null
          trap 'hdiutil detach "$MNT" >/dev/null || true' EXIT
          PKG=$(/bin/ls "$MNT"/*.pkg | head -1)
          [ -n "$PKG" ] || { echo "no .pkg inside the dmg" >&2; exit 1; }
          GOAT_MODE={{ goat_client_mode }} installer -pkg "$PKG" -target /
        executable: /bin/bash
      when: _gc_installed_version != goat_client_version
      register: _gc_install
      changed_when: _gc_install.rc == 0

    - name: "Surface install state"
      ansible.builtin.debug:
        msg: |
          goat-client install state:
            wanted:    {{ goat_client_version }} ({{ goat_client_arch }})
            installed: {{ _gc_installed_version if (_gc_installed_version | length > 0) else '(none)' }}{{ ' → installed this run from ' + goat_download_base if (_gc_install.changed | default(false)) else ' (already current)' }}

    # ==================================================================
    # Phase 2b — mesh-daemon integrity guard
    #
    # `/usr/local/bin/netbird` is a symlink; a legacy ceremony could
    # repoint it at the goat netbird fork, silently swapping the mesh
    # daemon (the operator-laptop half of the lockout). This
    # DETECTS what it currently resolves to + the signing identity, and
    # DRIFT-CHECKS against operator_laptop_netbird_expected. It never
    # mutates the symlink (policy is per-laptop — the fork is sanctioned
    # on legacy daily-drivers). Reports when the expectation is unset.
    # ==================================================================
    - name: "Resolve the netbird mesh-daemon symlink"
      ansible.builtin.stat:
        path: "{{ netbird_symlink_path }}"
        follow: false
      register: _nb_link

    - name: "Read the symlink's real target + signing identity"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          tgt=$(readlink -f {{ netbird_symlink_path }} 2>/dev/null || true)
          echo "target=${tgt:-<none>}"
          if [ -n "$tgt" ] && [ -e "$tgt" ]; then
            id=$(codesign -dv --verbose=2 "$tgt" 2>&1 | awk -F= '/^Authority=/{print $2; exit}')
            echo "identity=${id:-<unsigned/unknown>}"
          else
            echo "identity=<no target>"
          fi
        executable: /bin/bash
      register: _nb_target
      changed_when: false
      failed_when: false

    - name: "Parse the resolved target"
      ansible.builtin.set_fact:
        _nb_resolved: "{{ (_nb_target.stdout_lines | select('match', '^target=') | first | default('target=<none>')).split('=', 1)[1] }}"
        _nb_identity: "{{ (_nb_target.stdout_lines | select('match', '^identity=') | first | default('identity=<none>')).split('=', 1)[1] }}"
        _nb_is_fork: "{{ netbird_fork_target in (_nb_target.stdout | default('')) }}"

    - name: "Report mesh-daemon identity"
      ansible.builtin.debug:
        msg: |
          netbird mesh daemon ({{ netbird_symlink_path }}):
            resolves to: {{ _nb_resolved }}{{ ' (goat FORK)' if _nb_is_fork else ' (stock/other)' }}
            signed by:   {{ _nb_identity }}
            expected:    {{ operator_laptop_netbird_expected if operator_laptop_netbird_expected | length > 0 else '(not declared — report only; set operator_laptop_netbird_expected to stock|fork to enforce)' }}

    - name: "Fail on mesh-daemon drift from the declared expectation"
      ansible.builtin.assert:
        that:
          - (operator_laptop_netbird_expected != 'stock') or (not _nb_is_fork)
          - (operator_laptop_netbird_expected != 'fork') or (_nb_is_fork)
        fail_msg: >-
          netbird mesh daemon drift: {{ netbird_symlink_path }} resolves to
          {{ _nb_resolved }} ({{ 'fork' if _nb_is_fork else 'stock/other' }}) but
          operator_laptop_netbird_expected={{ operator_laptop_netbird_expected }}.
          The mesh daemon was swapped out from under the laptop. Revert with:
          sudo ln -sf {{ '/Applications/NetBird.app/Contents/MacOS/netbird' if operator_laptop_netbird_expected == 'stock' else netbird_fork_target }} {{ netbird_symlink_path }}
          then `sudo launchctl kickstart -k system/netbird`.
        success_msg: "netbird mesh daemon matches the declared expectation ({{ operator_laptop_netbird_expected }})."
      when: operator_laptop_netbird_expected | length > 0

    # ==================================================================
    # Phase 3 — daemon config repair + trust roots
    #
    # Two gaps in the shipped v0.3.4/v0.3.5 .pkg, both fatal to the
    # system daemon (source-verified against the goat-client repo):
    #   (a) The LaunchDaemon plist passes --bundle-dir= / --ipc-socket=
    #       / --log-file=, but goat-clientd registers -bundle / -socket
    #       (and no log flag). Go's flag package exits on unknown flags
    #       → the daemon crash-loops under launchd's KeepAlive.
    #   (b) No trust-roots PEM is shipped or seeded, and a missing
    #       trust-roots file is fatal at daemon start (by design: no
    #       roots = every bundle import rejected).
    # Repair both here. Each task gates on the broken state, so a fixed
    # goat-client release makes them no-ops. Durable fix tracked in the
    # goat-client repo (packaging plist + trust-roots seeding).
    # ==================================================================
    - name: "Seed goat-clientd trust roots from the committed offline-CA pubkey"
      become: true
      ansible.builtin.copy:
        src: "{{ ca_pubkey_path }}"
        dest: "{{ gc_trust_roots_path }}"
        owner: root
        mode: "0644"
      register: _gc_trust_seeded

    - name: "Probe LaunchDaemon plist for the known-bad flag set"
      ansible.builtin.command:
        argv: [grep, -c, -e, "--bundle-dir=", "{{ gc_plist_path }}"]
      register: _gc_plist_bad
      changed_when: false
      failed_when: false

    - name: "Repair LaunchDaemon plist (correct daemon flags)"
      become: true
      ansible.builtin.copy:
        dest: "{{ gc_plist_path }}"
        owner: root
        group: wheel
        mode: "0644"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <!--
              Repaired by ops/ansible/operator-laptop-onboarding.yml
              (goat-client <= v0.3.5 shipped this plist with flag names
              the daemon does not register; see the playbook header).
              Overwritten only while the shipped plist carries the bad
              flags — a fixed release's plist is left alone.
          -->
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>{{ gc_launchd_label }}</string>
              <key>ProgramArguments</key>
              <array>
                  <string>{{ gc_daemon_bin }}</string>
                  <string>-bundle={{ gc_bundle_path }}</string>
                  <string>-trust-roots={{ gc_trust_roots_path }}</string>
                  <string>-config={{ gc_config_path }}</string>
                  <string>-socket={{ gc_ipc_socket }}</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <dict>
                  <key>SuccessfulExit</key>
                  <false/>
                  <key>Crashed</key>
                  <true/>
              </dict>
              <key>ThrottleInterval</key>
              <integer>5</integer>
              <key>StandardErrorPath</key>
              <string>/var/log/goat-client/goat-clientd.stderr.log</string>
              <key>StandardOutPath</key>
              <string>/var/log/goat-client/goat-clientd.stdout.log</string>
              <key>SoftResourceLimits</key>
              <dict>
                  <key>NumberOfFiles</key>
                  <integer>4096</integer>
              </dict>
          </dict>
          </plist>
      when: (_gc_plist_bad.stdout | default('0') | trim | int) > 0
      register: _gc_plist_repaired

    - name: "Reload the daemon if plist or trust roots changed"
      become: true
      ansible.builtin.shell:
        cmd: |
          set -e
          if launchctl print system/{{ gc_launchd_label }} >/dev/null 2>&1; then
            launchctl bootout system "{{ gc_plist_path }}" || true
          fi
          launchctl bootstrap system "{{ gc_plist_path }}"
          launchctl kickstart -k system/{{ gc_launchd_label }}
        executable: /bin/bash
      when: (_gc_plist_repaired.changed | default(false)) or (_gc_trust_seeded.changed | default(false))
      changed_when: true

    - name: "Surface daemon config state"
      ansible.builtin.debug:
        msg: |
          goat-clientd config state:
            trust roots: {{ gc_trust_roots_path }}{{ ' (seeded this run)' if (_gc_trust_seeded.changed | default(false)) else ' (already present)' }}
            plist:       {{ 'repaired this run (shipped flags were broken)' if (_gc_plist_repaired.changed | default(false)) else ('shipped plist is clean' if (_gc_plist_bad.stdout | default('0') | trim | int) == 0 else 'repair pending') }}

    # ==================================================================
    # Phase 4 — legacy-flow teardown (migration path)
    #
    # Laptops onboarded under the pre-B6 flow have (a) a wg-quick-managed
    # wg-cp0 interface holding the SAME WireGuard identity the bundle
    # carries — two holders of one identity fight over the relay
    # handshake — and (b) a stock/patched netbird daemon enrolled against
    # goat prod. Both must be down before goat-clientd connects. The
    # netbird daemon itself is left installed: operators still use it for
    # OTHER meshes (e.g. the legacy dev/test profile). Only a
    # goat-prod-connected session is brought down.
    # ==================================================================
    - name: "Probe legacy wg-quick wg-cp0 interface"
      become: true
      ansible.builtin.shell:
        cmd: |
          set +e
          command -v wg >/dev/null 2>&1 || { echo "no-wg-tools"; exit 0; }
          if [ -f /var/run/wireguard/wg-cp0.name ] || wg show wg-cp0 latest-handshakes >/dev/null 2>&1; then
            echo "up"
          else
            echo "down"
          fi
      register: _legacy_wg_state
      changed_when: false

    - name: "Tear down legacy wg-quick wg-cp0 (goat-clientd owns it now)"
      become: true
      ansible.builtin.shell:
        cmd: |
          set +e
          wg-quick down /etc/wireguard/wg-cp0.conf 2>/dev/null \
            || wg-quick down wg-cp0 2>/dev/null \
            || wg-quick down /opt/homebrew/etc/wireguard/wg-cp0.conf 2>/dev/null
          rm -f /var/run/wireguard/wg-cp0.name
          exit 0
      when: _legacy_wg_state.stdout | trim == 'up'
      changed_when: true

    - name: "Probe legacy netbird daemon for a goat-prod session"
      ansible.builtin.command: netbird status
      register: _legacy_nb_status
      changed_when: false
      failed_when: false

    - name: "Bring down legacy netbird goat-prod session"
      become: true
      ansible.builtin.command: netbird down
      when:
        - _legacy_nb_status.rc == 0
        - "'Connected' in (_legacy_nb_status.stdout | default(''))"
        - (mgmt_api_target_ip in (_legacy_nb_status.stdout | default(''))) or (mgmt_api_host in (_legacy_nb_status.stdout | default('')))
      register: _legacy_nb_down
      changed_when: _legacy_nb_down.rc == 0

    - name: "Surface legacy teardown state"
      ansible.builtin.debug:
        msg: |
          Legacy-flow state:
            wg-quick wg-cp0:  {{ _legacy_wg_state.stdout | trim }}{{ ' → torn down this run' if (_legacy_wg_state.stdout | trim == 'up') else '' }}
            netbird goat-prod: {{ 'was connected → brought down this run' if (_legacy_nb_down.changed | default(false)) else 'not connected (no action)' }}

          The netbird daemon/app is left installed — it still serves
          non-goat-prod profiles (e.g. legacy dev/test). goat prod
          now runs exclusively through goat-clientd.

    # ==================================================================
    # Phase 5 — import the bundle + bring up combined mode
    # ==================================================================
    - name: "Compare staged bundle vs persisted bundle"
      become: true
      ansible.builtin.shell:
        cmd: |
          set +e
          if [ ! -f "{{ gc_bundle_path }}" ]; then
            echo "import-needed"
          elif cmp -s "{{ _bundle_file_path }}" "{{ gc_bundle_path }}"; then
            echo "current"
          else
            echo "import-needed"
          fi
      register: _gc_bundle_cmp
      changed_when: false

    - name: "Assert bundle activation_deadline is in the future (import only)"
      # Only enforced when an import is actually needed — an
      # already-imported bundle past its ACTIVATION deadline (but inside
      # expires_at) keeps working by design.
      ansible.builtin.assert:
        that:
          - (_bundle_meta.results[2].stdout | trim | to_datetime('%Y-%m-%dT%H:%M:%SZ')) > (ansible_date_time.iso8601 | to_datetime('%Y-%m-%dT%H:%M:%SZ'))
        fail_msg: |
          Bundle activation deadline ({{ _bundle_meta.results[2].stdout }})
          is in the past. Re-issue per operator-bundle-issuance.md.
      when: _gc_bundle_cmp.stdout | trim == 'import-needed'

    - name: "Import bundle (goat-clientd one-shot: verify + persist)"
      become: true
      ansible.builtin.command:
        argv:
          - "{{ gc_daemon_bin }}"
          - "-bundle={{ gc_bundle_path }}"
          - "-trust-roots={{ gc_trust_roots_path }}"
          - "-config={{ gc_config_path }}"
          - "-import-bundle={{ _bundle_file_path }}"
      when: _gc_bundle_cmp.stdout | trim == 'import-needed'
      register: _gc_import
      changed_when: _gc_import.rc == 0

    - name: "Kickstart the daemon (loads persisted bundle; auto-connect on)"
      become: true
      ansible.builtin.command:
        argv: [launchctl, kickstart, -k, "system/{{ gc_launchd_label }}"]
      when: _gc_import.changed | default(false)
      changed_when: true

    - name: "Ensure mode {{ goat_client_mode }}"
      become: true
      ansible.builtin.shell:
        cmd: |
          set -e
          CUR=$({{ gc_cli_bin | quote }} getmode --daemon-addr {{ gc_daemon_addr | quote }})
          if [ "$CUR" != "{{ goat_client_mode }}" ]; then
            {{ gc_cli_bin | quote }} setmode {{ goat_client_mode }} --daemon-addr {{ gc_daemon_addr | quote }}
            echo "switched"
          else
            echo "already"
          fi
        executable: /bin/bash
      register: _gc_mode
      changed_when: "'switched' in _gc_mode.stdout"
      retries: 6
      delay: 5
      until: _gc_mode.rc == 0

    - name: "Connect (idempotent; no-op when auto-connect already did it)"
      become: true
      ansible.builtin.command:
        argv: ["{{ gc_cli_bin }}", connect, --daemon-addr, "{{ gc_daemon_addr }}"]
      register: _gc_connect
      changed_when: false

    # ==================================================================
    # Phase 6 — mesh-internal DNS resolution
    # ==================================================================
    # Mesh-internal hostnames like mgmt.vega.netbird-prod.goat.example
    # don't exist in public DNS — they resolve via the per-site CoreDNS
    # bound to wg-cp0 IPs (Block 79 mesh-coredns role). goat-clientd's
    # names-fronting forwarder (ADR 1082) fronts the OS mesh-zone DNS
    # only when the bundle carries mesh_dns_* config keys — current
    # bundles don't, so the explicit resolver wiring below stays
    # load-bearing.
    #
    #   1. macOS /etc/resolver/<domain>: "for this domain, use these
    #      nameservers." Survives reboots. CoreDNS listens on UDP 5353
    #      (container can't bind 53); /etc/resolver supports `port`.
    #   2. /etc/hosts entry (belt-and-suspenders fallback) for the
    #      mgmt-API hostname. Both layers are idempotent.

    - name: "Ensure /etc/resolver directory exists"
      ansible.builtin.file:
        path: /etc/resolver
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      become: true

    - name: "Write /etc/resolver/netbird-prod.goat.example split-DNS config"
      ansible.builtin.copy:
        dest: /etc/resolver/netbird-prod.goat.example
        owner: root
        group: wheel
        mode: "0644"
        content: |
          # Block 79 split-DNS — resolves *.netbird-prod.goat.example via the
          # per-site CoreDNS bound to the wg-cp0 silent control plane.
          # Generated by ops/ansible/operator-laptop-onboarding.yml.
          # Idempotent: re-running the playbook overwrites with the same
          # content; manual edits here are clobbered.
          #
          # Both vega-A (198.18.0.1) and vega-B (198.18.0.5) advertise
          # the same mesh-hosts zone; macOS resolver tries them in order
          # and falls through on no-response.
          domain netbird-prod.goat.example
          nameserver 198.18.0.1
          nameserver 198.18.0.5
          nameserver 198.18.0.6
          nameserver 198.18.0.7
          nameserver 198.18.0.8
          port 5353
      become: true

    - name: "/etc/hosts fallback — ensure mgmt-API hostname maps to wg-cp0 IP"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ mgmt_api_host | regex_escape }}(\s|$)'
        line: "{{ mgmt_api_target_ip }}  {{ mgmt_api_host }}  # Block 79 — operator-laptop-onboarding.yml mgmt-API mapping"
        state: present
        backup: false
      become: true

    - name: "Smoke-test mesh-DNS resolution"
      ansible.builtin.command:
        cmd: dig +short +time=2 +tries=1 +port=5353 "@198.18.0.1" "{{ mgmt_api_host }}"
      register: _mesh_dns_smoke
      changed_when: false
      failed_when: false

    - name: "Surface DNS resolution state"
      ansible.builtin.debug:
        msg: |
          mesh-DNS resolution state:
            /etc/resolver/netbird-prod.goat.example: present (idempotent)
            /etc/hosts entry for {{ mgmt_api_host }}: present (idempotent)
            Smoke-test (dig @198.18.0.1:5353 {{ mgmt_api_host }}): {{ (_mesh_dns_smoke.stdout | default('(no answer)')).strip() | default('(no answer)', true) }}

    # ==================================================================
    # Phase 7 — trust the offline-CA root in the macOS System keychain
    #
    # goat-clientd needs no OS trust store — the embedded netbird fork
    # bakes the offline-CA root via go:embed (client/grpc/dialer.go) and
    # bundle verification uses the trust-roots PEM from Phase 3. This
    # import serves the BROWSER: dashboard + mesh-service TLS leaves are
    # signed by the offline CA, and Safari/Chrome read the System
    # keychain. ECDSA P-256 root (Block 79 rotation) imports cleanly;
    # Ed25519 roots could not.
    # ==================================================================
    - name: "Probe System keychain for offline-CA root"
      ansible.builtin.command:
        argv:
          - security
          - find-certificate
          - -c
          - "goat Root CA"
          - /Library/Keychains/System.keychain
      register: _keychain_probe
      changed_when: false
      failed_when: false

    - name: "Import offline-CA ECDSA root into System keychain (idempotent)"
      become: true
      ansible.builtin.command:
        argv:
          - security
          - add-trusted-cert
          - -d
          - -r
          - trustRoot
          - -k
          - /Library/Keychains/System.keychain
          - "{{ repo_root }}/ops/enrollment/ca/dev/root-cert.pem"
      when: _keychain_probe.rc != 0
      register: _keychain_import
      changed_when: _keychain_import.rc == 0

    # ==================================================================
    # Phase 8 — verify end-to-end
    # ==================================================================
    - name: "Wait for goat-client to report connected (both layers)"
      become: true
      ansible.builtin.command:
        argv: ["{{ gc_cli_bin }}", status, --daemon-addr, "{{ gc_daemon_addr }}"]
      register: _gc_status
      changed_when: false
      retries: 12
      delay: 5
      # `state: connected` (not `connecting`/`error`) — the \s+connected$
      # anchor via word-boundary keeps `connecting` from matching.
      until: (_gc_status.stdout | default('')) is search('state:\s+connected(\s|$)')

    - name: "Verify mesh DNS resolves a goat prod hostname"
      ansible.builtin.command: dig +short +time=2 +tries=1 dashboard.vega.netbird-prod.goat.example
      register: _dns_probe
      changed_when: false
      failed_when: false

    - name: "Final summary"
      ansible.builtin.debug:
        msg: |
          ✓ Onboarding complete (goat-client model).

          goat-client status:
          {{ _gc_status.stdout | indent(10) }}

          Dashboard:  https://dashboard.vega.netbird-prod.goat.example/
          wg-cp0:     {{ _resolved_wg_addr }} ({{ _resolved_device_id }}) — owned by goat-clientd ({{ goat_client_mode }} mode)
          DNS probe:  {{ _dns_probe.stdout | default('(no answer)') }}

          Re-run this playbook any time to verify state. Inspect the
          daemon with:
            sudo goat-client status --daemon-addr {{ gc_daemon_addr }}
            tail -f /var/log/goat-client/goat-clientd.stderr.log
