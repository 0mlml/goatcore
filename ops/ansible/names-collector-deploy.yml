---
# SPDX-License-Identifier: Apache-2.0
#
# Deploy the passive self-claims collector (ADR 1082 Amendment 2 §7.3) on a
# goatnet mgmt host. Subscribes ops/names/claim/** and maintains claims.json
# in the goat-get www dir so devices fetch verified peer self-claims beside
# the signed snapshot.
#
# Target a specific goatnet with `-e target=<group>` (default zagros_hosts).
#
# Pre-flight (operator-side):
#   1. Leaf cert minted via the offline-CA cert-sign ceremony —
#      CN=names-collector-trial-peer, --eku clientAuth — at
#      ops/enrollment/<site>/names-collector-{cert,key}.pem. Its CN is
#      covered by the router's existing trial-peer-r-all read rule; no new
#      ACL rule is required.
#   2. goat-get already deployed (this role reuses its staged goat binary).
#   3. zenoh-router up on the mgmt host.
#
# Usage:
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES \
#     ../scripts/ansible-preflight.sh -i inventory/hosts.ini \
#     -i inventory/mgmt-hosts-mesh.ini -l mgmt-zagros-01-thor \
#     -e target=zagros_hosts names-collector-deploy.yml
#
# Cross-ref: docs/design/name-fallback-resolver.md §7.3.

- name: names-collector | deploy
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true
  roles:
    - names-collector
