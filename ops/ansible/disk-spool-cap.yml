---
# SPDX-License-Identifier: Apache-2.0
#
# Put byte ceilings on a mgmt host's append-only spools.
#
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES ../scripts/ansible-preflight.sh \
#     -i inventory/mgmt-hosts.ini -i inventory/mgmt-hosts-mesh.ini \
#     disk-spool-cap.yml -e target=zagros_hosts
#
# Safe to re-run: it renders a script, a unit and a timer, then trims once.
# A host with no declared spools gets the timer stopped and nothing deleted.
- name: byte ceilings for mgmt-host spools
  hosts: "{{ target | mandatory }}"
  become: true
  gather_facts: true

  roles:
    - role: disk-spool-cap
