---
galaxy_info:
  role_name: minio
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    when: minio_enabled | default(true) | bool
    vars:
      rollback_component: minio
      rollback_artifact_type: data
      rollback_ref: "{{ minio_image }}"
      rollback_restore_pointer: "MinIO bucket data — restore from replication/backup; audit is Object-Lock (ADR 0811); an image re-pin does NOT restore objects"
