---
- name: minio compose changed
  ansible.builtin.command:
    cmd: docker compose up -d minio
    chdir: "{{ minio_compose_dir }}"
  changed_when: true

# Local handler — Prometheus is in obs-host's compose project, not ours.
# The /-/reload endpoint picks up new rule files without restart.
- name: prometheus reload from minio role
  ansible.builtin.uri:
    url: http://localhost:9090/-/reload
    method: POST
    status_code: 200
  failed_when: false
