---
galaxy_info:
  role_name: goat_peering_wg
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Config artifact: rollback is a revert
# of the declaration plus a re-run.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: "goat-peering-wg"
      rollback_artifact_type: config
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after the checks
      rollback_ref: "{{ peering_wg_interface }} {{ peering_wg_our_sovereign | default('') }}->{{ peering_wg_partner_sovereign | default('') }} mtu={{ peering_wg_mtu }}"
