---
# Parse-only fixture for the goat-peering-wg role. Values are from the ISO 3166-1
# user-assigned range and the RFC 3927 link-local range, so nothing here can be
# mistaken for a real peering.
- name: goat-peering-wg | parse-only fixture
  hosts: localhost
  gather_facts: false
  vars:
    peering_wg_enabled: true
    goat_peering_transport_kind: wireguard
    goat_peering_our_sovereign: xab
    goat_peering_partner_sovereign: xaa
    goat_peering_local_link_ip: 169.254.10.1
    goat_peering_remote_link_ip: 169.254.10.0
    peering_wg_fips_waived_reason: "parse-only fixture; no host"
  roles:
    - role: ../..
