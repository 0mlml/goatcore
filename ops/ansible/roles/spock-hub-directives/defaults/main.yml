---
# spock-hub-directives (ADR 1205). Carries out the hub's directives at this
# site: sever and restore of a site, and identity edits for identities this
# site owns. Applied with spock-mesh-peering, which installs the ledger.

# The goatnet's hub: the Spock node name of its highest-echelon site. No
# default: the operator declares it per goatnet, and the role refuses to run
# without it. Every site of one goatnet sets the same value.
# goatnet_hub_site: zagros

# This site's Spock node name, derived as spock-mesh-peering derives it.
spock_hub_directives_site: >-
  {{ (site_id | replace('-', '_')) ~ ('_a' if (intra_site_pair | default(false) | bool) else '') }}

spock_hub_directives_enabled: true
spock_hub_directives_install_dir: /usr/local/sbin
spock_hub_directives_env_file: /etc/spock-hub-directives.env
spock_hub_directives_textfile_dir: /var/lib/node_exporter/textfile
spock_hub_directives_interval_sec: 30

# The Spock databases at this site; sever and restore act on every one.
spock_hub_directives_dbs: "{{ ['netbird'] + (['kratos', 'hydra'] if (ory_spock_enabled | default(false) | bool) else []) }}"

# Local Postgres container (psql runs inside it, no password) and Kratos admin.
spock_hub_directives_postgres_container: "{{ spock_mesh_postgres_container | default('postgres-a') }}"
spock_hub_directives_kratos_admin: "{{ 'http://127.0.0.1:4434' if (ory_spock_enabled | default(false) | bool) else '' }}"
