---
galaxy_info:
  role_name: grant_keyd
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). grant-keyd's container is an
# `image` artifact — rollback = re-pin + recreate. (The bundles it PUBLISHES are
# data on the fabric: those rotate-forward, not un-publish; stopping the daemon
# lets generations lapse. rollback.sh refuses data-type reversal by design.)
dependencies:
  - role: rollback-ledger
    when: grant_keyd_enabled | default(true) | bool
    vars:
      rollback_component: grant-keyd
      rollback_artifact_type: image
      rollback_ref: "{{ grant_keyd_image }}"
