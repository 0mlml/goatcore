---
# Declared end state (ADR 1206): a site that sets `grant_keyd_enabled: false` in its
# group_vars does not run grant-keyd, so no play that reaches this role deploys it.
# Unset keeps the role's long-standing behaviour (deploy). The gate that keeps
# this true for every catalog service: ops/ci/check-role-honours-presence-flag.py.
- name: grant-keyd | deploy (skipped where the site declares grant_keyd_enabled false)
  ansible.builtin.import_tasks: deploy.yml
  when: grant_keyd_enabled | default(true) | bool
