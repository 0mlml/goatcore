---
- name: restart machine-provenance-guard timer
  ansible.builtin.systemd:
    name: machine-provenance-guard.timer
    state: restarted
    daemon_reload: true
  when: machine_provenance_guard_enabled | bool

- name: reload prometheus for machine-provenance-guard
  # SIGHUP the running prometheus rather than restarting the stack: a rules
  # change must not bounce scraping for everything else on the host.
  ansible.builtin.shell: |
    set -e
    cid=$(docker ps -q --filter "name=prometheus" | head -1)
    [ -n "$cid" ] && docker kill -s HUP "$cid" >/dev/null && echo reloaded || echo "no prometheus container — skipped"
  changed_when: true
  failed_when: false
