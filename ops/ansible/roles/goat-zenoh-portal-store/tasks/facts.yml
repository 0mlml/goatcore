---
# Prints the store facts this goatnet declares. The cutover and rollback
# playbooks include this file (public) as their first role touch, which makes
# the role's defaults visible to them without running anything else.
- name: goat-zenoh-portal-store | declared store and Postgres database
  ansible.builtin.debug:
    msg: >-
      declared store={{ portal_store }};
      database {{ portal_db_name }} on {{ portal_db_container }} owned by {{ portal_db_user }};
      password from {{ portal_db_password_env }};
      archive root {{ portal_sqlite_archive_root }}
