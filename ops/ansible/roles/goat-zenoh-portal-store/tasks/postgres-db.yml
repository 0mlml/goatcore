---
# The portal registry's Postgres database on postgres-a (ADR 1165 step A).
# Idempotent: re-running changes nothing on a provisioned host.
#
# Same mechanism as the spire, admit-audit and id console roles: `docker exec
# postgres-a psql` as the superuser (no psycopg2 on the host, no remote
# connection), the login role's password from the deployer's environment
# (ADR 1186), and a grep-then-append pg_hba line followed by pg_reload_conf().
# The same pg_hba line is baked into ops/postgres/spock/conf/pg_hba.conf so a
# rebuilt image carries it; the runtime append covers the image every host runs
# today.
#
# Inputs: postgres_superuser_password (-e, as every other playbook that touches
# postgres-a takes it), portal_db_password (role default, env).
#
# Not replicated: the database may not appear in spock_mesh_databases, and may
# not carry the spock extension. Both are asserted below, so a later group_vars
# edit that names it fails here rather than wiring a repset.

- name: goat-zenoh-portal-store | postgres — inputs present
  ansible.builtin.assert:
    that:
      - postgres_superuser_password | default('') | length > 0
      - portal_db_password | default('') | length > 0
    fail_msg: >-
      Provisioning the portal registry database needs postgres_superuser_password
      (pass -e postgres_superuser_password=..., the <SITE>_PG_PASS value) and
      {{ portal_db_password_env }} in the environment. Run through
      ops/scripts/with-secrets so both resolve from the secret store (ADR 1186).
    quiet: true

- name: goat-zenoh-portal-store | postgres — the registry database is not federated (step A)
  ansible.builtin.assert:
    that:
      - >-
        portal_db_name not in
        (spock_mesh_databases | default([]) | map(attribute='name') | list)
    fail_msg: >-
      spock_mesh_databases names {{ portal_db_name }}. ADR 1165 step A keeps the
      portal registry out of every Spock replication set; it joins only at step 6
      of docs/project/island-mode-program.md, after the step B schema.
    quiet: true

- name: goat-zenoh-portal-store | postgres — postgres-a accepts connections
  ansible.builtin.command:
    argv: ["docker", "exec", "{{ portal_db_container }}", "pg_isready", "-U", "postgres"]
  changed_when: false

# The portal reaches postgres-a by name over a docker network both containers
# join. The portal joins portal_traefik_network (mgmt); a postgres-a that is not
# on it would leave a Postgres-era portal unable to resolve its DSN host.
- name: goat-zenoh-portal-store | postgres — networks postgres-a is on
  ansible.builtin.command:
    argv: ["docker", "inspect", "--format", !unsafe '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}', "{{ portal_db_container }}"]
  register: gzps_pg_networks
  changed_when: false

- name: goat-zenoh-portal-store | postgres — postgres-a shares a network with the portal
  ansible.builtin.assert:
    that:
      - (portal_traefik_network | default('mgmt')) in (gzps_pg_networks.stdout | split)
    fail_msg: >-
      {{ portal_db_container }} is on [{{ gzps_pg_networks.stdout | trim }}]; the portal
      joins {{ portal_traefik_network | default('mgmt') }}. The DSN host
      {{ portal_db_host }} would not resolve from the portal container.
    quiet: true

- name: goat-zenoh-portal-store | postgres — create the login role if missing
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - "{{ portal_db_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -tAc
      - >-
        DO $$ BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ portal_db_user }}') THEN
        CREATE ROLE {{ portal_db_user }} LOGIN; RAISE NOTICE 'created';
        END IF; END $$;
  register: gzps_pg_role
  changed_when: "'created' in gzps_pg_role.stderr"
  no_log: true

# Re-asserted every run, as admit-audit does, so a rotation is a re-run with the
# new value. The value is the same on an ordinary run, so it reports unchanged.
- name: goat-zenoh-portal-store | postgres — set the login role's password
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - "{{ portal_db_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -tAc
      - "ALTER ROLE {{ portal_db_user }} WITH LOGIN PASSWORD '{{ portal_db_password | replace(\"'\", \"''\") }}'"
  changed_when: false
  no_log: true

- name: goat-zenoh-portal-store | postgres — read the current owner of the database
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - "{{ portal_db_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -tAc
      - "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '{{ portal_db_name }}'"
  register: gzps_pg_owner
  changed_when: false

# A new host's init script (01-databases.sql) creates the database owned by
# postgres, before this role exists; ownership moves here. The portal runs
# CREATE TABLE at schema version 1, so it must own it.
- name: goat-zenoh-portal-store | postgres — create the database, or hand it to the portal role
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - "{{ portal_db_container }}"
      - psql
      - -U
      - postgres
      - -d
      - postgres
      - -v
      - ON_ERROR_STOP=1
      - -c
      - >-
        {{ ('CREATE DATABASE ' ~ portal_db_name ~ ' OWNER ' ~ portal_db_user)
           if (gzps_pg_owner.stdout | trim | length == 0)
           else ('ALTER DATABASE ' ~ portal_db_name ~ ' OWNER TO ' ~ portal_db_user) }}
  when: gzps_pg_owner.stdout | trim != portal_db_user
  changed_when: true

- name: goat-zenoh-portal-store | postgres — the database does not carry the spock extension
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "PGPASSWORD={{ postgres_superuser_password }}"
      - "{{ portal_db_container }}"
      - psql
      - -U
      - postgres
      - -d
      - "{{ portal_db_name }}"
      - -tAc
      - "SELECT count(*) FROM pg_extension WHERE extname = 'spock'"
  register: gzps_pg_spock
  changed_when: false
  failed_when: gzps_pg_spock.rc != 0 or (gzps_pg_spock.stdout | trim) != '0'

# The rule names the one database and the one role, like the netbird lines in
# the baked file. The address is open because postgres-a is reached over the
# docker mgmt network, the same scoping as spire, admit-audit and the id
# console. The file is the one the server actually reads (SHOW hba_file), not an
# assumed path.
- name: goat-zenoh-portal-store | postgres — pg_hba admits the portal role to its database
  ansible.builtin.shell:
    cmd: |
      set -eu
      HBA=$(docker exec {{ portal_db_container }} psql -U postgres -tAc 'SHOW hba_file')
      DB='{{ portal_db_name }}'
      ROLE='{{ portal_db_user }}'
      RULE="host $DB $ROLE 0.0.0.0/0 scram-sha-256"
      if ! docker exec {{ portal_db_container }} grep -qE "^host[[:space:]]+$DB[[:space:]]+$ROLE[[:space:]]" "$HBA"; then
        docker exec -u 0 {{ portal_db_container }} sh -c "echo '$RULE' >> '$HBA'"
        docker exec {{ portal_db_container }} psql -U postgres -tAc 'SELECT pg_reload_conf();' >/dev/null
        echo gzps_hba_changed
      fi
  register: gzps_pg_hba
  changed_when: "'gzps_hba_changed' in gzps_pg_hba.stdout"

- name: goat-zenoh-portal-store | postgres — the loaded pg_hba rules include the portal line, without errors
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ portal_db_container }}"
      - psql
      - -U
      - postgres
      - -tAc
      - >-
        SELECT count(*) FROM pg_hba_file_rules
        WHERE '{{ portal_db_user }}' = ANY(user_name) AND error IS NULL
  register: gzps_pg_hba_loaded
  changed_when: false
  failed_when: gzps_pg_hba_loaded.rc != 0 or (gzps_pg_hba_loaded.stdout | trim | int) < 1
