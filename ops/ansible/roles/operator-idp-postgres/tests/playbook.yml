---
# Parse-only smoke for the operator-idp-postgres role. Used by
# tests/syntax-check.sh and the repo-wide
# .github/workflows/ansible-syntax-check.yml gate per Block 50H.
#
# This playbook is NOT meant to run end-to-end against a host —
# behavioral coverage (real pg_isready, dump round-trip) lives in the
# 21H.1 operator-fired bringup smoke. This file exists so
# `ansible-playbook --syntax-check` covers the role in CI.

- name: operator-idp-postgres syntax-check fixture
  hosts: localhost
  gather_facts: false
  vars:
    operator_idp_pg_superuser_password: "stub-for-syntax-check-only"
    operator_idp_pg_app_password: "stub-for-syntax-check-only"
    operator_idp_pg_dump_age_recipient: "age1stubforsyntaxcheckonlydonotuseinprod000000000000000"
  roles:
    - role: ../..
