---
galaxy_info:
  role_name: operator_idp_postgres
  author: goat-maintainer
  description: |
    Single-instance Postgres on Orin-C backing the operator IdP per ADR 0842.
    Independent of postgres-spock cluster; pg_dump cron backup; sealed unit.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: operator-idp-postgres
      rollback_artifact_type: data
      rollback_ref: "{{ operator_idp_pg_image }}"
      rollback_restore_pointer: "operator-IdP Postgres backup; an image re-pin does NOT restore rows"