---
galaxy_info:
  role_name: operator_idp_kratos
  author: goat-maintainer
  description: |
    Per-site Ory Kratos for the operator IdP per ADR 0842. WebAuthn-only
    credential method; minimal identity schema (email + name + role).
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: operator-idp-kratos
      rollback_artifact_type: image
      rollback_ref: "{{ operator_idp_kratos_image }}"