---
galaxy_info:
  role_name: oci_substrate_t2_sync
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Artifact = the rendered sync
# script plus its cron entry; there is no image to re-pin, so rollback.sh
# gives guided rollback rather than an auto-flip (same shape as
# host-net-publish and netbird-boot-selfheal).
#
# This dependency exists so that enabling the role does not widen the
# rollback-coverage gap. It lands here
# together with deploy-history.yml so that enabling the sync no longer
# widens that gap.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: oci-substrate-t2-sync
      rollback_artifact_type: script
      rollback_ref: "ops/ansible/roles/oci-substrate-t2-sync/templates/oci-goat-sync.sh.j2"
