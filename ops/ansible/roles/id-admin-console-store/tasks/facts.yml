---
# Prints the store facts this goatnet declares. The cutover and rollback
# playbooks include this file (public) as their first role touch, which makes
# the role's defaults visible to them without running anything else.
- name: id-admin-console-store | declared store and Postgres databases
  ansible.builtin.debug:
    msg: >-
      declared store={{ id_admin_console_store }};
      databases {{ id_admin_console_onboard_db_name }}, {{ id_admin_console_org_db_name }}
      on {{ id_admin_console_db_container }} owned by {{ id_admin_console_db_user }};
      password from {{ id_admin_console_db_password_env }};
      archive root {{ id_admin_console_sqlite_archive_root }}
