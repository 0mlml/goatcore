---
# Renders roles/id-admin-console/templates/id-admin-console.env.j2 on localhost
# with the store role's defaults, in both stores, and checks the keys the server
# gets. No host, no docker.
- name: id-admin-console-store | env render test
  hosts: localhost
  gather_facts: false
  vars:
    site_id: zagros-dev
    site_dns_zone: example.test
    ghcr_org: usareur-af
    id_admin_console_fqdn: admin.auth.zagros-dev.example.test
    idrt_dir: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}"
    # Every character that must not survive raw in a URL userinfo or a compose
    # env file.
    idrt_password: "p@ss/w:rd'#$ %?&="
  tasks:
    - name: Load the store defaults
      ansible.builtin.include_role:
        name: id-admin-console-store
        tasks_from: facts.yml
        public: true

    - name: Load the console defaults (no tasks)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../id-admin-console/defaults/main.yml"

    - name: Render in each store
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../id-admin-console/templates/id-admin-console.env.j2"
        dest: "{{ idrt_dir }}/idrt-{{ item }}.env"
        mode: "0600"
      vars:
        id_admin_console_store: "{{ item }}"
        id_admin_console_db_password: "{{ idrt_password }}"
      loop: [sqlite, postgres]

    - name: Read both renders
      ansible.builtin.slurp:
        src: "{{ idrt_dir }}/idrt-{{ item }}.env"
      loop: [sqlite, postgres]
      register: idrt_out

    - name: The server gets the right store keys
      ansible.builtin.assert:
        that:
          - idrt_keys[0] == ['ONBOARD_DB_PATH', 'ORG_DB_PATH']
          - idrt_keys[1] == ['ONBOARD_DB_DSN', 'ORG_DB_DSN']
        fail_msg: "store keys: sqlite={{ idrt_keys[0] }} postgres={{ idrt_keys[1] }}"
      vars:
        idrt_keys: >-
          {{ idrt_out.results | map(attribute='content') | map('b64decode')
             | map('regex_findall', '(?m)^((?:ONBOARD|ORG)_DB_(?:DSN|PATH))=') | map('sort') | list }}

    - name: The DSN carries the password percent-encoded, and it decodes back
      ansible.builtin.assert:
        that:
          - idrt_dsn is match('^postgres://id_console:[A-Za-z0-9%._~-]+@postgres-a:5432/id_console_onboard[?]sslmode=disable$')
          - (idrt_dsn | urlsplit('password') | urldecode) == idrt_password
        fail_msg: "ONBOARD_DB_DSN rendered as {{ idrt_dsn }}"
      vars:
        idrt_dsn: >-
          {{ ((idrt_out.results[1].content | b64decode) | regex_search('(?m)^ONBOARD_DB_DSN=(.*)$', '\1') | first) }}

    - name: Remove the renders
      ansible.builtin.file:
        path: "{{ idrt_dir }}/idrt-{{ item }}.env"
        state: absent
      loop: [sqlite, postgres]
