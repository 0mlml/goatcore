---
# Intentionally empty. Exists so a play can pull this role's defaults into scope
# with `include_role: {name: spire, tasks_from: noop, public: true}` WITHOUT
# running the role.
#
# WHY: spire-ca-standby.yml needs spire_data_dir, spire_ca_ttl and
# spire_trust_domain. Re-declaring them in that play would put the same fact in
# two homes and let them drift — the exact failure ops/pins and the shadowing
# guard exist to prevent. Loading the defaults keeps roles/spire/defaults/main.yml
# the single source.
#
# Do not add tasks here. Anything real belongs in main.yml behind the
# spire_enabled guard.
- name: spire | noop (defaults-only include)
  ansible.builtin.debug:
    msg: "spire defaults loaded into play scope; no tasks run"
    verbosity: 2
