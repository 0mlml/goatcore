---
galaxy_info:
  role_name: icam-mtls-proxy
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]

# Universal deploy-rollback ledger (ADR 1060). Primary image = the nginx mTLS proxy.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: icam-mtls-proxy
      rollback_artifact_type: image
      rollback_ref: "{{ icam_mtls_proxy_nginx_image }}"
