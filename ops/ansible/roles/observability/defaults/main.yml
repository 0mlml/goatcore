---
# ops/ansible/roles/observability/defaults/main.yml
#
# Defaults for the observability role. Override per-play or per-host
# as needed.

# Where the mgmt-host compose stack lives (matches ops/ansible/mgmt-host.yml).
compose_dir: /opt/mgmt-host

# Whether the base stack was brought up with the phase2 override
# (two instances of each service on one host). vega production PoC
# uses single-instance per host, so default false.
phase2: false

# Postgres role used by postgres-exporter. Least-privilege: pg_monitor
# membership + SELECT on spock.* views. Created by this role against
# the running postgres-a container.
pg_monitoring_role: monitoring

# The database postgres-exporter connects to. Must be the replicated
# DB so spock.* views are visible (netbird is the one Spock replicates
# per docs/design/ha-multi-site.md §5). The role is also granted
# pg_monitor at the cluster level so it can read pg_replication_slots
# from any DB connection.
pg_monitoring_db: netbird
