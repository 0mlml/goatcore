---
# Docker bind-mounts single files by inode. When Ansible's template:
# module rewrites a mounted config file atomically (temp-file + rename),
# the container's original inode is unlinked but its open fd is still
# pinned — POST /-/reload reads the OLD inode. Only restarting the
# container re-attaches to the new inode. See
# docs/design/mgmt-plane-threat-mitigations.md and the troubleshooting
# notes in region-a-deploy.md.
- name: Restart prometheus container
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - prometheus
  changed_when: true

- name: Restart alertmanager container
  # Same inode-pinning reason as Prometheus: template: rewrites the
  # mounted file atomically, so POST /-/reload reads stale config
  # until the container is restarted.
  ansible.builtin.command:
    argv:
      - docker
      - restart
      - alertmanager
  changed_when: true
