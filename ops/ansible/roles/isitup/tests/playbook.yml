---
# Parse-only fixture for the isitup role.

- name: isitup | parse-only fixture
  hosts: localhost
  gather_facts: false
  vars:
    site_id: test-site
    site_dns_zone: example.invalid
    isitup_enabled: true
    isitup_oidc_client_secret: "test-oidc-client-secret-32-chars-aaaaaa"
    isitup_cookie_secret: "test-cookie-secret-32-chars-base64=="
    isitup_services:
      - id: stub
        name: "Stub Service"
        fqdn: stub.test-site.example.invalid
        container: stub
        port: 80
        health_path: /
        access: public
  roles:
    - role: ../..
