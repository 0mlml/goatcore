---
galaxy_info:
  role_name: goat_relay
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: goat-relay
      rollback_artifact_type: image
      rollback_ref: "{{ goat_relay_image }}"
