---
# ops/ansible/roles/goat-relay/handlers/main.yml

- name: Restart goat-relay container
  community.docker.docker_container:
    name: "{{ goat_relay_container_name }}"
    state: started
    restart: true
  listen: restart goat-relay

- name: Restart relay-metrics-publish timer
  ansible.builtin.systemd:
    name: relay-metrics-publish.timer
    state: restarted
    daemon_reload: true
  listen: restart relay-metrics-publish timer
