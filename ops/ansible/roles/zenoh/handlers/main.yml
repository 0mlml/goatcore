---
- name: Restart zenoh router
  # Same inode-pinning pattern as Prometheus — template: rewrites the
  # mounted file atomically, container must be restarted to re-attach.
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ zenoh_compose_path }}"
      - up
      - -d
      - --force-recreate
  changed_when: true
