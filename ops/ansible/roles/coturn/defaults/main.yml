---
# coturn role — STUN (and optionally TURN) on the all-Rust goat-relay tier.
#
# Why this role exists: coturn used to live inline in the legacy Go
# relay-server.yml. The all-Rust goat-relay tier (goat-relay-deploy.yml) never
# carried it, so goatnets on that tier ran zero STUN — every peer relay-forced,
# no direct P2P. This role re-adds it as a standalone, gated unit.
#
# STUN-first / TURN-deferred posture: the netbird rels:// relay already
# covers relay-fallback, so TURN's marginal value is low. Default is STUN only:
# coturn answers STUN Binding (free, no auth) while TURN allocations can't relay
# media because the goat-relay SG does not open the relay port range and no TURN
# creds are advertised. Flip coturn_turn_enabled + open 49152-65535 in the SG
# (terraform var coturn_turn_enabled) + populate turn_hosts to enable TURN.

coturn_turn_enabled: false

coturn_listening_port: 3478
coturn_realm: "goat-relay"

# Public IP coturn hands back in STUN responses / TURN external-ip. On the
# goat-relay tier the inventory (generate.sh) sets goat_relay_public_ip per host.
coturn_external_ip: "{{ goat_relay_public_ip | default(ansible_default_ipv4.address | default('')) }}"

# TURN relay media port range (only reachable if the SG opens it).
coturn_min_port: 49152
coturn_max_port: 65535

# static-auth-secret. Leave unset to reuse an existing /etc/turnserver.conf
# secret or generate one. STUN doesn't need it, but a valid coturn config does.
# coturn_turn_secret: ""
