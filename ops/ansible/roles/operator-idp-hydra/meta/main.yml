---
galaxy_info:
  role_name: operator_idp_hydra
  author: goat-maintainer
  description: |
    Per-site Ory Hydra serving OAuth2 / OIDC for the operator IdP per
    ADR 0842. Default access-token strategy = JWT (F-078 fixed at
    issuer level).
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: operator-idp-hydra
      rollback_artifact_type: image
      rollback_ref: "{{ operator_idp_hydra_image }}"