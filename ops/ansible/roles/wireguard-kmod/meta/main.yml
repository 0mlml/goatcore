---
galaxy_info:
  role_name: wireguard_kmod
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Artifact type is `config`:
# the deployed ref is a git SHA of the goat-wireguard-kmod artifact checkout,
# and rollback is a revert + redeploy (playbook -e wg_kmod_state=absent),
# not an image re-pin.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: wireguard-kmod
      rollback_artifact_type: config
      rollback_ref: "{{ wg_kmod_artifact_ref }}"
      rollback_restore_pointer: >-
        Full revert: ops/ansible/wireguard-kmod.yml -e wg_kmod_state=absent
        (removes modules, netbird returns to userspace). Soft per-host:
        NB_WG_KERNEL_DISABLED=true in the netbird service env + restart.
