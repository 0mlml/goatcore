---
# Install /usr/local/bin/mgmt-host-bootstrap operator wrapper.
# ADR 0410. The wrapper invokes `docker compose --profile bootstrap run --rm
# mgmt-host-bootstrap …` against the mgmt-host stack at /opt/mgmt-host/.

- name: Install mgmt-host-bootstrap wrapper script
  ansible.builtin.copy:
    src: mgmt-host-bootstrap
    dest: /usr/local/bin/mgmt-host-bootstrap
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Smoke-check the wrapper resolves
  ansible.builtin.command:
    cmd: /usr/local/bin/mgmt-host-bootstrap --help
  register: bootstrap_help
  changed_when: false
  failed_when: false
- name: Surface wrapper help (non-fatal — image may not be pulled yet)
  ansible.builtin.debug:
    msg: "{{ bootstrap_help.stdout_lines | default(['(no output)']) | join('\n') }}"
