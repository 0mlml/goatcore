---
- name: otel-collector compose changed
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ otel_compose_dir }}"
  changed_when: true

- name: otel-collector config changed
  # Config changes need a container restart — OTel Collector does not
  # currently support a SIGHUP reload of pipelines.
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ otel_compose_dir }}"
  changed_when: true

- name: prometheus reload from otel-collector role
  ansible.builtin.uri:
    url: http://localhost:9090/-/reload
    method: POST
    status_code: 200
  failed_when: false
