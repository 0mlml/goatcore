---
# Defaults for the `oauth2-proxy-id-console-oidc-client` role.
#
# Provisions the OAuth2 client at site Hydra used by the oauth2-proxy
# sidecar that gates the goat-id-console admin console with
# --allowed-group=ADMINS (ADR 0860). Mirrors the
# oauth2-proxy-dashboard-oidc-client role shape exactly.
#
# Required at deploy time:
#   - oauth2_proxy_id_console_oidc_client_secret  (32+ chars; fresh per site)
#   - site_id, site_dns_zone                      (per-site identity)

oauth2_proxy_id_console_oidc_client_id: "oauth2-proxy-id-console"
oauth2_proxy_id_console_oidc_client_name: "oauth2-proxy-id-console ({{ site_id }})"

oauth2_proxy_id_console_oidc_issuer_url: "https://oauth2.{{ site_id }}.{{ site_dns_zone }}"
oauth2_proxy_id_console_oidc_redirect_uri: "https://admin.auth.{{ site_id }}.{{ site_dns_zone }}/oauth2/callback"

oauth2_proxy_id_console_oidc_scopes:
  - openid
  - profile
  - email
  - groups
  - offline_access

# Hydra admin endpoint for client provisioning. Loopback on the mgmt-host.
oauth2_proxy_id_console_oidc_hydra_admin: "http://127.0.0.1:{{ hydra_admin_host_port | default(4445) }}"
