---
- name: reload compliance-proxy compose
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f /opt/mgmt-host/docker-compose.yml
      -f {{ compliance_proxy_compose_file }}
      up -d --force-recreate aws-sigv4-proxy-compliance oauth2-proxy-compliance
    chdir: /opt/mgmt-host
  changed_when: true
