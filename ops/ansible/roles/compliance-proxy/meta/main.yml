---
galaxy_info:
  role_name: compliance_proxy
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: compliance-proxy
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ oauth2_proxy_compliance_image }}"
