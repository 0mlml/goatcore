---
# wg-cp0-client — silent control-plane WireGuard CLIENT for the network host
# (Orin-A, Orin-B, future operator laptops). Connects out to each relay's
# wg-cp0 listener, exposes mgmt-API at the local wg-cp0 address.

wg_cp0_interface_name: "wg-cp0"
wg_cp0_subnet: "198.18.0.0/24"
wg_cp0_client_address: ""           # legacy flow only (e.g. 198.18.0.1 for Orin-A, .5 for Orin-B); bundle flow gets this from CPDeviceAddress
wg_cp0_local_secret_path: "/etc/wireguard/wg-cp0-priv.key"
wg_cp0_persistent_keepalive: 25     # seconds; keeps NAT state alive across all peer endpoints

# === Bundle-rooted enrollment (Block 22K — F-053 closure) ===================
# The supported flow. Set on the controller (per-host or via -e):
#   wg_cp0_bundle_path:           "/path/to/issued/bundle.cbor"
#   wg_cp0_ca_pubkey_local_path:  "/path/to/ca.pub"   # PEM-encoded CA pubkey
# The role builds wg-cp0-bundle-apply locally + ships it + applies the
# bundle on the target. Empty = legacy flow falls through.
wg_cp0_bundle_path: ""
wg_cp0_ca_pubkey_local_path: ""

# === Legacy local-keygen (DEPRECATED — F-053) ===============================
# Set true to opt in to the pre-Block-22K flow that generates a wg keypair
# locally and trusts the inventory file. Trust roots in operator-laptop +
# repo write access, NOT the offline CA. Kept ONLY for the cutover window.
wg_cp0_legacy_local_keygen: false

# Legacy flow only: list of relays this client connects to.
# wg_cp0_relays:
#   - name: relay-rla
#     endpoint: "203.0.113.1:51821"
#     pubkey: "<base64-relay-pubkey>"
#     allowed_ips: ["198.18.0.2/32"]      # just the relay's address — peer-to-peer goes through other paths
#   - name: relay-rlb
#     endpoint: "203.0.113.23:51821"
#     pubkey: "<base64-relay-pubkey>"
#     allowed_ips: ["198.18.0.3/32"]
wg_cp0_relays: []

# Legacy flow only. When set, also routes the entire wg_cp0_subnet through
# the FIRST relay (gateway-of-last-resort behavior). Off by default — peers
# normally talk to one relay each.
wg_cp0_route_subnet_via_first_relay: false

# === Test-mode (role docker-fixture test only) ==============================
# When true, the role skips apt-install (assume tools pre-present), the
# systemd drop-in / enable / start steps, and the wg-show smoke. Intended
# strictly for the role-level docker fixture at
# ops/ansible/roles/wg-cp0-client/tests/role-fixture.sh which validates
# the bundle-flow and legacy-flow branches against a clean Ubuntu
# container without needing a real systemd / running wg-cp0 interface.
# Default false — production runs always exercise the full role.
wg_cp0_test_mode: false
