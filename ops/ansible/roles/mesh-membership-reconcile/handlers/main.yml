---
- name: restart mesh-membership-reconcile timer
  ansible.builtin.systemd:
    name: mesh-membership-reconcile.timer
    state: restarted
    daemon_reload: true
  when: mesh_membership_reconcile_enabled | bool

- name: reload prometheus for mesh-membership-reconcile
  # SIGHUP the running prometheus rather than restarting the stack: a rules
  # change must not bounce scraping for everything else on the host.
  ansible.builtin.shell: |
    set -e
    cid=$(docker ps -q --filter "name=prometheus" | head -1)
    [ -n "$cid" ] && docker kill -s HUP "$cid" >/dev/null && echo reloaded || echo "no prometheus container — skipped"
  changed_when: true
  failed_when: false
