---
# names-collector: the passive self-claims collector service (ADR 1082
# Amendment 2). Depends on nothing structurally; expects the goat-get
# role to have staged the pinned goat release binaries in its www dir
# (the collector reuses one) and the zenoh-router to be up.
dependencies: []
galaxy_info:
  role_name: names-collector
  description: >-
    Passive self-claims collector — subscribes ops/names/claim/** and
    maintains claims.json for the goat-get tier. Reveal-only.
