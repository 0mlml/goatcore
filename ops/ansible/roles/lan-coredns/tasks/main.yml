---
# Declared end state (ADR 1206): a site that sets `lan_coredns_enabled: false` in its
# group_vars does not run lan-coredns, so no play that reaches this role deploys it.
# Unset keeps the role's long-standing behaviour (deploy). The gate that keeps
# this true for every catalog service: ops/ci/check-role-honours-presence-flag.py.
- name: lan-coredns | deploy (skipped where the site declares lan_coredns_enabled false)
  ansible.builtin.import_tasks: deploy.yml
  when: lan_coredns_enabled | default(true) | bool
