---
- name: Restart lan-coredns
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --remove-orphans
    chdir: "{{ lan_coredns_dir }}"

- name: Reload lan-coredns
  ansible.builtin.command:
    cmd: "docker exec {{ lan_coredns_container_name }} kill -HUP 1"
  failed_when: false
