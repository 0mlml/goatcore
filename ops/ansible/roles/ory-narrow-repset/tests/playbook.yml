---
# Parse-only fixture for ory-narrow-repset, per Block 50H role-test
# parity discipline. Runs via tests/syntax-check.sh; not intended for
# real execution (would need a docker-compose harness — queued as
# run-test.sh follow-on).
- name: "Parse-only syntax fixture for ory-narrow-repset"
  hosts: localhost
  gather_facts: false
  vars:
    site_id: parse-only
    participates_in_spock: true
    intra_site_pair: false
    ory_spock_enabled: false  # Keeps the role short-circuited; we just want syntax-check
    inter_site_spock_topology: none
  tasks:
    - name: "Include the role for parse-only validation"
      ansible.builtin.include_role:
        name: ory-narrow-repset
