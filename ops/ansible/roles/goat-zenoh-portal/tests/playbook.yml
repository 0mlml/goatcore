---
# Parse-only syntax-check fixture for the goat-zenoh-portal role.
#
# Real behavior coverage rides the portal's own Go test suite
# (`go test ./...` under ops/goat-zenoh-portal/) — this fixture only
# guarantees the role templates render and the task graph parses.

- name: goat-zenoh-portal parse smoke
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    site_dns_zone: "nova.trial.local"
    portal_operator_api_key: "test-operator-key"
  roles:
    - role: goat-zenoh-portal
