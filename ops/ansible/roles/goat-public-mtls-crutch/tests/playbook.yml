---
# Parse-only fixture for the goat-public-mtls-crutch role.
#
# Exercises both the gated (default) and activated render paths via two
# plays. The activated play sets crutch_test_mode=true so docker/systemd
# tasks are no-ops; template rendering still runs and is the thing the
# syntax check verifies.

- name: goat-public-mtls-crutch | parse-only — gated (default state)
  hosts: localhost
  gather_facts: false
  roles:
    - role: ../..

- name: goat-public-mtls-crutch | parse-only — activated, test_mode skips host actions
  hosts: localhost
  gather_facts: false
  vars:
    crutch_tier_enabled: true
    crutch_test_mode: true
    crutch_host_fqdn: "goat-public-fra.netbird-prod.goat.example"
    crutch_offline_ca_root_path_local: "/dev/null"  # template-only stub; no copy task runs in test_mode
    crutch_crl_endpoint: ""
  roles:
    - role: ../..
