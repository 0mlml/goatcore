---
galaxy_info:
  role_name: goat-public-mtls-crutch
  description: |
    Block 80 / ADR 0843 — Public mTLS-gated crutch tier (operator-toggleable
    parallel reachability surface). Installs Traefik with
    RequireAndVerifyClientCert against the offline-CA, per-route map for
    mgmt-API + signal-server + relay, CRL refresh adapter, and a post-deploy
    strict-required self-test. The wg-cp0-client role must run before this
    one in the playbook so the inner-leg backends are reachable.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: ["jammy", "noble"]
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: goat-public-mtls-crutch
      rollback_artifact_type: image
      rollback_ref: "{{ crutch_traefik_image }}"