---
# Deploy signal-federation-canary on mgmt-hosts as a per-site canary.
# Continuously probes cross-site signal federation; emits Prometheus
# metrics on :9091. Pair with an alert on
# (time() - federation_probe_last_success_unix_timestamp) > 300
# to page when federation has been silently broken for >5 min.
#
# See ops/signal-federation-probe/README.md for design + modes.

- name: Require canary remote-key
  ansible.builtin.assert:
    that:
      - signal_federation_canary_remote_key is defined
      - (signal_federation_canary_remote_key | length) > 0
    fail_msg: >
      signal_federation_canary_remote_key must be set per site to a stable
      WireGuard pubkey at the federation-peer site (e.g., the peer mgmt-host's
      own pubkey, or a dedicated synthetic-canary peer).

- name: Ensure canary directory exists
  ansible.builtin.file:
    path: /opt/signal-federation-canary
    state: directory
    mode: "0750"

- name: Render canary docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../signal-federation-probe/docker-compose.yml"
    dest: /opt/signal-federation-canary/docker-compose.yml
    mode: "0644"
  notify: restart signal-federation-canary

- name: Render canary .env (per-site values)
  ansible.builtin.copy:
    dest: /opt/signal-federation-canary/.env
    mode: "0640"
    content: |
      SIGNAL_FEDERATION_PROBE_IMAGE={{ signal_federation_probe_image }}
      CANARY_TARGET={{ signal_federation_canary_target }}
      CANARY_REMOTE_KEY={{ signal_federation_canary_remote_key }}
      CANARY_INTERVAL={{ signal_federation_canary_interval }}
      CANARY_METRICS_ADDR={{ signal_federation_canary_metrics_addr }}
  notify: restart signal-federation-canary

- name: Pull canary image
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: /opt/signal-federation-canary
  changed_when: true

- name: Start canary
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/signal-federation-canary
  changed_when: true

- name: Wait for canary metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:9091/metrics"
    status_code: 200
  register: canary_ready
  retries: 15
  delay: 2
  until: canary_ready.status == 200
