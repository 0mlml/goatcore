---
# Test playbook — invokes spock-mesh-peering role on each site one at a
# time, mirroring how site-bootstrap.yml's Phase 7B drives it in
# production. Each play targets exactly one host so delegate_to to the
# peer fires the same code path the real role does.

- name: "spock-mesh-peering test | wire test-a's local + test-b's remote subscription"
  hosts: test-a
  gather_facts: false
  roles:
    - role: ../..  # spock-mesh-peering, resolved via -i path

- name: "spock-mesh-peering test | wire test-b's local + test-a's remote subscription"
  hosts: test-b
  gather_facts: false
  roles:
    - role: ../..

- name: "spock-mesh-peering test | verify mesh closure (idempotent re-run)"
  # Re-running the role MUST be a no-op for both sites. The verify-step
  # tasks should still pass (status == 'replicating'); existence checks
  # short-circuit every catalog mutation.
  hosts: test_a_hosts:test_b_hosts
  gather_facts: false
  serial: 1
  roles:
    - role: ../..
