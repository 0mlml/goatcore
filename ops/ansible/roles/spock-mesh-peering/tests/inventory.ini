# Test inventory for the spock-mesh-peering role's 2-node compose smoke.
#
# Both sites are single-Orin (intra_site_pair=false) shape — same as the
# real prov-* sites in production. Connection is local (the test runs on
# the operator's laptop / docker host); each task dispatches docker exec
# to the right container name.
#
# signal_uri's host part doubles as the Spock publisher host. With both
# postgres-spock containers on the same docker network, the container
# name resolves cross-container; the DSN that lands at the peer's
# postgres includes "host=test-postgres-X" which DNS-resolves correctly
# inside the spockmesh-test network.

[test_a_hosts]
test-a ansible_host=127.0.0.1 ansible_connection=local site_name=test-a router_role=A signal_uri=test-postgres-a:5432 spock_mesh_postgres_container=test-postgres-a

[test_b_hosts]
test-b ansible_host=127.0.0.1 ansible_connection=local site_name=test-b router_role=A signal_uri=test-postgres-b:5432 spock_mesh_postgres_container=test-postgres-b

[mgmt_hosts:children]
test_a_hosts
test_b_hosts
