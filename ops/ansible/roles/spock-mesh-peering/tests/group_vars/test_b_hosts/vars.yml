---
# test-b site shape — single-Orin, full_mesh topology.
site_id: test-b
participates_in_spock: true
intra_site_pair: false
inter_site_spock_topology: full_mesh

# Block 64R path (ADR 1084) — see test_a_hosts/vars.yml.
spock_mesh_databases:
  - name: netbird
    replication_sets: [default, test_mgmt]
    repset:
      name: test_mgmt
      tables: [spock_repset_smoke]

# The fixture has no NetBird tables for the revocation guard to attach to;
# the guard is covered by ops/postgres/spock/tests/partition-revoke.
spock_mesh_revocation_guard: false
