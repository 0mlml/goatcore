---
galaxy_info:
  role_name: goat_get
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    when: goat_get_enabled | default(true) | bool
    vars:
      rollback_component: goat-get
      rollback_artifact_type: image
      rollback_ref: "{{ goat_get_image }}"
      # What this surface serves is versioned by these vars, not by its nginx
      # image. Each payload's version.json is read back into the ledger row at
      # the end of the play, and verify/diff compare it with main
      # (ops/scripts/served-payloads.py, both avenues).
      rollback_served_root: "{{ goat_get_www_dir }}"
      rollback_served:
        - {name: goat-cli, tag_var: goat_get_release_tag, file: version.json}
        - {name: grant-crypto-sdk, tag_var: goat_get_sdk_release_tag, enabled_var: goat_get_sdk_enabled, file: "{{ goat_get_sdk_www_subdir }}/version.json"}
        - {name: jetson-wireguard-kmod, tag_var: goat_get_kmod_release_tag, enabled_var: goat_get_kmod_enabled, file: "{{ goat_get_kmod_www_subdir }}/version.json"}
        - {name: octo-pod, tag_var: goat_get_octopod_release_tag, enabled_var: goat_get_octopod_enabled, file: "{{ goat_get_octopod_www_subdir }}/version.json"}
        - {name: goatbuilder, tag_var: goat_get_goatbuilder_release_tag, enabled_var: goat_get_goatbuilder_enabled, file: "{{ goat_get_goatbuilder_www_subdir }}/version.json"}
