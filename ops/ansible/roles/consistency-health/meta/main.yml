---
galaxy_info:
  role_name: consistency_health
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). The meter that reports
# convergence is itself covered by the ledger it reads — anything else would be
# a surface exempting itself from the discipline it observes.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: consistency-health
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ consistency_health_image }}"
