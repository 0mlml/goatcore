---
# Anchor: ADR 0826 — per-site three-Orin topology, observability host.
galaxy_info:
  role_name: obs-host
  author: goat
  description: |
    Brings up the per-site observability stack on Orin-C (the third
    Orin in the per-site three-Orin topology per ADR 0826).
    Phase 1: Prometheus + Alertmanager + Grafana + node_exporter.
    Phase 2 (Block 17D + 27 follow-on): OpenObserve + MinIO + OTel
    Collector.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: ["22.04", "24.04"]

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: obs-host
      rollback_artifact_type: image
      rollback_ref: "{{ prometheus_image }}"