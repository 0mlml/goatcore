---
# SPDX-License-Identifier: Apache-2.0
#
# Defaults for the time-health role — deploys the goat-time-health roll-up (the
# time domain of the environment-health surface; ADR 1036/1037, F-184). A normal
# mTLS Zenoh client peer that subscribes the signed per-host attestations on
# ops/time/attest/** and publishes a per-site honesty-graded reading on
# ops/time/health/<site> (EnvHealthV1{domain:"time"}). Persists nothing.
#
# Out-of-the-box config targets nova-a; the same role covers ZAGROS (-e target=zagros_hosts).

# Image — pinned per ADR 0859 (easy rollback). Built by
# .github/workflows/time-health-image.yml. Multi-arch index digest verified
# against ghcr (sha-3a4bb4e == the current :latest, built by PR #980).
# To bump: resolve the new index digest with
#   docker buildx imagetools inspect ghcr.io/{{ ghcr_org }}/goat-time-health:sha-<short> --format '{{.Manifest.Digest}}'
# and append a matching deploy-history row.
time_health_image: "ghcr.io/{{ ghcr_org }}/goat-time-health@sha256:d875d0d11ca1fe236367cdae109975ddd6e03cc2ebc2cac09c730b5b0fb32bec"

# Site identifier — the `<site>` segment of ops/time/health/<site>.
time_health_site: "nova-a"

# Zenoh router endpoint + network (internal docker, container-name resolution),
# derived from zenoh_stack (goat-zenoh on nova-a + ZAGROS).
time_health_zenoh_endpoint: "tls/{{ zenoh_stack | default('goat-zenoh') }}-router:7447"
time_health_zenoh_network: "{{ zenoh_stack | default('goat-zenoh') }}_default"

# Publish interval (ms) + staleness window (a host with no fresh attestation
# within this window reads idle, never a false green).
time_health_interval_ms: 30000
time_health_stale_after_ms: 90000

# Host-side cert directory. Infra-class leaf cert + key minted via offline-CA
# cert-sign with Subject CN=goat-time-health-trial-peer (zenoh ACL subject
# `infra-time-health`, granted ingress write on ops/time/health/** via rule
# `infra-w-time-health`; reads ops/time/attest/** via the shared read-all). A
# wrong/empty CN means the roll-up publishes are silently denied.
#   {cert_dir}/time-health-cert.pem
#   {cert_dir}/time-health-key.pem
time_health_cert_dir: "/opt/time-health/certs"

# CA root the client uses to verify the router (same file the router uses).
time_health_ca_root_src: "/etc/{{ zenoh_stack | default('goat-zenoh') }}/tls/ca-root-cert.pem"

time_health_compose_dir: "/opt/time-health"
time_health_rust_log: "goat_time_health=info,zenoh=warn"
