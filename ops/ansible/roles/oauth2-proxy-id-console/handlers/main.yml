---
- name: reload oauth2-proxy-id-console compose
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f /opt/mgmt-host/docker-compose.yml
      -f {{ id_admin_console_oauth2_proxy_compose_file }}
      up -d --force-recreate oauth2-proxy-id-console
    chdir: /opt/mgmt-host
  changed_when: true
