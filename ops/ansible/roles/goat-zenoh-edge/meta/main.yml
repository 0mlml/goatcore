---
galaxy_info:
  role_name: goat_zenoh_edge
  description: One dedicated Zenoh router per federated sovereign partner (ADR 1157).

# ADR 1060 — a deploying role records what it deployed so a rollback has a ref
# to go back to. The artifact here is the container image; the edge role refuses
# to run at all unless it is digest-pinned (tasks/main.yml), so the recorded ref
# is always an exact image rather than a moving tag.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: goat-zenoh-edge
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ goat_zenoh_edge_image }}"
