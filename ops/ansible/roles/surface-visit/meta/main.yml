---
# SPDX-License-Identifier: Apache-2.0
galaxy_info:
  role_name: surface_visit
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  description: >-
    Per-door visit emitters (ADR 1163) — tail an oauth2-proxy door's request
    log and publish age-encrypted SurfaceVisitV1 to ops/audit/surface/**.
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: surface-visit
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ surface_visit_image }}"
