---
galaxy_info:
  role_name: onboard_intake_collector
  author: goat-maintainer
  description: >
    Public candidate-onboarding front desk (ADR 1062 stage 1) — a thin nginx
    allowlist reverse proxy on the enrollment ingress that serves the candidate
    form + the two token-gated candidate endpoints and forwards them to the
    mesh-only portal; everything else 404s.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060) — records the collector image so
# rollback.sh can re-pin. Only records when enabled.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: onboard-intake-collector
      rollback_artifact_type: image
      rollback_ref: "{{ onboard_intake_image }}"
