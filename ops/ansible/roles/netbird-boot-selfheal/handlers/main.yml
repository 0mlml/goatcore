---
- name: reload systemd for netbird selfheal
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart netbird-boot-selfheal timer
  ansible.builtin.systemd:
    name: netbird-boot-selfheal.timer
    state: restarted
    daemon_reload: true

- name: restart systemd-resolved for netbird selfheal
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
