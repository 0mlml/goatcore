---
galaxy_info:
  role_name: intake_mesh_advisory
  author: goat-maintainer
  description: >
    Static on-mesh advisory page for public enrollment hostnames that
    resolve to Thor's mesh-facing Traefik (GH #150).
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060) - records the advisory
# image so rollback.sh can re-pin.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: intake-mesh-advisory
      rollback_artifact_type: image
      rollback_ref: "{{ intake_mesh_advisory_image }}"
