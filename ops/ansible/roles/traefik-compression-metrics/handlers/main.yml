---
- name: restart traefik-compression-metrics timer
  ansible.builtin.systemd:
    name: traefik-compression-metrics.timer
    state: restarted
    daemon_reload: true
  become: true

- name: reload prometheus for compression rules
  ansible.builtin.command:
    cmd: "docker kill --signal=HUP {{ traefik_compression_metrics_prometheus_container | default('prometheus') }}"
  become: true
  failed_when: false
  changed_when: true
