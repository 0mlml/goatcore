---
# ops/ansible/roles/ntp-admit-sidecar/tasks/main.yml
#
# Installs the ntp-admit-sidecar (Block 12B-sidecar).
#
# Port chain after this role + mgmt-host.yml run:
#   inbound → 127.0.0.1:8080 (sidecar) → 127.0.0.1:8081 (management-a:80)
#
# management-a is bound to :8081 via mgmt_container_host_port in the
# docker-compose.yml template rendered by mgmt-host.yml.  This role does NOT
# touch docker-compose.yml — port ownership is declared in group_vars.
#
# Design: docs/design/universal-ntp-hygiene.md §6
# Prerequisites: ntp-health-agent role (daemon + Unix socket must be running)

# --- Install sidecar binary + systemd unit ---------------------------------

- name: Install ntp-admit-sidecar binary
  ansible.builtin.copy:
    src: "{{ ntp_admit_sidecar_binary_src }}"
    dest: "{{ ntp_admit_sidecar_install_dir }}/ntp-admit-sidecar"
    owner: root
    group: root
    mode: "0755"
  notify: restart ntp-admit-sidecar

- name: Render ntp-admit-sidecar systemd unit
  ansible.builtin.template:
    src: ntp-admit-sidecar.service.j2
    dest: /etc/systemd/system/ntp-admit-sidecar.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart ntp-admit-sidecar

- name: Enable + start ntp-admit-sidecar
  ansible.builtin.systemd:
    name: ntp-admit-sidecar
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# --- Step 3: smoke-test ----------------------------------------------------

- name: Wait for sidecar to accept connections on :8080
  # 502 is acceptable here: sidecar is up and responding, but management-a
  # may not yet be started (Phase 2 / mgmt-host.yml runs after this role).
  ansible.builtin.uri:
    url: "http://{{ ntp_admit_sidecar_listen }}/api/accounts"
    status_code: [200, 401, 403, 404, 502, 503]
    return_content: false
  register: sidecar_ready
  retries: 15
  delay: 2
  until: sidecar_ready.status in [200, 401, 403, 404, 502, 503]

- name: Confirm sidecar blocks a synthetic admit-class POST when NTP is unhealthy (skip if NTP healthy)
  # When NTP is healthy the sidecar passes through — this check only fires when
  # ntp_class != healthy, which is informational on a fresh host. Run the real
  # admission drill in Wave 3 §3.6 fire-tests.
  ansible.builtin.debug:
    msg: >-
      Sidecar is up on {{ ntp_admit_sidecar_listen }}.
      Admit-class routes blocked when ntp_class != healthy.
      Revoke-class (DELETE) and read-class (GET) always pass through.
      Run Wave 3 §3.6 fire-tests to validate block/pass under induced NTP fault.
