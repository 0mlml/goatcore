---
# See ntp-health-agent/defaults/main.yml for the multi-arch convention.
ntp_admit_sidecar_go_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"
ntp_admit_sidecar_binary_src: "{{ playbook_dir }}/../../ops/time-hygiene/bin/linux-{{ ntp_admit_sidecar_go_arch }}/ntp-admit-sidecar"
ntp_admit_sidecar_install_dir: /usr/local/bin
ntp_admit_sidecar_listen: "127.0.0.1:8080"
ntp_admit_sidecar_backend: "http://127.0.0.1:8081"
ntp_admit_sidecar_ntp_socket: /run/ntp-health.sock
ntp_admit_sidecar_ntp_timeout: 200ms
# C5 rate limit: max N admit-class requests per rolling window (global for v1)
ntp_admit_sidecar_rate_limit_max: 20
ntp_admit_sidecar_rate_limit_window: 24h
