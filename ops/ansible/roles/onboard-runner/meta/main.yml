---
galaxy_info:
  role_name: onboard_runner
  author: goat-maintainer
  description: >-
    onboard-runner — pull-model onboarding auto-executor (three-stage candidate
    onboarding, docs/design/operator-onboard-intake.md §"Fast-follow").
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). The deployed artifact is now the
# onboard-runner container image (the reshape from a host binary + systemd unit),
# so rollback is an image re-pin. Only records when enabled.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: onboard-runner
      rollback_artifact_type: image
      rollback_ref: "{{ onboard_runner_image }}"
      # The runner shells the host goat it bind-mounts, synced from the goat-cli
      # goat-get serves on this host. Its installed version is recorded in the
      # ledger row (`served`, from the marker the version probe writes) and
      # judged against the goat-cli main declares for this goatnet
      # (goat_get_release_tag; ops/scripts/served-payloads.py, both avenues).
      rollback_served_root: "{{ onboard_runner_goat_marker_dir }}"
      rollback_served:
        - {name: goat-cli, tag_var: goat_get_release_tag, tag_role: goat-get, enabled_var: onboard_runner_goat_autoupdate, file: goat-cli.version.json}
