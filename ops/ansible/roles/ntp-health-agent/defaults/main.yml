---
# Architecture mapping: ansible_architecture (kernel-style) → Go-style.
# Multi-arch binaries live under ops/time-hygiene/bin/linux-{amd64,arm64}/ —
# built via `cd ops/time-hygiene && make build` (default builds both).
ntp_health_agent_go_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"
ntp_health_agent_binary_src: "{{ playbook_dir }}/../../ops/time-hygiene/bin/linux-{{ ntp_health_agent_go_arch }}/ntp-health-agent"
ntp_health_agent_install_dir: /usr/local/bin
ntp_health_agent_key_dir: /etc/ntp-health-agent
ntp_health_agent_unix_socket: /run/ntp-health.sock
ntp_health_agent_http_addr: "0.0.0.0:9753"
ntp_health_agent_poll_interval: 10s
ntp_health_agent_chrony_socket: /run/chrony/chronyd.sock

# Signed-attestation gate (2a / ADR 1037). Default ON fleet-wide: the agent
# signs every verdict with the per-host Ed25519 key generated by this role, so
# any consumer can verify "this host asserted this verdict" — the Byzantine gate
# the internal-sync model depends on. Set false to roll back to unattested
# verdicts (ADR 0859 easy-rollback). The role-generated key is openssl PKCS#8,
# which signer.Load accepts (a pre-2a binary does NOT know --attestation-key, so
# the role asserts a signing-capable binary before enabling it).
ntp_health_agent_attestation_enabled: true
ntp_health_agent_attestation_validity: 5m
