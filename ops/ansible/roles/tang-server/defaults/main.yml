---
# Tang server config for Block 65C peer-auto-unlock per ADR 0612.
# wg-cp0 listener only; public Tang is rejected by pre-flight assertion.

tang_listen_address: "{{ wg_cp0_address | default('') }}"
tang_listen_port: 7500

# Address class for the listener — controls pre-flight acceptance.
# 'wg-cp0' (default): only accept 198.18.0.0/24 or legacy 10.99.0.0/24 listen address.
# 'lan' (explicit opt-in): accept a same-site private-LAN IP. Use when the
# wg-cp0 mesh doesn't yet have direct peer-to-peer routing between the
# Tang server and its clients, but the hosts share a CGNAT-
# private LAN. Public-internet exposure is still rejected by ADR 0313.
tang_listen_address_class: wg-cp0

# Ubuntu 22.04 (jammy) tang package 8-2 ships:
#   - data dir /var/lib/tang (NOT /var/db/tang as some Tang docs suggest)
#   - dedicated user `_tang` (with leading underscore — different from RHEL's `tang`)
#   - tangd binary at /usr/libexec/tangd (run as `_tang:_tang` per stock unit)
# Verified Block 65C.0 on vega . Override per-distro for RHEL
# (`tang_db_dir: /var/db/tang`, `tang_user: tang`).
tang_db_dir: /var/lib/tang
tang_user: _tang
tang_group: _tang

tang_packages:
  - tang
