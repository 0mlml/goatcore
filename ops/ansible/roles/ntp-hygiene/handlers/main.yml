---
# ops/ansible/roles/ntp-hygiene/handlers/main.yml

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart chrony_exporter
  ansible.builtin.systemd:
    name: chrony_exporter
    state: restarted
