---
# Parse-only fixture for the goat-peering-edge role. Values are from the
# ISO 3166-1 user-assigned range (xaa) and RFC 5737 / RFC 3927 documentation
# ranges, so nothing here can be mistaken for a real peering or copied into
# production and collide with one (federation-package-spec.md §3).

- name: goat-peering-edge | parse-only fixture
  hosts: localhost
  gather_facts: false
  vars:
    peering_edge_enabled: true
    peering_edge_name: xaa
    peering_edge_our_sovereign_id: xab
    peering_edge_their_sovereign_id: xaa
    peering_edge_local_id: fed.xab.xaa.01
    peering_edge_remote_id: fed.xaa.xab.01
    peering_edge_local_addr: 203.0.113.10
    peering_edge_remote_addr: 198.51.100.20
    peering_edge_local_link_ip: 169.254.10.0
    peering_edge_remote_link_ip: 169.254.10.1
    peering_edge_link_underlay_dev: eth0
    peering_edge_fips_waived_reason: "parse-only fixture; no host"
  roles:
    - role: ../..
