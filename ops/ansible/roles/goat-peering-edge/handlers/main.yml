---
# Order matters and is the definition order: the interface must exist before
# charon binds a CHILD_SA to its if_id, and the daemon must be running before
# swanctl can load a connection into it.

- name: Restart peering link interface
  ansible.builtin.systemd:
    name: "{{ peering_edge_link_service }}"
    state: restarted
    daemon_reload: true

- name: Restart strongswan
  ansible.builtin.systemd:
    name: "{{ peering_edge_service }}"
    state: restarted
    daemon_reload: true

- name: Reload swanctl configuration
  ansible.builtin.command: swanctl --load-all
  changed_when: true
