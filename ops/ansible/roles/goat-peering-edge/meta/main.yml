---
galaxy_info:
  role_name: goat_peering_edge
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Config artifact: rollback is a
# git-SHA revert of the declaration plus a re-run, which the tool prints.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: "goat-peering-edge"
      rollback_artifact_type: config
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: >-
        {{ peering_edge_name }} {{ peering_edge_local_id }}->{{ peering_edge_remote_id }}
        suite={{ peering_edge_ike_proposals }}/{{ peering_edge_esp_proposals }}
        mtu={{ peering_edge_mtu }}
