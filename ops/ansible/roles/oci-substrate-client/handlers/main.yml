---
# ops/ansible/roles/oci-substrate-client/handlers/main.yml

- name: oci-substrate-client | restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  become: true
  # Note: restarting docker bounces every running container on the host.
  # On mgmt-host A/B pair the failover is intra-site VRRP; on single-Orin
  # sites this is a brief outage. Schedule role applies during planned
  # maintenance windows.
