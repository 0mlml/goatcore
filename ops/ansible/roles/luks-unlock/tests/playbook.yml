---
# Parse-only smoke fixture for the luks-unlock role. Validates YAML +
# Jinja2 under ansible-playbook --syntax-check.
#
# This role manipulates LUKS keyslots on real block devices, so a full
# end-to-end fixture would need a privileged container with a loop-back
# device. The parse-only check catches the F-075-class bug at the YAML
# layer (paired with check-register-uniqueness.sh) and any Jinja2
# template breakage; deeper coverage is the cold-boot drill harness at
# ops/scripts/cold-boot-drill.sh and the per-mode evidence files in
# docs/reports/.

- name: luks-unlock | parse-only fixture
  hosts: localhost
  gather_facts: false
  vars:
    luks_volumes:
      - name: data
        device: /dev/loop0
        mount_point: /mnt/data
        filesystem: ext4
        passphrase: stub
        unlock_modes: [passphrase, fido2, tpm2, tang_client]
        unlock_modes_disabled: []
        format_if_unformatted: false
    luks_tang_servers:
      - name: peer-a
        url: http://198.18.0.5:7500
      - name: peer-b
        url: http://198.18.0.6:7500
    luks_fido2_force_reenroll: false
    # Node-class paths (installer-luks.yml / encrypted-lv-carve.yml). Left empty
    # here on purpose: --syntax-check does not recurse into include_tasks, so
    # these files are validated by ansible-lint + yamllint (which DO parse them),
    # not by this parse-only fixture. Populated shapes are in the role README and
    # docs/design/host-site-node-disk-encryption.md.
    luks_installer_partitions: []
    luks_encrypted_lvs: []
  roles:
    - role: ../..
