---
- name: breakglass restart netfilter assertion
  ansible.builtin.systemd:
    name: tailscale-netfilter-off.service
    state: restarted
    daemon_reload: true

- name: breakglass restart htpdate
  ansible.builtin.systemd:
    name: htpdate
    state: restarted

- name: breakglass restart resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
