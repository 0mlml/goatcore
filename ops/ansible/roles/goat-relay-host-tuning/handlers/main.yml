---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart docker
  # Picks up a changed /etc/docker/daemon.json. Restarts every container on
  # the host (goat-relay, rathole, coturn) — a brief blip, so this fires
  # only when the file actually changed (idempotent).
  ansible.builtin.systemd:
    name: docker
    state: restarted
