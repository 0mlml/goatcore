---
# Block 33C.1 host-tuning levers H1-H3. H4 (PGO+BOLT) is build-time,
# not host-tuning, and lives in goat-relay/Cargo.toml + CI build steps.
#
# This role is opt-in per-lever via individual `_enable` vars. See
# defaults/main.yml for the full var list and ADR 0823 for H2's
# risk-acceptance criteria.

galaxy_info:
  role_name: goat-relay-host-tuning
  description: H1-H3 host-tuning levers for goat-relay hosts (CPU governor, mitigations=off, hugepages)
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - "24.04"
  galaxy_tags:
    - performance
    - kernel-tuning
    - relay

dependencies: []
