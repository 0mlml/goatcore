---
# Block 65B — dropbear-initramfs role defaults per ADR 0612.

dropbear_authorized_keys: []
dropbear_initramfs_ip_config: ""   # operator must set; see README
dropbear_initramfs_ssh_port: 22
dropbear_initramfs_extra_kmods: []  # AGX Orin: empty (MODULES=most picks up `nvethernet` from updates/ — verified 65B.0)

dropbear_packages:
  - dropbear-initramfs
  - cryptsetup-initramfs
  - busybox-initramfs

# DROPBEAR_OPTIONS in initramfs:
#   -s   disable password auth
#   -g   disable empty-password root login
#   -j   disable local port forwarding (no tunnels through this dropbear)
#   -k   disable remote port forwarding
#   -p   bind port (we set explicitly to be visible)
#   -I   idle timeout in seconds (5min) — kill orphaned sessions
dropbear_options: "-s -g -j -k -I 300 -p {{ dropbear_initramfs_ssh_port }}"
