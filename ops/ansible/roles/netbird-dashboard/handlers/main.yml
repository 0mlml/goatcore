---
- name: restart dashboard
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml -f docker-compose.dashboard.yml restart dashboard
    chdir: "{{ ory_compose_dir }}"

- name: recreate dashboard
  # `docker restart` does NOT re-read env_file; --force-recreate does.
  # Used after dashboard.env changes (AUTH_REDIRECT_URI, OIDC client_secret, etc.).
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml -f docker-compose.ory.yml -f docker-compose.ui.yml -f docker-compose.dashboard.yml up -d --no-deps --force-recreate dashboard
    chdir: "{{ ory_compose_dir }}"

- name: restart traefik
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml restart traefik
    chdir: "{{ ory_compose_dir }}"

- name: restart management-a
  # F-078: netbird-mgmt caches Hydra's JWKS at boot. When Hydra's
  # access_token_strategy flips opaque -> jwt (or signing keys rotate),
  # mgmt's cached JWKS won't have the new kid; auth'd /api/* calls fail
  # 401 "token invalid". Restart picks up the fresh JWKS.
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml restart management-a
    chdir: "{{ ory_compose_dir }}"
