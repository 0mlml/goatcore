---
# enrolment-watch — scheduled read of the netbird management server's own auth
# stream, looking for a device that cannot enrol and keeps trying.
#
# A WireGuard key that retries every few seconds and never succeeds emits
# thousands of errors a day on the enrolment path, and nothing aggregates them
# unless this role does.
#
# Master gate. false = full TEARDOWN (unit, timer, script, env, and the stale
# metric file), never "skip the install tasks" — a role that only skips leaves a
# timer running on a host with nothing in the repo admitting it exists.
enrolment_watch_enabled: true

# The netbird management container whose log carries the auth stream.
enrolment_watch_container: "management-a"

# Look-back window. Matches the timer interval so consecutive runs tile rather
# than overlap; widen both together or a burst gets counted twice.
enrolment_watch_window: "60m"

# Attempts in the window before a peer counts as STUCK. Below this a device is
# simply retrying while somebody mints its key, which is normal and must not
# page anyone.
enrolment_watch_threshold: 20

# node_exporter textfile dir. DIFFERS PER GOATNET — do not assume
# /var/lib/node_exporter/textfile; the collector may read another directory
# while that path exists, is writable, and is scraped by nothing. Set it per
# site.
enrolment_watch_textfile_dir: ""

enrolment_watch_report: "/var/log/enrolment-watch/last-run.txt"
enrolment_watch_oncalendar: "hourly"

# Known-stuck peers, so a standing case does not fail the unit forever. One
# entry per line: "<wg-key-prefix> reason=... clear_by=YYYY-MM-DD". An entry
# past clear_by STOPS suppressing, because a baseline that never expires is a
# mute with extra steps. Rendered from here, never edited on the host, so an
# entry costs a reviewed commit that says why.
enrolment_watch_baseline: []

# Prometheus rules dir on the obs stack. Empty or absent = the role installs no
# alert and SAYS SO, rather than writing a rules file nothing loads.
enrolment_watch_rules_dir: "/opt/{{ site_id }}-obs/prometheus/rules"
