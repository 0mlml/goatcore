---
# Defaults for the `minio-oidc-client` role.
#
# Block 21H.3c — provisions an OAuth2 client at operator-IdP Hydra for
# MinIO console authentication. ADR 0842. Same idempotent
# GET-then-POST-or-PUT pattern as grafana/openobserve-oidc-client.
#
# MinIO claim → policy mapping is the fiddly part:
# MINIO_IDENTITY_OPENID_CLAIM_NAME (defaults to `policy` upstream; we
# override to `groups`) tells MinIO which JWT claim carries policy
# names. MinIO matches each claim value to a MinIO IAM policy of the
# same name; if multiple match, all attach. Group strings without a
# matching policy are silently ignored (operator with only
# grafana-admin in groups → no MinIO policies attach → login succeeds
# but bucket access denied).
#
# The minio role's mc-init.sh extension (in this batch) creates
# alias-policies (obs-admin / minio-admin / obs-readonly /
# minio-readonly) that wrap MinIO's built-in policies (consoleAdmin /
# readonly).
#
# Required env var:
#   - operator_idp_minio_client_secret  (32+ chars; FRESH per site)

minio_oidc_client_id: "minio"
minio_oidc_client_name: "MinIO ({{ site_id }})"

minio_oidc_issuer_url: "https://oauth2.ops.{{ site_id }}.{{ site_dns_zone }}"
# MinIO console's OIDC callback path. Verify against running MinIO
# console version at first bringup; pattern stable across recent
# RELEASE.* tags.
minio_oidc_redirect_uri: "https://minio.{{ site_id }}.{{ site_dns_zone }}/oauth_callback"

minio_oidc_scopes:
  - openid
  - profile
  - email
  - groups

minio_oidc_hydra_admin: "http://127.0.0.1:{{ operator_idp_hydra_admin_host_port | default(4447) }}"
