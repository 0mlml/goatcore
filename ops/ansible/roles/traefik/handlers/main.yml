---
# Traefik's --providers.file.watch=true picks up cert + dynamic config
# changes WITHOUT a container restart. The handler exists for cases where
# we need a hard restart (image bump, command-line flag change), invoked
# explicitly via `import_role` or via `meta: flush_handlers`. Day-1 cert
# rotation does NOT require restart.

- name: traefik changed
  ansible.builtin.debug:
    msg: |
      Cert/config change detected. Traefik file-watcher will pick this
      up automatically (--providers.file.watch=true). No restart needed
      for cert rotation or routing-rule edits.

- name: traefik restart
  ansible.builtin.command:
    cmd: docker compose restart traefik
    chdir: "{{ mgmt_host_compose_dir }}"
  changed_when: true

# F-101 closure — host-side bundle render + management-a restart handler
# retired by the Block 78A-(a) image-side fix: the offline-CA
# root + intermediate are now baked into the netbird-mgmt image's container
# trust store at build time, so no host-side trust-bundle is needed.
