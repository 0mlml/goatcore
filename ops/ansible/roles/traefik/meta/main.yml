---
# Anchor: ADR 0407 / docs/design/internal-tls-ca.md §6.
galaxy_info:
  role_name: traefik
  author: goat
  description: |
    Configures Traefik as the TLS terminator for the mgmt-host compose
    stack. Delivers offline-CA-signed certs from operator laptop, renders
    dynamic config (TLS options + Host-routed routers), ensures the
    traefik service is up via compose. No ACME / no Let's Encrypt —
    internal-only endpoints behind wg-cp0 don't have public DNS per
    ADR 0314.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: ["22.04", "24.04"]

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: traefik
      rollback_artifact_type: image
      rollback_ref: "{{ traefik_image }}"