---
# A declared scrape target needs an exporter behind it. This role is that
# exporter, for any scraped host that does not run an obs stack of its own.
galaxy_info:
  role_name: node-exporter
  author: goat
  description: |
    Standalone Prometheus node_exporter for scraped hosts without their
    own obs stack (mgmt pair, breakglass node). The obs-host role ships
    the obs host's own exporter; keep the two service definitions in step.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions: ["22.04", "24.04"]

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: node-exporter
      rollback_artifact_type: image
      rollback_ref: "{{ node_exporter_image }}"
