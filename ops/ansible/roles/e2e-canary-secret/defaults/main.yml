---
# e2e-canary-secret — the canary that needs one secret.
e2e_canary_secret_image: ""
e2e_canary_secret_registry: "ghcr.io/{{ ghcr_org }}"
# Bound in group_vars to lookup('env', 'E2E_CANARY_TOKEN'); empty is refused on
# the host, and the drivers refuse before the host when the variable is unset.
e2e_canary_secret_token: ""
e2e_canary_secret_dir: "/opt/e2e-canary-secret"
