---
galaxy_info:
  role_name: e2e_canary_secret
  author: goat-maintainer
  description: >-
    The secret-bearing canary of the deployment e2e harness
    (docs/design/deployment-e2e.md): proves the secrets preflight names a
    missing variable before any host, and that a present one reaches the host.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: e2e-canary-secret
      rollback_artifact_type: image
      rollback_ref: "{{ e2e_canary_secret_image }}"
