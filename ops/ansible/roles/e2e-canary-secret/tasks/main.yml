---
- name: e2e-canary-secret | refuse an unpinned image
  ansible.builtin.assert:
    that:
      - e2e_canary_secret_image | length > 0
      - "'@sha256:' in e2e_canary_secret_image"
    fail_msg: "e2e_canary_secret_image must be digest-pinned"

- name: e2e-canary-secret | refuse an empty token (the host-side assert the drivers pre-empt)
  ansible.builtin.assert:
    that:
      - e2e_canary_secret_token | length > 0
    fail_msg: >-
      e2e_canary_secret_token is empty — E2E_CANARY_TOKEN was not in the
      deployer's environment. The driver names this before any host; reaching
      this assert means a driver let an unset secret through.

- name: e2e-canary-secret | ensure the directory
  ansible.builtin.file:
    path: "{{ e2e_canary_secret_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: e2e-canary-secret | write the token's sha256 (never the token) beside the pin
  ansible.builtin.copy:
    dest: "{{ e2e_canary_secret_dir }}/deployed.json"
    mode: "0644"
    content: "{{ {'image': e2e_canary_secret_image, 'token_sha256': e2e_canary_secret_token | hash('sha256')} | to_nice_json }}\n"
  become: true
