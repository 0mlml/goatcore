---
# Parse-only fixture for the snitch-bundle role.

- name: snitch-bundle | parse-only fixture
  hosts: localhost
  gather_facts: false
  vars:
    snitch_bundle_unpack_dir: /tmp/stub-bundle
    snitch_enrollment_bundle_path: /tmp/stub-enrollment.cbor
    snitch_collector_url: "http://snitch.example.invalid:8080"
    snitch_probe_key: "stub-probe-key"
  roles:
    - role: ../..
