---
# snitch-bundle role — install snitch probe on a bundle-onboarded peer.
#
# Block 61H multi-platform builds. This dispatcher reads
# `ansible_facts['system']` and includes the per-OS task file:
#   - Linux  → tasks/Linux.yml   (systemd + /usr/local/bin/snitch)
#   - Darwin → tasks/Darwin.yml  (launchd + /usr/local/bin/snitch)
#   - Windows is intentionally out of scope here (WinRM connection layer
#     differs enough that a sibling role is the right shape; see README).
#
# Distinct from nethost-snitch.yml (which deploys the COLLECTOR on the
# network host) and the legacy install-probe.sh (which curls the binary
# from the collector for ad-hoc onboarding).
#
# Idempotent. Safe to re-run.

- name: Gather minimum facts to dispatch by OS family
  ansible.builtin.setup:
    gather_subset:
      - "min"
  tags: [snitch-bundle]

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: >-
      snitch-bundle role does not support ansible_facts['system'] = {{ ansible_facts['system'] | default('unknown') }}.
      Supported: Linux (systemd), Darwin (launchd). Windows hosts use the
      install-probe-windows.ps1 installer or a sibling Win-only role.
  when: ansible_facts['system'] not in ['Linux', 'Darwin']
  tags: [snitch-bundle]

- name: Include per-OS install tasks
  ansible.builtin.include_tasks: "{{ ansible_facts['system'] }}.yml"
  tags: [snitch-bundle]
