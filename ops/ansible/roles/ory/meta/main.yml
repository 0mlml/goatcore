---
galaxy_info:
  role_name: ory
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). The `ory` ledger records the
# consent UI image, the one image this role takes from the pins
# (fleet-pins.yaml `kratos-selfservice-ui`, `ledger_component: ory`), the one
# its in-repo deploy-history.yml tracks, and the container rollback.sh flips
# (`selfservice-ui`). The Kratos and Hydra server images are role defaults
# bumped by hand and are not recorded here.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: ory
      rollback_artifact_type: image
      rollback_ref: "{{ kratos_selfservice_ui_image }}"
