---
- name: restart kratos
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml -f docker-compose.ory.yml restart kratos
    chdir: "{{ ory_compose_dir }}"

- name: restart hydra
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.yml -f docker-compose.ory.yml restart hydra
    chdir: "{{ ory_compose_dir }}"
