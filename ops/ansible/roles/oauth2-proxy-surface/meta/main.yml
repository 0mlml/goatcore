---
# SPDX-License-Identifier: Apache-2.0
galaxy_info:
  role_name: oauth2_proxy_surface
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  description: >-
    One authenticated (or group-gated) oauth2-proxy door in front of any
    surface, parameterised by surface name, hostname and upstream. Carries the
    F-310 / F-342 / F-126 / F-244 lessons once instead of per-surface.
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). The rollback ref is the
# oauth2-proxy image, which is the only artifact this role pins. Note that
# reverting the IMAGE is not how you remove a door: for that, set
# `<surface>_oauth2_proxy_enabled: false` and re-run the surface's own
# playbook, which swings its Traefik route back to the container directly.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: oauth2-proxy-surface
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ oauth2_proxy_surface_image }}"
