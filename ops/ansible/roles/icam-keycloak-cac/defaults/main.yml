---
# icam-keycloak-cac defaults — Keycloak CAC front-end (toggle-switch path #3).
# Proven end-to-end in ops/identity/keycloak-cac-proof/ (a CAC x509 cert -> Keycloak
# x509 authenticator -> OIDC token carrying the EDIPI). Default-OFF: flipping
# icam_keycloak_cac_enabled to true stands the whole path up.

icam_keycloak_cac_enabled: false           # <-- the single flag

icam_keycloak_cac_image: "quay.io/keycloak/keycloak:26.0"
icam_keycloak_cac_compose_dir: /opt/mgmt-host/icam-keycloak-cac
icam_keycloak_cac_realm: goat
icam_keycloak_cac_https_port: 8843         # mesh-only bind (see tasks); CAC mTLS
icam_keycloak_cac_http_port: 8480          # admin/back-channel

# The issuer Kratos's icam_federation provider points at (keycloak_frontend mode).
icam_keycloak_cac_issuer_url: "https://keycloak.{{ site_id }}.{{ site_dns_zone }}/realms/{{ icam_keycloak_cac_realm }}"
# Kratos OIDC client the realm registers.
icam_keycloak_cac_kratos_client_id: kratos
icam_keycloak_cac_kratos_redirect: "http://kratos:4433/self-service/methods/oidc/callback/cac-keycloak"

# The client-cert trust anchor. In production this is the real DoD PKI root/intermediate
# bundle (PEM) staged on the mgmt-host; the sandbox uses the test CA. REQUIRED when enabled.
icam_keycloak_cac_ca_bundle: ""            # e.g. /opt/mgmt-host/pki/dod-roots.pem
# The x509 -> user mapping (Subject DN regex capturing the EDIPI). Matches the CAC CN shape.
icam_keycloak_cac_edipi_dn_regex: "CN=[^,]*?\\.([0-9]+)"
# Live revocation (CRL/OCSP) — enable in production; sandbox leaves off.
icam_keycloak_cac_crl_enabled: false
icam_keycloak_cac_ocsp_enabled: false
