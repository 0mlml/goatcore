---
galaxy_info:
  role_name: e2e_canary
  author: goat-maintainer
  description: >-
    The canary component the deployment e2e harness moves through the real
    drivers (docs/design/deployment-e2e.md). A digest-pinned image, one
    compose project, one ledger row — nothing else.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: e2e-canary
      rollback_artifact_type: image
      rollback_ref: "{{ e2e_canary_image }}"
      # A served payload, as goat-get carries them (the release a role var
      # names, not the image): the hermetic tier proves a payload change with
      # an unchanged image is seen as drift and recorded on the next deploy.
      rollback_served_root: "{{ e2e_canary_dir }}"
      rollback_served:
        - {name: e2e-payload, tag_var: e2e_canary_payload_tag, file: served/version.json}
