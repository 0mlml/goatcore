---
# e2e-canary — the smallest component the deployment engineering can move.
#
# It exists so the real drivers (deploy-component.sh, rc.sh, rollback.sh,
# fastlane.sh and goatbuilder's verbs) can be exercised end to end against
# hosts that cost nothing: a hermetic host set in CI (docs/design/deployment-e2e.md
# §Hermetic) and, nightly, the zagros-dev management host (§Live canary). It
# templates no secret by design, carries no data, and is reversible by a pin
# revert like any image component.

# The digest-pinned image reference, rendered into group_vars/<member>/pins.yml
# from ops/pins/fleet-pins.yaml. Never a tag alone.
e2e_canary_image: ""

# Where the image is pulled from. The pin names ghcr.io/<org>/e2e-canary; the
# hermetic set serves the same bytes from a local registry, so the host rewrites
# only the registry prefix and pulls by the SAME digest (the pin's digest is the
# proof, wherever the bytes came from).
e2e_canary_registry: "ghcr.io/{{ ghcr_org }}"

# One compose project per host, so three hermetic hosts sharing one Docker
# daemon do not collide; on a real host the suffix is just the host's name.
e2e_canary_dir: "/opt/e2e-canary"
e2e_canary_container: "e2e-canary-{{ inventory_hostname }}"

# The canary's served payload (rollback_served in meta): a marker file the role
# writes, standing in for a release goat-get downloads at deploy time.
e2e_canary_payload_tag: "e2e-payload-v1"
