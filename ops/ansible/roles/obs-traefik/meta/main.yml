---
galaxy_info:
  role_name: obs_traefik
  author: goat-maintainer
  description: |
    Public-facing TLS terminator on Orin-C for the operator IdP +
    every obs/utility consumer per ADR 0842.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: obs-traefik
      rollback_artifact_type: image
      rollback_ref: "{{ obs_traefik_image }}"