---
- name: restart obs-traefik
  ansible.builtin.command:
    cmd: docker compose restart traefik
    chdir: "{{ obs_traefik_compose_dir }}"
  changed_when: true

- name: reload obs-traefik dynamic config
  # Traefik 3.x file provider auto-reloads on file change — no SIGHUP
  # needed. This handler is a no-op stub kept for future static-config
  # changes (which DO require restart).
  ansible.builtin.debug:
    msg: "Traefik file provider auto-reloads dynamic config; no action required."
