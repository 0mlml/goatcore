---
- name: restart mgmt-host-compose-watch
  ansible.builtin.systemd:
    name: mgmt-host-compose-watch.service
    state: restarted

- name: reload systemd and restart mgmt-host-compose-watch
  ansible.builtin.systemd:
    name: mgmt-host-compose-watch.service
    state: restarted
    daemon_reload: true
