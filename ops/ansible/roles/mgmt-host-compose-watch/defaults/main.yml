---
# Optional service allowlist — space-separated list of compose service
# names. When set, the watcher revives only matching services, not all
# exited services. Empty (default) preserves prior behavior — revive
# everything in `--status=exited`.
#
# Production-relevant once Block 21C-production lands docker-compose.ory.yml
# on mgmt-hosts. Without the allowlist, the watcher cycles
# `kratos-migrate` + `hydra-migrate` (which exit 0 by design) every poll
# cycle, hammering postgres. Set per-site via group_vars to long-running
# services only.
#
# Example for a site running netbird + Ory:
#   mgmt_host_compose_watch_services: "kratos hydra postgres-a postgres-b signal-a signal-b management-a management-b"
mgmt_host_compose_watch_services: ""

# node_exporter textfile-collector directory for compose_service_running.prom.
#
# The default matches what the script has always used, and it is right on hosts
# where node-exporter bind-mounts exactly this path.
#
# It is WRONG on a host where node-exporter runs containerised with
# --collector.textfile.directory=/textfile fed from
# /opt/<site_id>-obs/expected-vendors/textfile. Such a host can also HAVE a directory
# at the path below, writable, read by nothing — so the metric lands, looks
# fine, and never reaches Prometheus. Override per goatnet in group_vars;
# verify with `ps -o args= -C node_exporter | grep textfile.directory` rather
# than by checking the file appeared.
mgmt_host_compose_watch_metrics_dir: /var/lib/node_exporter/textfile
