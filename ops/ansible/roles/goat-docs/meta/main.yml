---
galaxy_info:
  role_name: goat_docs
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    when: goat_docs_enabled | default(true) | bool
    vars:
      rollback_component: goat-docs
      rollback_artifact_type: image
      rollback_ref: "{{ goat_docs_image }}"
      # The books served are versioned by these vars, not by the nginx image;
      # read back into the ledger row at the end of the play (as goat-get).
      rollback_served_root: "{{ goat_docs_www_dir }}"
      rollback_served:
        - {name: goat-book, tag_var: goat_docs_release_tag, file: version.json}
        - {name: goatbuilder-book, tag_var: goat_docs_goatbuilder_release_tag, enabled_var: goat_docs_goatbuilder_enabled, file: "{{ goat_docs_goatbuilder_www_subdir }}/version.json"}
