---
galaxy_info:
  role_name: postgres_streaming_replication
  description: >
    Wires intra-site Postgres streaming replication between A (primary)
    and B (hot standby). Idempotent — detects healthy existing standby
    and skips destructive wipe. Companion to ha-failover.md Phase B.
  author: goat
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions: [jammy, noble]
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: postgres-streaming-replication
      rollback_artifact_type: data
      rollback_ref: "{{ postgres_basebackup_client_image }}"
      rollback_restore_pointer: "pgBackRest stanza + streaming primary (ha-multi-site.md); an image re-pin does NOT restore rows"