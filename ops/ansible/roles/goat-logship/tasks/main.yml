---
# Declared end state (ADR 1206): a site that sets `goat_logship_enabled: false` in its
# group_vars does not run goat-logship, so no play that reaches this role deploys it.
# Unset keeps the role's long-standing behaviour (deploy). The gate that keeps
# this true for every catalog service: ops/ci/check-role-honours-presence-flag.py.
- name: goat-logship | deploy (skipped where the site declares goat_logship_enabled false)
  ansible.builtin.import_tasks: deploy.yml
  when: goat_logship_enabled | default(true) | bool
