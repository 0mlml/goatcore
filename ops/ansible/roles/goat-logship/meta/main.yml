---
galaxy_info:
  role_name: goat_logship
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). goat-logship is additive and
# removable by pin-revert with no effect on the audit/metrics planes.
dependencies:
  - role: rollback-ledger
    when: goat_logship_enabled | default(true) | bool
    vars:
      rollback_component: goat-logship
      rollback_artifact_type: image
      rollback_ref: "{{ logship_vector_image }}"
