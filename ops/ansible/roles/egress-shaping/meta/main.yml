---
# ADR 1081 Layer 3 — site-host (Thor) egress survivability.
# docs/design/control-plane-storm-resilience.md §"Layer 3".
#
# Opt-in via the single `egress_shaping_enabled` var (default OFF), like the
# sibling goat-relay-host-tuning role. Turned on per-host only after the
# tc-netem canary gate (README §Verification).
#
# NO rollback-ledger meta-dependency — deliberate, and matching the sibling
# host-tuning role (dependencies: []). This role touches no rollable artifact
# (no image/config-SHA pin): rollback is "toggle off; qdisc + sysctl revert
# idempotently" (ADR 1081 L3). A meta-dependency also runs on EVERY baseline
# pass regardless of the task-level `when`, so it would write a spurious ledger
# row on every mgmt host even while the feature is disabled. See the disabled
# path in tasks/main.yml for the actual revert.

galaxy_info:
  role_name: egress_shaping
  author: goat-maintainer
  description: >-
    ADR 1081 L3 host-local WAN-egress shaping — cake qdisc + control-plane
    DSCP steering (host-local, washed on egress) + BBR — behind one toggle.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - networking
    - qos
    - storm-resilience

dependencies: []
