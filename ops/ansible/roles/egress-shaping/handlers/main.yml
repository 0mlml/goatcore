---
# ops/ansible/roles/egress-shaping/handlers/main.yml

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: reapply egress shaping
  # Re-run the oneshot so a changed script/unit re-applies cake + the DSCP
  # marks. RemainAfterExit oneshot: restart re-runs ExecStart. Idempotent.
  ansible.builtin.systemd:
    name: goat-egress-shaping.service
    state: restarted
    daemon_reload: true
