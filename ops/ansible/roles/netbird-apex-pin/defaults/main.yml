---
# SPDX-License-Identifier: Apache-2.0
#
# netbird-apex-pin defaults. See tasks/main.yml for the mechanism.

# The goatnet's PUBLIC enrollment apex — the name the netbird client dials to
# reach management. Not the mesh FQDN of any peer.
#   example: netbird.example.net
netbird_apex_fqdn: ""

# The apex's public A records — the relay public IPs. Resolve them from a host
# that is ON the mesh (`dig +short <apex> @1.1.1.1`), never from a node that is
# already trapped: its answer is the thing that is broken.
#
# These change only when the relay estate changes; a stale entry degrades to
# "dials a dead relay" which the client survives (it retries the others), and a
# re-run rewrites it.
netbird_apex_ips: []

# Fail-closed guard. MGMT hosts may legitimately resolve the apex to 127.0.0.1
# with a local :8443 management-url, so this role
# refuses to run unless the caller states the host is not one. Edge nodes — Pis,
# pods, octopods, sensor relays — are never mgmt hosts.
netbird_apex_pin_is_mgmt_host: false
