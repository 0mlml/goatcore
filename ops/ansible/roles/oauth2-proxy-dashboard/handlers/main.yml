---
- name: reload oauth2-proxy-dashboard compose
  ansible.builtin.command:
    cmd: >-
      docker compose
      -f /opt/mgmt-host/docker-compose.yml
      -f {{ dashboard_oauth2_proxy_compose_file }}
      up -d --force-recreate {{ dashboard_oauth2_proxy_service }}
    chdir: /opt/mgmt-host
  changed_when: true
