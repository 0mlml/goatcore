---
# Parse-only fixture for the oauth2-proxy-dashboard role.

- name: oauth2-proxy-dashboard | parse-only fixture
  hosts: localhost
  gather_facts: false
  vars:
    site_id: test-site
    site_dns_zone: example.invalid
    mesh_ip_a: 127.0.0.1
    dashboard_oauth2_proxy_enabled: true
    dashboard_oauth2_proxy_client_secret: "test-oidc-client-secret-32-chars-aaaaaa"
    dashboard_oauth2_proxy_cookie_secret: "test-cookie-secret-32-chars-aaaaa"
  tasks:
    # Skipping the role body because it runs `docker compose up`. Syntax-
    # only check; the parent ansible-playbook --syntax-check still
    # exercises every task's YAML well-formedness via the role import below.
    - name: import role for syntax-check only
      ansible.builtin.import_role:
        name: ../..
      tags: [never]
