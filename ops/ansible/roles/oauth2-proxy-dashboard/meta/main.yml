---
galaxy_info:
  role_name: oauth2_proxy_dashboard
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: "{{ dashboard_oauth2_proxy_service | default('oauth2-proxy-dashboard') }}"
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ oauth2_proxy_dashboard_image }}"
