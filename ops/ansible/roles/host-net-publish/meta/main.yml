---
galaxy_info:
  role_name: host_net_publish
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Artifact = the committed script.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: host-net-publish
      rollback_artifact_type: script
      rollback_ref: "ops/relay/health/host-net-publish.sh"
