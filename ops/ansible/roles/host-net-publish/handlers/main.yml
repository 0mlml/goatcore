---
- name: restart host-net-publish timer
  ansible.builtin.systemd:
    name: host-net-publish.timer
    state: restarted
    daemon_reload: true

- name: restart host-net-ratesample
  ansible.builtin.systemd:
    name: host-net-ratesample.service
    state: restarted
    daemon_reload: true

- name: restart host-net iperf3 target
  ansible.builtin.systemd:
    name: host-net-iperf3-target.service
    state: restarted
    daemon_reload: true
