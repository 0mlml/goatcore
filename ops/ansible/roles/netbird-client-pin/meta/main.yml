---
galaxy_info:
  role_name: netbird_client_pin
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060). Artifact = the pin value in
# group_vars; rollback = change the pin and re-run (the role reinstalls +
# re-holds whatever netbird_version says).
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: netbird-client-pin
      rollback_artifact_type: config
      rollback_ref: "netbird={{ netbird_version }}"
