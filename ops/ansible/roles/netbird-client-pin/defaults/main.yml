---
# netbird-client-pin — pin the netbird CLIENT package to an exact version and
# keep the dpkg-managed binary authoritative.
#
# Default is EMPTY = the role is a complete no-op. Set the pin per host group
# (e.g. group_vars/<site>_hosts/vars.yml) — a fleet-wide pin in all.yml would
# force every goatnet's mgmt hosts onto one version, which is not the model
# (sites upgrade independently).
netbird_version: ""

# -- netbird.out / netbird.err rotation ---------------------------------------
# The netbird unit sends the daemon's raw stdout/stderr to FILES:
#   StandardOutput=file:/var/log/netbird/netbird.out
#   StandardError=file:/var/log/netbird/netbird.err
# Nothing rotates them. That is separate from --log-file (/var/log/netbird/
# client.log), which netbird rotates itself — so the tidy, rotating log lulls
# you into thinking logging is handled while the raw capture grows forever.
#
# A busy host's netbird.out can reach ~10 GiB and grow several GiB/day.
#
# copytruncate is MANDATORY, not a preference. systemd opens these files and
# hands the daemon fd 1/2 for the life of the process; a rename-and-create
# rotation would leave netbird writing into the unlinked inode forever — the
# file would keep growing invisibly and the space would not come back until the
# daemon restarted. Verify with `lsof /var/log/netbird/netbird.out` if changing
# this.
netbird_log_rotate_enabled: true
netbird_log_rotate_maxsize: "200M"
netbird_log_rotate_keep: 3
