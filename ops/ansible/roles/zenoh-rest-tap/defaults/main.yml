---
# SPDX-License-Identifier: Apache-2.0
# zenoh-rest-tap: once a second, record who holds a connection to the zenoh
# router's REST port (source address + count). The wedge investigation reads the
# tail of this log (docs/operations/zenoh-wedge-investigation-playbook.md).

# The router container whose network namespace is read.
zenoh_rest_tap_router_container: "{{ zenoh_health_router_container }}"
zenoh_rest_tap_port: 8000
zenoh_rest_tap_log: /var/log/zenoh-rest-access.log
zenoh_rest_tap_rotate_days: 7
zenoh_rest_tap_max_size: 50M
