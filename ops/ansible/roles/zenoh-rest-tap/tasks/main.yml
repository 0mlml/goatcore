---
# SPDX-License-Identifier: Apache-2.0
- name: zenoh-rest-tap | install the tap script
  ansible.builtin.copy:
    src: zenoh-rest-tap.sh
    dest: /usr/local/sbin/zenoh-rest-tap.sh
    owner: root
    group: root
    mode: "0755"
  notify: restart zenoh-rest-tap

- name: zenoh-rest-tap | install the unit
  ansible.builtin.template:
    src: zenoh-rest-tap.service.j2
    dest: /etc/systemd/system/zenoh-rest-tap.service
    owner: root
    group: root
    mode: "0644"
  notify: restart zenoh-rest-tap

# One bad line in a drop-in fails logrotate.service for the whole host, so a
# stanza logrotate cannot parse is refused here rather than installed.
- name: zenoh-rest-tap | install the rotation stanza
  ansible.builtin.template:
    src: zenoh-rest-tap.logrotate.j2
    dest: /etc/logrotate.d/zenoh-rest-tap
    owner: root
    group: root
    mode: "0644"
    validate: logrotate -d %s

- name: zenoh-rest-tap | enable and start
  ansible.builtin.systemd:
    name: zenoh-rest-tap.service
    enabled: true
    state: started
    daemon_reload: true
