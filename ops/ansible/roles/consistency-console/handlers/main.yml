- name: consistency-console | recreate container
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ consistency_console_compose_dir }}"

- name: consistency-aggregator | recreate container
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ consistency_aggregator_compose_dir }}"
