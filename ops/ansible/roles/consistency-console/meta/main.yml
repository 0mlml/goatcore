---
# SPDX-License-Identifier: Apache-2.0
galaxy_info:
  role_name: consistency-console
  author: goat-maintainer
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble

# Universal deploy-rollback ledger (ADR 1060) — §7.2's own requirement: the
# console deploys like every deploying role, so it is observable by the very
# surface it renders.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: consistency-console
      rollback_artifact_type: image
      rollback_promote_mode: explicit  # mid-role flush_handlers; promote after smoke
      rollback_ref: "{{ consistency_console_image }}"
