---
# ops/ansible/roles/admit-audit/defaults/main.yml
#
# Defaults for the admit-audit role. Override per-play or per-host
# as needed.

# Where the mgmt-host compose stack lives (matches ops/ansible/mgmt-host.yml
# + roles/observability/).
compose_dir: /opt/mgmt-host

# Whether the base stack was brought up with the phase2 override.
# vega production PoC is single-instance per host, so default false.
phase2: false

# Read-only Postgres role used by the admit-audit sidecar. SELECT
# on public.peers only — no access to setup_keys, users, or the
# spock schema.
pg_admit_audit_role: admit_audit

# DB where the peers table lives (the one Netbird management
# writes to).
pg_admit_audit_db: netbird

# Container image: the build .github/workflows/admit-audit-image.yml publishes
# as goat-admit-audit, pinned by digest. The bare name `admit-audit` is a
# hand-pushed mirror from 2026-08-18 under ghcr.io/usareur-af that nothing
# builds, and it does not exist under any other namespace, so a goatnet pulling
# `admit-audit:latest` ran a stale image, and one on a fresh namespace pulled
# nothing. Moving a running goatnet onto this image is a version change: take
# it through the release ladder. Override via
# -e admit_audit_image=ghcr.io/{{ ghcr_org }}/goat-admit-audit:sha-<rev>@sha256:<digest>
admit_audit_image: "ghcr.io/{{ ghcr_org }}/goat-admit-audit@sha256:4b4d996ced4999507630266a21ec69a16bf19644df102d205c268d972ca64645"
