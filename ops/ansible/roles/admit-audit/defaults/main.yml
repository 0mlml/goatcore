---
# ops/ansible/roles/admit-audit/defaults/main.yml
#
# Defaults for the admit-audit role. Override per-play or per-host
# as needed.

# Where the mgmt-host compose stack lives (matches ops/ansible/mgmt-host.yml
# + roles/observability/).
compose_dir: /opt/mgmt-host

# Whether the base stack was brought up with the phase2 override.
# vega production PoC is single-instance per host, so default false.
phase2: false

# Read-only Postgres role used by the admit-audit sidecar. SELECT
# on public.peers only — no access to setup_keys, users, or the
# spock schema.
pg_admit_audit_role: admit_audit

# DB where the peers table lives (the one Netbird management
# writes to).
pg_admit_audit_db: netbird

# Container image — pinned per-release by CI. Override via
# -e admit_audit_image=ghcr.io/{{ ghcr_org }}/admit-audit:vX.Y.Z
admit_audit_image: ghcr.io/{{ ghcr_org }}/admit-audit:latest
