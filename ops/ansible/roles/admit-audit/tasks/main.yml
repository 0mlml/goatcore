---
# Declared end state (ADR 1206): a site that sets `admit_audit_enabled: false` in its
# group_vars does not run admit-audit, so no play that reaches this role deploys it.
# Unset keeps the role's long-standing behaviour (deploy). The gate that keeps
# this true for every catalog service: ops/ci/check-role-honours-presence-flag.py.
- name: admit-audit | deploy (skipped where the site declares admit_audit_enabled false)
  ansible.builtin.import_tasks: deploy.yml
  when: admit_audit_enabled | default(true) | bool
