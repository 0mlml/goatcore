---
# Easy-rollback wiring for netbird-mgmt per ADR 0859.
#
# Two responsibilities, both idempotent + audit-only:
#   1. Write NETBIRD_MGMT_IMAGE to /opt/mgmt-host/.env so the shared
#      compose's ${NETBIRD_MGMT_IMAGE:-default} substitution picks
#      up the SHA-pinned value from defaults/main.yml.
#   2. Append an NDJSON deploy event to the per-host runtime ledger.
#
# Does NOT bring up the container — that's the ory + mgmt-host
# wrapper roles' job. This role can be applied independently and is
# safe to re-run.

- name: netbird-mgmt | set NETBIRD_MGMT_IMAGE in /opt/mgmt-host/.env (ADR 0859)
  ansible.builtin.lineinfile:
    path: "{{ netbird_mgmt_envfile }}"
    regexp: "^NETBIRD_MGMT_IMAGE="
    line: "NETBIRD_MGMT_IMAGE={{ netbird_mgmt_image }}"
    owner: root
    group: root
    mode: "0600"
    create: true
  become: true
# Deploy ledger now written by the shared `rollback-ledger`
# meta-dependency (meta/main.yml) per ADR 1060 — no per-role task here.