---
# Defaults for the netbird-mgmt role (easy-rollback wiring only).
#
# This role does NOT bring up the management container — that's the
# ory + mgmt-host wrapper roles' job, via the shared
# ops/compose/mgmt-host/docker-compose.yml file. This role exists so
# the netbird-mgmt service has the canonical easy-rollback substrate
# per ADR 0859 (deploy-history.yml + per-host runtime ledger + env-
# write for the image var).
#
# Apply via the site's netbird-mgmt easy-rollback playbook after
# the mgmt-host stack is up; idempotent re-apply.

# Image — digest-pinned per ADR 0859 (easy rollback). Compose-time
# substitution via /opt/mgmt-host/.env — the role writes
# NETBIRD_MGMT_IMAGE there alongside other compose env vars. Bumps
# require an append to deploy-history.yml (CI checks via
# .github/workflows/deploy-history-check.yml). Upstream netbirdio/
# management image (or ghcr.io/{{ ghcr_org }}/netbird-mgmt:patched-<ref>
# for sites running the AutoPeerName fork-patch image).
netbird_mgmt_image: "netbirdio/management:0.68.3@sha256:8d3ac9d38c9589520d9d1563c8ae3646b9a038596aae16b9ed089602060a8001"

# Shared compose env-file path — same as ory + dashboard + isitup +
# oauth2-proxy-dashboard.
netbird_mgmt_envfile: /opt/mgmt-host/.env
