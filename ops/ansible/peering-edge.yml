---
# peering-edge.yml — stand up the strongSwan IPsec peering edge for a
# cross-sovereign federation link.
#
#   Design:   docs/design/cross-sovereign-peering-transport.md
#   Handoff:  docs/project/cross-sovereign-federation-handoff.md  (lane B, S2)
#   Role:     roles/goat-peering-edge/README.md
#
# THE `peering_edges` GROUP IS EMPTY UNTIL A HOST IS CHOSEN, and that is
# deliberate. The design targets an x86 boundary node; the candidate host today
# (mgmt-zagros-01-thor) is aarch64 on NVIDIA's tegra kernel, where the Canonical
# FIPS kernel cannot be installed, so it can only run this edge under a
# recorded waiver. Add the group to an inventory file when the host is decided
# — do not add it here, and do not point this play at a host that has not been
# through the role README's "Before you apply this to a host" checklist.
#
# The declaration lives in group_vars/peering_edges/vars.yml, one block per
# peering, mirroring the peering declaration in the design §5. Nothing in it is
# secret: public endpoints, agreed names, an MTU.
#
# Run:
#   cd ops/ansible
#   OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES aws-vault exec usareur-af --no-session -- \
#     ../scripts/ansible-preflight.sh -i inventory/mgmt-hosts-mesh.ini peering-edge.yml
#
# Rollback: revert the declaration commit and re-run (config artifact, ADR
# 1060). To cut the link immediately and unilaterally, without waiting for a
# play: `swanctl --terminate --ike <peering_edge_name>` then
# `systemctl stop goat-peering-link@<name>`. Local, immediate, effective on
# established sessions — the property §1 of the design chose this shape for.

- name: Cross-sovereign peering edge (strongSwan IPsec)
  hosts: peering_edges
  gather_facts: true
  become: true
  roles:
    - role: goat-peering-edge
