# rathole server config — runs on AWS EC2 VPS
# Accepts inbound connections on public ports and forwards them
# through the rathole tunnel to the NETHOST behind the satellite link NAT.
#
# Deploy to: /etc/rathole/server.toml on the VPS
# Run with:  rathole -s /etc/rathole/server.toml
# Permissions: chmod 600 (contains secret token and private key)

[server]
bind_addr = "0.0.0.0:2333"
default_token = "CHANGEME_GENERATE_WITH_openssl_rand_hex_32"

[server.transport]
type = "noise"

[server.transport.noise]
# Generate with: rathole --genkey
# Put the PRIVATE key here, give the PUBLIC key to the client config
local_private_key = "CHANGEME_SERVER_PRIVATE_KEY_BASE64"

# Netbird management (gRPC + dashboard + API)
# Remote peers connect to VPS_IP:443 → forwarded to NETHOST:443
[server.services.netbird-mgmt]
type = "tcp"
bind_addr = "0.0.0.0:443"

# Netbird STUN/TURN (NAT traversal)
# Remote peers send STUN to VPS_IP:3478 → forwarded to NETHOST:3478
[server.services.netbird-stun]
type = "udp"
bind_addr = "0.0.0.0:3478"

# Netbird Signal (peer discovery WebSocket)
# Typically goes through Traefik on 443, but if separated:
# [server.services.netbird-signal]
# type = "tcp"
# bind_addr = "0.0.0.0:4222"
