# rathole client config — runs on NETHOST behind the satellite link NAT
# Maintains a persistent outbound connection to the VPS.
# Forwards incoming traffic from VPS to local Netbird services.
#
# Deploy to: /etc/rathole/client.toml on the NETHOST
# Run with:  rathole -c /etc/rathole/client.toml
# Permissions: chmod 600 (contains secret token and server public key)

[client]
remote_addr = "CHANGEME_VPS_PUBLIC_IP:2333"
default_token = "CHANGEME_MUST_MATCH_SERVER_TOKEN"

# Reconnect aggressively — this is the lifeline for remote enrollment
heartbeat_timeout = 40
retry_interval = 1

[client.transport]
type = "noise"

[client.transport.noise]
# The SERVER's public key (not the client's)
# Get this from the VPS after running: rathole --genkey
remote_public_key = "CHANGEME_SERVER_PUBLIC_KEY_BASE64"

# Netbird management — forward VPS:443 to local Traefik
[client.services.netbird-mgmt]
type = "tcp"
local_addr = "127.0.0.1:443"

# Netbird STUN/TURN — forward VPS:3478 to local coturn
[client.services.netbird-stun]
type = "udp"
local_addr = "127.0.0.1:3478"
