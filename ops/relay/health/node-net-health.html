<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>goat · node net health</title>
<!--
  node-net-health.html — the per-node connection-inventory dashboard
  (docs/design/node-net-health.md), served beside relay-health.html and built
  the same way: one self-contained file, vanilla JS, no build step, no
  framework, zero external assets. Reads node-net-health.json written by the
  goat-node-net-health rollup reader (a passive subscriber of
  ops/net/health/** — reveal-only, no central poller of nodes).

  Two levels, hash-routed (back-button works): fleet node list -> per-node
  drilldown (undeclared risk list FIRST, then mesh peers, then the full
  classified connection table). Every number carries its vantage: the node's
  own (each node classifies its own sockets).

  Honesty: stale envelope greys the node + shows age; undeclared > 0 is amber
  and the count is always visible; unmeasured latency renders "not measured",
  never a proxy number.
-->
<style>
  :root{
    --bg:#14110d; --panel:#1d1812; --panel2:#241d15; --line:#3a3026;
    --ink:#f0e6d6; --dim:#9c8f7a; --faint:#6b6051;
    --green:#5cb85c; --amber:#e0a32e; --red:#d9534f; --grey:#5b5346; --blue:#4c9fd6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:18px;letter-spacing:.5px}
  header h1 .goat{color:var(--amber)}
  .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .fleet{margin-left:auto;display:flex;gap:18px;align-items:center}
  .fleet .big{font-size:26px;font-weight:700;font-family:var(--mono)}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
    font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
  .p-green{background:rgba(92,184,92,.18);color:var(--green)}
  .p-amber{background:rgba(224,163,46,.18);color:var(--amber)}
  .p-red{background:rgba(217,83,79,.2);color:var(--red)}
  .p-grey{background:rgba(91,83,70,.25);color:var(--dim)}
  main{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
  .d-green{background:var(--green)} .d-amber{background:var(--amber)}
  .d-red{background:var(--red)} .d-grey{background:var(--grey)}
  .sdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
  .noderow{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;cursor:pointer}
  .noderow:hover{background:var(--panel2)}
  .noderow.stale{opacity:.55}
  .noderow .name{font-weight:700;font-family:var(--mono);font-size:14px;min-width:170px}
  .noderow .cls{color:var(--dim);font-family:var(--mono);font-size:11px;min-width:80px}
  .badge{font-family:var(--mono);font-size:11px;border-radius:5px;padding:1px 7px;border:1px solid var(--line)}
  .b-amber{color:var(--amber);background:rgba(224,163,46,.12)}
  .b-ok{color:var(--dim);background:var(--panel2)}
  .noderow .meshcol,.noderow .conncol{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .noderow .age{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .crumb{padding:14px 22px 0;font-size:12px;font-family:var(--mono)}
  .crumb a{color:var(--blue);text-decoration:none;cursor:pointer}
  .crumb a:hover{text-decoration:underline}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .card h4{margin:4px 0 10px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--dim);font-weight:700}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px}
  th{color:var(--dim);text-align:left;font-weight:600;padding:4px 10px 4px 0;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:10px;letter-spacing:.4px}
  td{padding:4px 10px 4px 0;border-bottom:1px dashed rgba(58,48,38,.6);color:var(--ink);white-space:nowrap}
  td.dim{color:var(--dim)} td.faint{color:var(--faint)}
  .note{color:var(--faint);font-size:11px}
  .warnbox{border:1px solid rgba(224,163,46,.32);background:rgba(224,163,46,.07);border-radius:10px;padding:12px 16px}
  .warnbox h4{color:var(--amber)}
  .tablewrap{overflow-x:auto}
  footer{padding:12px 22px;color:var(--faint);font-size:11px;border-top:1px solid var(--line);font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <h1><span class="goat">goat</span> · node net health</h1>
  <span class="sub" id="scope">—</span>
  <div class="fleet">
    <div><div class="big" id="fleetCount">—</div><div class="sub">nodes clean</div></div>
    <span class="pill p-grey" id="fleetPill">loading</span>
  </div>
</header>
<div id="crumb" class="crumb" style="display:none"></div>
<main id="grid"></main>
<footer id="foot">—</footer>

<script>
// ===================== CONFIG (hack here) =====================
const REFRESH_MS  = 15000;
const JSON_URL    = "net/node-net-health.json"; // written by the rollup reader (65532-owned subdir)
const STALE_AFTER = 3 * 3600;                 // s; ~3 snapshot intervals greys a node
// ==============================================================
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (s) => s < 60 ? Math.round(s)+"s" : s < 3600 ? Math.round(s/60)+"m" : Math.round(s/3600)+"h";
const hbytes = (n) => { if(n==null) return "—"; const u=["B","KB","MB","GB"]; let i=0,v=n; while(v>=1024&&i<3){v/=1024;i++} return (i?v.toFixed(1):v)+" "+u[i]; };
function sdot(c){ return {green:"d-green",amber:"d-amber",red:"d-red"}[c]||"d-grey"; }
let LAST = null;
function route(){ return new URLSearchParams(location.hash.replace(/^#/,"")).get("node"); }
function openNode(n){ location.hash = "node="+encodeURIComponent(n); }
function goFleet(){ location.hash = ""; }
window.addEventListener("hashchange", ()=>{ if(LAST) render(LAST); });

function detailOf(entry){ return (entry.env.detail && entry.env.detail.Net) || null; }

function nodeRow(name, entry, now){
  const env = entry.env, d = detailOf(entry) || {};
  const ageS = Math.max(0, now - env.ts_unix_ms/1000);
  const stale = ageS > STALE_AFTER;
  const color = stale ? "grey" : env.overall_color;
  const und = d.undeclared_count || 0;
  const undBadge = und > 0
    ? `<span class="badge b-amber">${und} undeclared</span>`
    : `<span class="badge b-ok">0 undeclared</span>`;
  const conns = (d.conns||[]);
  const bucket = b => conns.filter(c=>c.bucket===b).length;
  return `<div class="noderow ${stale?'stale':''}" onclick="openNode('${esc(name)}')" title="open ${esc(name)}">
    <span class="dot ${sdot(color)}"></span>
    <span class="name">${esc(name)}</span>
    <span class="cls">${esc(d.node_class||"?")}</span>
    ${undBadge}
    <span class="meshcol">mesh ${d.mesh_active??"—"} active / ${d.mesh_stale??"—"} stale</span>
    <span class="conncol">${conns.length} conns · ${bucket("mesh")}m/${bucket("fabric")}f/${bucket("baseline")}b</span>
    <span class="age">${stale?"STALE · ":""}${ago(ageS)} ago · vantage: the node itself</span>
  </div>`;
}

function nodeDetail(name, entry, now){
  const d = detailOf(entry);
  if(!d) return `<div class="card"><div class="note">no detail in this envelope</div></div>`;
  const und = (d.conns||[]).filter(c=>c.bucket==="undeclared");
  const fmtSeen = ms => (ms>0) ? ago(Math.max(0,(now - ms/1000)))+" ago" : "—";
  let h = "";
  if(und.length){
    h += `<div class="warnbox"><h4>undeclared — ${und.length} connection${und.length!==1?"s":""} outside the ${esc(d.node_class)} egress contract</h4>
      <div class="tablewrap"><table><tr><th>proto</th><th>state</th><th>local</th><th>remote</th><th>process</th><th>container</th><th>first seen</th><th>last seen</th></tr>
      ${und.map(c=>`<tr><td>${esc(c.proto)}</td><td>${esc(c.state)}</td><td>${esc(c.local_addr)}</td><td>${esc(c.remote_addr)||"—"}</td>
        <td>${esc(c.comm)}[${c.pid||"?"}]</td><td class="dim">${esc(c.container)||"host"}</td>
        <td class="dim">${fmtSeen(c.first_seen_unix_ms)}</td><td class="dim">${fmtSeen(c.last_seen_unix_ms)}</td></tr>`).join("")}
      </table></div>
      <div class="note" style="margin-top:8px">either declare it — with its why — in the group_vars baseline registry, or investigate.
      This surface observes and reports; enforcement is the egress-proxy design (Block 17).</div></div>`;
  } else {
    h += `<div class="card"><h4>undeclared</h4><div class="note">none — every socket matched the mesh/fabric planes or the declared ${esc(d.node_class)} egress contract.</div></div>`;
  }
  const peers = (d.mesh_peers||[]);
  const shownPeers = peers.filter(p=>p.conn_type!=="");     // connected only; disconnected = panoscope's job
  h += `<div class="card"><h4>mesh peers — ${d.mesh_active} active / ${d.mesh_stale} stale of ${peers.length} enrolled <span class="note">(stale = no WireGuard handshake for 3× the 120 s rekey window; disconnected peers are not listed — absence is not illness)</span></h4>
    <div class="tablewrap"><table><tr><th>peer</th><th>state</th><th>path</th><th>handshake</th><th>rx/tx since last snapshot</th><th>latency</th></tr>
    ${shownPeers.sort((a,b)=>(b.active-a.active)||a.peer_fqdn.localeCompare(b.peer_fqdn)).map(p=>`<tr>
      <td>${esc(p.peer_fqdn.split(".")[0])}</td>
      <td>${p.active?'<span style="color:var(--green)">active</span>':'<span style="color:var(--amber)">stale</span>'}</td>
      <td class="dim">${esc(p.conn_type)}</td>
      <td class="dim">${p.handshake_age_ms>=0?ago(p.handshake_age_ms/1000)+" ago":"—"}</td>
      <td class="dim">${hbytes(p.rx_bytes_delta)} / ${hbytes(p.tx_bytes_delta)} <span class="faint">/ ${d.snapshot_gap_secs||"?"}s</span></td>
      <td class="dim">${p.latency_ms>0?p.latency_ms.toFixed(0)+" ms":"not measured"}</td></tr>`).join("")}
    </table></div></div>`;
  const conns = (d.conns||[]).filter(c=>c.bucket!=="undeclared");
  h += `<div class="card"><h4>classified connections — ${conns.length} <span class="note">(mesh/fabric/baseline; loopback + docker-internal excluded by design)</span></h4>
    <div class="tablewrap"><table><tr><th>bucket</th><th>proto</th><th>state</th><th>local</th><th>remote</th><th>process</th><th>container</th><th>rule</th></tr>
    ${conns.sort((a,b)=>a.bucket.localeCompare(b.bucket)).map(c=>`<tr>
      <td>${esc(c.bucket)}</td><td class="dim">${esc(c.proto)}</td><td class="dim">${esc(c.state)}</td>
      <td class="dim">${esc(c.local_addr)}</td><td class="dim">${esc(c.remote_addr)||"—"}</td>
      <td>${esc(c.comm)}</td><td class="dim">${esc(c.container)||"host"}</td>
      <td class="faint">${esc(c.baseline_rule)||"—"}</td></tr>`).join("")}
    </table></div></div>`;
  return h;
}

function render(data){
  LAST = data;
  const now = Math.floor(Date.now()/1000);
  const names = Object.keys(data.nodes||{});
  let clean = 0, anyAmber=false, anyRed=false, allStale = names.length>0;
  names.forEach(n=>{
    const e = data.nodes[n];
    const ageS = now - e.env.ts_unix_ms/1000;
    if(ageS <= STALE_AFTER){
      allStale = false;
      if(e.env.overall_color==="green") clean++;
      if(e.env.overall_color==="amber") anyAmber=true;
      if(e.env.overall_color==="red") anyRed=true;
    }
  });
  $("scope").textContent = `${names.length} nodes · each node classifies its own sockets (reveal-only; hourly snapshots)`;
  $("fleetCount").textContent = `${clean}/${names.length}`;
  const pill = $("fleetPill");
  if(!names.length){ pill.className="pill p-grey"; pill.textContent="no nodes"; }
  else if(allStale){ pill.className="pill p-grey"; pill.textContent="stale"; }
  else if(anyRed){ pill.className="pill p-red"; pill.textContent="attention"; }
  else if(anyAmber){ pill.className="pill p-amber"; pill.textContent="undeclared present"; }
  else { pill.className="pill p-green"; pill.textContent="clean"; }

  const sel = route();
  const crumb = $("crumb");
  if(sel && data.nodes[sel]){
    crumb.style.display = "block";
    // Cross-surface deep-link (zenoh-surface-deep-links.md): stethoscope
    // diagnoses this node's health topic. Base derived from our own
    // hostname (relay-health.<site>.<zone> → stethoscope.<site>.<zone>);
    // hidden when underivable (laptop serve) — never a dead link.
    let stetho = "";
    if(location.hostname.startsWith("relay-health.")){
      const base = "https://" + location.hostname.replace(/^relay-health\./, "stethoscope.");
      stetho = ` · <a href="${base}/?topic=${encodeURIComponent("ops/net/health/"+sel)}" target="_blank" rel="noopener">diagnose in stethoscope ↗</a>`;
    }
    crumb.innerHTML = `<a onclick="goFleet()">← node list</a> <span class="note">· ${esc(sel)}</span>${stetho}`;
    $("grid").innerHTML = nodeDetail(sel, data.nodes[sel], now);
  } else {
    crumb.style.display = "none";
    $("grid").innerHTML = names.sort().map(n=>nodeRow(n, data.nodes[n], now)).join("")
      || `<div class="note">no node has published on ops/net/health/** yet — is the collector deployed?</div>`;
  }
  $("foot").textContent = `rollup updated ${ago(Math.max(0,now-(data.generated_unix_ms||0)/1000))} ago · page refresh ${REFRESH_MS/1000}s · amber = undeclared connections present (never silently green)`;
}

async function tick(){
  try{
    const r = await fetch(JSON_URL+"?t="+Date.now(), {cache:"no-store"});
    render(await r.json());
  }catch(e){
    $("fleetPill").className="pill p-red";
    $("fleetPill").textContent="no data";
    $("foot").textContent = "could not load "+JSON_URL+" — is the rollup reader running? ("+e+")";
  }
}
tick(); setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
