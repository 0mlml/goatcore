# goat-fed-republisher — the outbound half of the symmetric publishing rule
# (docs/design/federation-package-spec.md §3.2).
#
# Every party publishes across a peering link under `from/<its own
# sovereign_id>/`. Inbound, that prefix is ENFORCED by the far edge's access
# rules. Outbound, our data is staged under a local `release/…` name that the
# fabric cannot rename in transit — attaching the wire name is
# therefore a small process on our own side, over our own data. Building it
# into the router would mean maintaining a fork.
#
# Own-workspace standalone crate, matching the audit-subscriber /
# fabric-crawler / synth-vendor pattern. zenoh pinned =1.9.0 per
# docs/design/zenoh-version-pinning.md.

[workspace]
resolver = "2"

[profile.release]
# Same rationale as the sibling trial-peer crates: IO-bound service, thin LTO
# halves the image build and buys nothing measurable at runtime.
lto = "thin"
codegen-units = 16

[package]
name = "goat-fed-republisher"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Outbound federation republisher — lifts a declared release set onto the peering wire name from/<sovereign>/."
repository = "https://github.com/usareur-af/goatcore"

[dependencies]
zenoh = { version = "=1.9.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
prometheus = { version = "0.13", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
