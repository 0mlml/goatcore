rule_files:
- ../../../mgmt-host/monitoring/rules/compose-orphans.yml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: compose_service_running{service="traefik",site="fixture",state="exited"}
    values: 0+0x10
  - series: compose_service_running{service="traefik",site="fixture",state="exited",project="mgmt-host"}
    values: 0+0x10
  - series: compose_service_running{service="traefik",site="fixture",state="exited",project="retired"}
    values: 0+0x10
  promql_expr_test:
  - expr: ALERTS{alertname="ComposeServiceNotRunning",alertstate="firing"}
    eval_time: 6m
    exp_samples:
    - labels: ALERTS{alertname="ComposeServiceNotRunning",alertstate="firing",component="compose",severity="warning",service="traefik",site="fixture",state="exited"}
      value: 1
    - labels: ALERTS{alertname="ComposeServiceNotRunning",alertstate="firing",component="compose",severity="warning",service="traefik",site="fixture",state="exited",project="mgmt-host"}
      value: 1
- interval: 1m
  input_series:
  - series: compose_service_running{service="traefik",site="fixture",state="exited"}
    values: 0+0x10
  - series: compose_service_running{service="traefik",site="fixture",state="exited",project="mgmt-host"}
    values: 0+0x10
  - series: compose_service_running{service="traefik",site="fixture",state="exited",project="retired"}
    values: 0+0x10
  promql_expr_test:
  - expr: ALERTS{alertname="ComposeCriticalServiceNotRunning",alertstate="firing"}
    eval_time: 6m
    exp_samples:
    - labels: ALERTS{alertname="ComposeCriticalServiceNotRunning",alertstate="firing",component="compose",severity="critical",service="traefik",site="fixture",state="exited"}
      value: 1
    - labels: ALERTS{alertname="ComposeCriticalServiceNotRunning",alertstate="firing",component="compose",severity="critical",service="traefik",site="fixture",state="exited",project="mgmt-host"}
      value: 1
