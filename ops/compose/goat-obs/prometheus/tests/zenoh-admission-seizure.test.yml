  - series: goat_zenoh_open_ms{router="a"}
    values: 12019x8
  - series: goat_zenoh_close_wait{router="a"}
    values: 146x8
  - series: goat_zenoh_open_probe_status{router="a",reason="tls_error"}
    values: 1x8
  alert_rule_test:
  - eval_time: 6m
    alertname: ZenohRouterAdmissionSeizure
    exp_alerts:
    - exp_labels:
        severity: critical
        component: zenoh-router
        router: a
      exp_annotations: *id001
