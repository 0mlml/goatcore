# The dead-man's switch for the single-host observability stack (obs.yml:
# Prometheus co-resident on the mgmt host, has_obs_host: false). The obs-host
# role carries the same rule in base-alerts.rules.yml.j2; this file is its
# counterpart for goatnets with no obs host, which loaded neither (#2116).
#
# The alert fires unconditionally for as long as Prometheus is alive. Its
# ARRIVAL at an external receiver (deadman_webhook_url, routed first in
# roles/observability/templates/alertmanager.yml.j2) is the heartbeat; its
# ABSENCE there is the alarm. Without a receiver it fires into webhook-noop and
# the acceptance row deadman-switch-has-external-receiver reports that.
groups:
  - name: deadman
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          deadman: "true"
        annotations:
          summary: "Alerting pipeline heartbeat"
          description: "This alert always fires. It exists so an external watcher can detect the alerting pipeline going silent — if you are reading this in a UI, that is normal and expected. If it STOPS arriving at the external receiver, Prometheus or Alertmanager is down and no other alert can reach you."
