# Auto-load dashboards from /var/lib/grafana/dashboards on Grafana
# boot. Dashboards are bind-mounted read-only — edits in the UI are
# allowed (`allowUiUpdates: true`) but won't persist past container
# restart; commit JSON to the repo to make changes durable.

apiVersion: 1

providers:
  - name: goat-obs
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
