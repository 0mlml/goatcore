# Auto-provisioned Alertmanager datasource for the goat-obs Grafana.
# Surfaces the on-bus alert state (relay-disk paging, host rules, etc.) inside
# the EXISTING Ory-gated Grafana mesh page (grafana.<site_id>.<zone>), so
# operators can view + silence alerts without standing up a second oauth2-proxy
# gate for the native Alertmanager UI (which binds loopback-only). Same `mgmt`
# docker network, reached by compose service name.
apiVersion: 1
datasources:
  - name: Alertmanager
    uid: goat-obs-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    version: 1
    editable: false
