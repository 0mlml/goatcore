# Auto-provisioned Prometheus datasource for nova-obs Grafana.
# Reachable over the shared `mgmt` docker network.

apiVersion: 1

# Drop any datasource named "Prometheus" before recreating below.
# Grafana provisioning won't change the uid of an EXISTING matching
# datasource (the auto-uid is sticky from first-create), so a fresh
# install lands the wrong uid and every committed dashboard panel
# fails with "Datasource prometheus was not found". The delete →
# recreate cycle lets provisioning pin the uid the dashboards
# expect. Idempotent: if no datasource exists, the delete is a no-op.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # uid is referenced by the bundled dashboard JSON
    # (ops/compose/goat-obs/grafana/dashboards/*.json → panels[].datasource.uid).
    # Pin it explicitly so the panels resolve against this provisioned
    # datasource — without an explicit uid Grafana assigns one based
    # on the datasource name's hash, which won't match what the
    # committed dashboard JSON expects, surfacing as "No data" on
    # every panel.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "30s"
      httpMethod: POST
