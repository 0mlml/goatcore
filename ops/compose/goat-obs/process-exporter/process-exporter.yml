# process-exporter config — nova-obs (Block 82B).
#
# Each process_names rule defines how processes are aggregated into a
# named group. The rule with the FIRST match wins; processes that
# don't match any rule are ignored. Group name is the time-series
# label `groupname`.
#
# Strategy: group by the executable basename (`{{.Comm}}`) so
# /usr/bin/postgres → "postgres", /usr/lib/grafana/grafana → "grafana",
# etc. Coarse-but-useful default. Add specific cmdline-based rules
# below if a group needs splitting (e.g. one binary running many
# distinct workloads).

process_names:
  # 1. Catch-all: every running process named anything other than the
  #    kernel + tiny helpers. `{{.Comm}}` is the basename from
  #    /proc/<pid>/comm (truncated to 15 chars by the kernel).
  - name: "{{.Comm}}"
    cmdline:
      - '.+'
