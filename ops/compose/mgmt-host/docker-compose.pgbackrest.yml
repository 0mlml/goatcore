# pgBackRest overlay for the mgmt-host stack.
#
# Phase 2 MVP for the region A production PoC. Adds a dedicated sidecar
# container ("pgbackrest-runner") that shares the postgres-a pgdata
# volume (read-only) + a host bind for the local repo + the pgbackrest
# config. Scheduled full/diff/incr backups run via host cron — cron
# invokes `docker exec pgbackrest-runner pgbackrest ...`, which is why
# the container restarts `unless-stopped` with a long-running tail
# entrypoint (so it's always ready to receive exec calls).
#
# WAL archive_command runs INSIDE postgres-a, not in the sidecar. For
# that, the pgbackrest binary is baked into the postgres-spock image
# (see ops/postgres/spock/Dockerfile). The Ansible role ships a
# dnf-install fallback gated on `command -v pgbackrest` — a no-op when
# the image includes the binary (default since 2026-04-22). The sidecar
# handles scheduled backup commands (which need nothing inside postgres-a
# beyond its running PG socket + the binary for integrity-check trips).
#
# Why the sidecar at all?
#   - Versioned separately from pgedge-postgres-spock. pgBackRest
#     releases a couple of times a year; we don't want a pgbackrest
#     bump to force a postgres image rebuild.
#   - Clean place to run the scheduled backup commands (no host-level
#     pgbackrest install required; the host just has `docker` +
#     `crontab`).
#   - Easy to swap for a different backup tool later without touching
#     postgres-a.
#
# Composes on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.pgbackrest.yml up -d
#
# Environment inputs (rendered into .env by the pgbackrest Ansible role):
#   SITE_NAME                         — stanza prefix (vega-a, wb-a, ...)
#   PGBACKREST_IMAGE                  — pgbackrest/pgbackrest container tag
#
# Host bind mounts (created by the Ansible role):
#   /etc/pgbackrest/pgbackrest.conf   — rendered config (0640, root:root)
#   /opt/docker-data/pgbackrest       — repo1 local backup storage
#   /var/log/pgbackrest               — pgBackRest log output
#   /var/spool/pgbackrest             — async WAL archive spool dir

services:

  pgbackrest-runner:
    # Pin a specific pgbackrest release — upgrading is a deliberate act
    # (breaks restore symmetry if the repo was written by a much newer
    # version than a future restore sidecar). Override via .env.
    #
    # NOTE: the upstream pgBackRest project does NOT publish a runtime
    # container image (only test/build images). `woblerr/pgbackrest` is
    # the active community runtime image and matches upstream version
    # tags. The Ansible role's pgbackrest_image default carries the same
    # ref; bump them together. Index digest captured 2026-04-27.
    image: ${PGBACKREST_IMAGE:-woblerr/pgbackrest:2.53.1@sha256:6e79a47273146cdb4a4a60c7736664697c473aad25689c815071248a633ba622}
    container_name: pgbackrest-runner
    restart: unless-stopped
    # Long-running idle — host cron does `docker exec` into this container
    # to invoke pgbackrest. The official image's default entrypoint exits
    # after running one command, so we override with a keep-alive loop.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "pgbackrest-runner: ready. cron will docker exec pgbackrest here."
        # Sleep forever; kill -TERM exits cleanly.
        exec sleep infinity
    depends_on:
      postgres-a:
        condition: service_healthy
    environment:
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in .env}
    volumes:
      # Config — bind-mounted from the host so the Ansible role can
      # re-render without a container rebuild.
      - /etc/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

      # repo1: local backup storage on the mgmt-host NVMe. Must be
      # writable by the sidecar (that's who creates backups). The
      # postgres-a container writes here too (archive-push), but via
      # its own in-container pgbackrest binary; both containers mount
      # the same host path.
      - /opt/docker-data/pgbackrest:/var/lib/pgbackrest

      # Log + spool — shared with postgres-a for async archive pipeline
      # continuity. If the sidecar is down when postgres wants to push,
      # WAL segments queue in the spool dir until the sidecar (or a
      # scheduled `archive-push --async` drain) picks them up.
      - /var/log/pgbackrest:/var/log/pgbackrest
      - /var/spool/pgbackrest:/var/spool/pgbackrest

      # PGDATA — read-only is fine for backup operations (pgBackRest
      # reads the cluster, it doesn't modify it). For RESTORE the
      # sidecar is NOT used; restore is run as a one-shot `docker run`
      # per docs/design/pgbackrest.md §7.1 (different command, mounts
      # PGDATA writable).
      - pgdata-a:/var/lib/pgsql/16/data:ro
    networks:
      - mgmt

# pgdata-a is declared in the base docker-compose.yml. Re-declare it here
# as `external: false` so compose resolves the correct named volume when
# this overlay is loaded alongside the base file. Docker compose will
# merge the two declarations; listing it is defensive against an operator
# running this overlay alone by mistake.
volumes:
  pgdata-a:

networks:
  mgmt:
    name: mgmt
