# Compose overlay — mesh front for the cloud compliance dashboard (Stage 2).
#
# Two sidecars on the `mgmt` network:
#   oauth2-proxy-compliance : OIDC login vs site Hydra, gates the COMPLIANCE
#                             group (ADR 1029); upstream = the sigv4 proxy.
#   aws-sigv4-proxy-compliance : SigV4-signs each request with a scoped
#                             lambda:InvokeFunctionUrl credential and forwards
#                             to the AWS_IAM-locked Function URL.
#
# Request path on the mesh:
#   Traefik (compliance.<site>.<zone>, mesh-only middleware, le cert)
#     -> oauth2-proxy-compliance:4180   (Dex/Hydra login + COMPLIANCE group)
#     -> aws-sigv4-proxy-compliance:8080 (SigV4)
#     -> <Function URL>                 (locked AWS_IAM, only this cred invokes)
#     -> compliance dashboard Lambda
#
# Deploy via compliance-proxy-deploy.yml. Shelf-ready: requires the
# usareur-af-infra env at Stage 2 (enable_function_url=true) so the Function
# URL exists + grants this proxy's invoke credential.
services:
  oauth2-proxy-compliance:
    image: "${OAUTH2_PROXY_COMPLIANCE_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.6.0@sha256:dcb6ff8dd21bf3058f6a22c6fa385fa5b897a9cd3914c88a2cc2bb0a85f8065d}"
    container_name: oauth2-proxy-compliance
    restart: unless-stopped
    env_file:
      - /opt/mgmt-host/oauth2-proxy-compliance.env
    # Resolve the public OIDC issuer hostname to the mgmt-host mesh IP
    # (F-126 pattern; the container's embedded resolver can't reach mesh
    # CoreDNS on :5353).
    extra_hosts:
      - "${OAUTH2_PROXY_COMPLIANCE_OIDC_HOST_ENTRY:-oauth2.invalid:127.0.0.1}"
    networks:
      - mgmt
    depends_on:
      - aws-sigv4-proxy-compliance
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  aws-sigv4-proxy-compliance:
    image: "${AWS_SIGV4_PROXY_IMAGE:-public.ecr.aws/aws-observability/aws-sigv4-proxy:latest@sha256:34bbec3cb98403d3e040ec1dadb53bb02285f70d2f0ead2d16435fd30980abaa}"
    container_name: aws-sigv4-proxy-compliance
    restart: unless-stopped
    # --name lambda + --host <function-url-host> so the proxy signs for the
    # Lambda Function URL service. Region + host come from the env file.
    command:
      - "--name=lambda"
      - "--region=${COMPLIANCE_FUNCTION_URL_REGION}"
      - "--host=${COMPLIANCE_FUNCTION_URL_HOST}"
      # Strip Accept-Encoding so the dashboard Lambda returns UNCOMPRESSED HTML.
      # The Lambda gzips (Content-Encoding: gzip) when the request asks for it,
      # but the proxy chain drops the Content-Encoding response header, so the
      # browser renders raw gzip bytes. Stripping Accept-Encoding upstream =
      # plain HTML that renders.
      - "--strip=Accept-Encoding"
    environment:
      # Scoped invoke credential (lambda:InvokeFunctionUrl on the dashboard
      # Function URL). The matching principal is granted on the usareur-af-infra
      # side via function_url_invoke_principal_arns.
      AWS_ACCESS_KEY_ID: "${COMPLIANCE_INVOKE_AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${COMPLIANCE_INVOKE_AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${COMPLIANCE_FUNCTION_URL_REGION}"
    networks:
      - mgmt
    labels:
      - "traefik.enable=false"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  mgmt:
    external: true
