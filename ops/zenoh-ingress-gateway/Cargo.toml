# Own-workspace, matching the audit-subscriber + synth-vendor + panoscope crate pattern:
# a standalone crate vendored under ops/ that is NOT a member of the monorepo's
# goat-relay workspace. The zenoh crate is pinned at this single surface (client mode),
# so the F-122 multi-surface plugin-ABI coupling tax does not apply.
[workspace]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1

[package]
name = "zenoh-ingress-gateway"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "goat-side ingress gateway for Tier-2 (non-goat<->goat) Zenoh peered ingress (ADR 1020)"

[dependencies]
# Fleet-wide zenoh pin per docs/design/zenoh-version-pinning.md; matches the
# audit-subscriber client crate. Single-surface pin (client mode), no plugin ABI tax.
zenoh = { version = "=1.9.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
