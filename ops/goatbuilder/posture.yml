# The secrets posture this project declares (ADR 1204), read by
# ops/goatbuilder/gen-config.py into goatbuilder.yaml's `secrets:` block.
#
# A fork or another organisation edits this one file. Delete it and the
# generated config declares `store: env-file`, which needs no account of
# anyone's: `goatbuilder secrets init --env <goatnet>` writes that file with
# strong random values.
#
#   store: 1password | openbao | custom | sops | git-crypt | env-file | env
#
# op_account pins the account `op://` references resolve against, so `op` can
# never prompt across every configured account (ADR 1186). OP_ACCOUNT in the
# environment overrides it per command, as GOAT_SECRET_STORE overrides the store.
store: 1password
op_account: example.1password.com
