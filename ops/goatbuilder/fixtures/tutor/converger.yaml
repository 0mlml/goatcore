# How each machine behaves under the scripted converger (the vocabulary is in
# ../basic/converger.yaml). dev misbehaves on purpose; preprod converges.
machines:
  dev:
    dev-core-a: converge-now
    dev-core-b: converge-now
    dev-obs-a: { after: 2 }
    dev-obs-b: never
    dev-edge-a: unreadable
  preprod:
    preprod-core-a: converge-now
    preprod-core-b: converge-now
