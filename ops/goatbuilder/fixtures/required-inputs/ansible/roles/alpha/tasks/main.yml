---
- name: alpha needs its inputs
  ansible.builtin.assert:
    that:
      - alpha_zone | length > 0
      - alpha_token is defined and (alpha_token | length) >= 16
      - alpha_port | int > 0
- name: alpha reads its owner
  ansible.builtin.debug:
    msg: "{{ alpha_owner | mandatory }}"
- name: alpha optional piece
  ansible.builtin.include_tasks: optional.yml
  when: alpha_optional | default(false) | bool
- name: alpha templates its secret
  ansible.builtin.debug:
    msg: "{{ alpha_secret_env | length }}"
