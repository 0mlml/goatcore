---
# ops/pins/lite-pins.yaml — the lite sidecar of the fleet pin table.
#
# A goatlite goatnet (ADR 1213, docs/design/goatlite.md) is declared HERE, never
# in fleet-pins.yaml. ops/pins/generate-pins.py and `goatbuilder pins` read both
# files and work on ONE merged table: goatnets are unioned (a name in both is an
# error) and each component's `deviations:` are unioned by scope (a scope in
# both is an error). Everything downstream — pins.yml, intent.json, --check —
# sees the merged table.
#
# WHY a sidecar: every committed intent carries the sha256 of fleet-pins.yaml in
# its `sources`. A learner rendering a goatlite into their checkout must not
# move that hash, because they cannot re-sign goat's intents. A goatnet declared
# here carries this file's hash as well, in its own intent only.
#
# This file carries two things and refuses everything else:
#   goatnets:                              same shape as fleet-pins.yaml
#     <goatnet>:
#       description: <one line>
#       members: [<group_vars dir>, ...]
#       ca_id_var: <ansible var name>
#   components:                            DEVIATIONS ONLY
#     <component-name>:                    must be a component of fleet-pins.yaml
#       deviations:
#         <goatnet or member>:             declared in THIS file's goatnets:
#           absent: true | value: <ref>
#           reason: <why>
# A `var:`, `fleet:` or any other component key here is refused: component
# definitions live in fleet-pins.yaml.
#
# ops/scripts/goatlite-render.py writes a goatlite's row and deviation blocks
# between `# BEGIN goatlite <name>` / `# END goatlite <name>` markers and
# `--remove` takes them back out; hand content outside the markers is kept.
goatnets: {}
components: {}
