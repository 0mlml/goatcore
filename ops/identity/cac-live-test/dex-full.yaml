# Dex for the full-chain CAC live test (#2). nginx (mTLS, CAC) sets X-Remote-User=EDIPI;
# authproxy issues an OIDC token (EDIPI in preferred_username) to the `kratos` client.
# Kratos federates to this Dex and mints the goat identity via eams-a.jsonnet.
issuer: https://cac-idp:8543
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
connectors:
  - type: authproxy
    id: cac
    name: CAC
    config:
      userHeader: X-Remote-User
staticClients:
  - id: kratos
    secret: kratos-secret
    name: Kratos
    redirectURIs:
      - http://kratos-idp:4433/self-service/methods/oidc/callback/cac
