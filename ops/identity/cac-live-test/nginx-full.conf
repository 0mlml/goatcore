events {}
http {
    map $ssl_client_s_dn $edipi {
        default "";
        "~CN=[^,]*\.(?<e>\d+)" $e;
    }
    server {
        listen 8543 ssl;
        server_name cac-idp;
        ssl_certificate     /certs/proxy.crt;
        ssl_certificate_key /certs/proxy.key;
        ssl_client_certificate /certs/ca.crt;   # the DoD PKI bundle (real) / test CA
        ssl_verify_client optional;
        ssl_verify_depth 4;

        location ~ ^/(auth|callback) {
            if ($ssl_client_verify != SUCCESS) { return 403 "CAC (client cert) required\n"; }
            if ($edipi = "") { return 403 "no EDIPI in client certificate\n"; }
            proxy_pass http://dex:5556;
            proxy_set_header Host $http_host;
            proxy_set_header X-Remote-User $edipi;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://dex:5556;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
