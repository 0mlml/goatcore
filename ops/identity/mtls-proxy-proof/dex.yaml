# Dex — the local OIDC shim for sovereign PKI card sign-in. The nginx mTLS proxy
# authenticates the card and passes X-Remote-User = "<pki>:<identifier>"; Dex's
# authproxy connector turns that into a standard OIDC token (preferred_username)
# that Kratos consumes.
issuer: https://card-proxy:8443
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
connectors:
  - type: authproxy
    id: card
    name: Certificate (smart card)
    config:
      userHeader: X-Remote-User
      emailHeader: X-Remote-Email
staticClients:
  - id: proof
    public: true
    name: Proof
    redirectURIs:
      - http://localhost/cb
  - id: kratos
    secret: kratos-secret
    name: Kratos
    redirectURIs:
      - http://kratos:4433/self-service/methods/oidc/callback/card-local
