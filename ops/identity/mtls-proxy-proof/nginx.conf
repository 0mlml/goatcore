# mtls-proxy-proof nginx — the role's nginx.conf.j2 with the registry rendering
# included from gen/ (run.sh writes it per profile). Keep the server block in step
# with ops/ansible/roles/icam-mtls-proxy/templates/nginx.conf.j2.
load_module modules/ngx_http_js_module.so;
events {}
http {
    js_import pki from /etc/nginx/pki.js;
    include /etc/nginx/gen/pki-js-import.conf;
    include /etc/nginx/gen/pki-js-set.conf;
    include /etc/nginx/gen/pki-maps.conf;

    server {
        listen 8443 ssl;
        server_name card-proxy;

        ssl_certificate     /certs/proxy.crt;
        ssl_certificate_key /certs/proxy.key;

        # mTLS available; the card is REQUIRED only on the human-facing auth paths.
        # The RP back-channel (discovery/token/keys) has no cert, so verify is
        # 'optional' at the server and enforced per-location.
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 3;

        location ~ ^/(auth|callback) {
            if ($ssl_client_verify != SUCCESS) { return 403 "a certificate from an enabled PKI is required\n"; }
            if ($pki_id = "") { return 403 "certificate issuer is not an enabled PKI profile\n"; }
            if ($pki_remote_user = "") { return 403 "certificate carries no identifier for its PKI profile\n"; }
            proxy_pass http://dex:5556;
            proxy_set_header Host $http_host;
            proxy_set_header X-Remote-User  $pki_remote_user;
            proxy_set_header X-Remote-Pki   $pki_id;
            proxy_set_header X-Remote-Email $pki_san_email;
            proxy_set_header X-Forwarded-Proto https;
        }

        # RP back-channel — no card required.
        location / {
            proxy_pass http://dex:5556;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
