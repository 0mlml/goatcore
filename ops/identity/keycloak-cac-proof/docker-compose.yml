# keycloak-cac-proof — prove toggle-switch PATH #3 (keycloak_frontend): a CAC client
# cert (test PKI) authenticates to Keycloak's native X.509 authenticator; Keycloak
# extracts the EDIPI and issues an OIDC token carrying it. That token is exactly what
# Kratos's oidc broker consumes (path-#1-proven) via ops/identity/claim-maps/eams-a.jsonnet.
#
# Run: ./run.sh   (needs docker + curl + jq + the test PKI at ../cac-test-pki/out/)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--https-client-auth=request"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /certs/kc-server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/kc-server.key
      # trust the test DoD CA so client certs validate at the TLS layer
      KC_TRUSTSTORE_PATHS: /certs/ca.crt
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./kc-server.crt:/certs/kc-server.crt:ro
      - ./kc-server.key:/certs/kc-server.key:ro
      - ../cac-test-pki/out/ca.crt:/certs/ca.crt:ro
      - ./realm-goat.json:/opt/keycloak/data/import/realm-goat.json:ro
    ports:
      - "8843:8443"   # https (client-cert)
      - "8480:8080"   # http (admin)
    networks: [cac]

networks:
  cac: {}
