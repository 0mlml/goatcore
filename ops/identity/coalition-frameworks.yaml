# ops/identity/coalition-frameworks.yaml — the coalition / alliance framework
# registry: the nation → affiliation.coalition crosswalk, generalized beyond NATO.
#
# WHY GENERALIZED. goat net is not a NATO-only system. It is deployed in
# different AORs by different users, and each region centralizes on different
# players and dynamics. So the coalition model is FRAMEWORK-DRIVEN: a goatnet
# operates in one AOR with an ACTIVE framework, and a principal's
# affiliation.coalition standing (member vs partner) is resolved against that
# framework's membership — never against a hardcoded "NATO". NATO is simply the
# FIRST framework; adding another (Five Eyes, AUKUS, a regional coalition, an
# interagency construct) is an additive edit here, no code change.
#
# AORs (a framework declares which it belongs to; this list is the intended
# breadth, not a closed machine enum):
#   euro-atlantic · africom · centcom · indopacom · southcom · arctic · # oss-allow: public AOR names
#   homeland · global
#
# STANDING is framework-neutral and closed (grammar affiliation.coalition):
#   member  = the org's nation is a member of the active framework (or a framework
#             body) → eligible for that framework's member release-lane.
#   partner = not a member → bilateral / coalition lanes only.
# Richer standings for other dynamics (SOUTHCOM's partners-who-are-also-rivals,
# interagency gov-mil / law-enforcement participants, associate/observer tiers)
# are a DELIBERATE future extension — added as additive grammar values + framework
# `kind`s when their release dynamics are actually built, never guessed now. See
# docs/design/onboarding-github-repo-grants.md's sibling design + ADR 1077.
#
# LIVING RELATIONSHIPS — NO REBUILD (the differentiator). The external world
# changes: an ally leaves an alliance, a partner accedes, a partner cools toward
# adversary. Rigid FMN-style policy hardcodes these and needs a rebuild when they
# shift. Here a geopolitical change is a DATA EDIT to this file (effective-dated),
# and the network + services keep running in stride — policy resolves current
# state from this registry, never from hardcoded rules:
#   * accession    -> add / set member_since (a nation becomes a member on a date).
#   * withdrawal   -> set member_until (an ally that LEAVES flips to partner from
#                     that date; membership is a RANGE [member_since, member_until)).
#   * partner->member or member->partner over time is just these two dates.
#   * pre-stage a known future change (a future member_since/until) or backdate.
# History is queryable: `generate.py --resolve-coalition <NATION> --as-of <DATE>`
# gives the standing AS OF any date, so audits and "who could see this in March?"
# answer from data, not archaeology. The adversary/exclusion case (a partner that
# becomes hostile) is handled two ways, both data edits: (a) the reserved
# `restricted` standing — an additive grammar value for "no release lanes,"
# landing when its enforcement point is built (G7); (b) the immediate lever today,
# mesh-first credential revocation / offboarding (ADR 1031, reversible) for the
# org's principals. Neither requires a code change or a network rebuild.
#
# PROVENANCE (honesty grade): membership dates below are PUBLIC records, not an
# ingested official government feed — treat a derived standing as `open-source`
# unless operator-verified. Hand-kept; a new member is one additive row.
#
# member fields: { nation, member_since, member_until? (optional — the date the
# nation left the framework), name }.
#
# NOT a gate by itself: affiliation.coalition is the eligibility PREDICATE for the
# reserved data-access coalition/releaseset scopes (ADR 1027/1074) — a release-lane
# grant checks it; nothing here grants or denies on its own.

version: 1

# The framework a goatnet uses when it does not declare its own (the current
# NATO-centric deployments). A goatnet in another AOR sets its active framework at
# standup (instance-variability-model.md); the resolver takes it as a parameter.
default_framework: nato

frameworks:

  nato:
    display_name: North Atlantic Treaty Organization
    kind: alliance                 # alliance | coalition | interagency (future)
    aor: euro-atlantic
    # affiliation.nation values that are members by definition (alliance bodies).
    member_markers: [NATO]
    # 32 members, each `member` from member_since (treaty entry-into-force for the
    # 1949 founders) onward. Ordered by accession.
    members:
      - { nation: BEL, member_since: 1949-08-24, name: Belgium }
      - { nation: CAN, member_since: 1949-08-24, name: Canada }
      - { nation: DNK, member_since: 1949-08-24, name: Denmark }
      - { nation: FRA, member_since: 1949-08-24, name: France }
      - { nation: ISL, member_since: 1949-08-24, name: Iceland }
      - { nation: ITA, member_since: 1949-08-24, name: Italy }
      - { nation: LUX, member_since: 1949-08-24, name: Luxembourg }
      - { nation: NLD, member_since: 1949-08-24, name: Netherlands }
      - { nation: NOR, member_since: 1949-08-24, name: Norway }
      - { nation: PRT, member_since: 1949-08-24, name: Portugal }
      - { nation: GBR, member_since: 1949-08-24, name: United Kingdom } # oss-allow: public ISO or alliance table
      - { nation: USA, member_since: 1949-08-24, name: United States }
      - { nation: GRC, member_since: 1952-02-18, name: Greece }
      - { nation: TUR, member_since: 1952-02-18, name: Türkiye }
      - { nation: DEU, member_since: 1955-05-06, name: Germany }   # West Germany 1955; unified 1990.
      - { nation: ESP, member_since: 1982-05-30, name: Spain }
      - { nation: CZE, member_since: 1999-03-12, name: Czechia }
      - { nation: HUN, member_since: 1999-03-12, name: Hungary }
      - { nation: POL, member_since: 1999-03-12, name: Poland }
      - { nation: BGR, member_since: 2004-03-29, name: Bulgaria }
      - { nation: EST, member_since: 2004-03-29, name: Estonia } # oss-allow: public ISO or alliance table
      - { nation: LVA, member_since: 2004-03-29, name: Latvia } # oss-allow: public NATO member
      - { nation: LTU, member_since: 2004-03-29, name: Lithuania } # oss-allow: public ISO or alliance table
      - { nation: ROU, member_since: 2004-03-29, name: Romania } # oss-allow: public ISO or alliance table
      - { nation: SVK, member_since: 2004-03-29, name: Slovakia }
      - { nation: SVN, member_since: 2004-03-29, name: Slovenia }
      - { nation: ALB, member_since: 2009-04-01, name: Albania }
      - { nation: HRV, member_since: 2009-04-01, name: Croatia }
      - { nation: MNE, member_since: 2017-06-05, name: Montenegro }
      - { nation: MKD, member_since: 2020-03-27, name: North Macedonia }
      - { nation: FIN, member_since: 2023-04-04, name: Finland }
      - { nation: SWE, member_since: 2024-03-07, name: Sweden }

  # --- Extension templates (designed-not-built) ------------------------------
  # Add a framework by copying the shape above. The resolver + validator pick it
  # up with no code change; a goatnet activates it via its per-goatnet active
  # framework. Examples of the breadth this must serve (NOT populated — populate
  # when a real deployment needs one, with verified membership + provenance):
  #
  # five-eyes:
  #   display_name: Five Eyes
  #   kind: coalition
  #   aor: global
  #   members: [ {nation: USA, ...}, {nation: ISL, ...}, {nation: CAN, ...},
  #              {nation: AUS, ...}, {nation: NZL, ...} ]
  #
  # A SOUTHCOM / interagency construct would additionally need new grammar
  # standings (interagency / law-enforcement) and a framework kind: interagency —
  # a deliberate future step, not modeled here.
