# Standalone crate — not part of the root [workspace] (matches ops/flashlight,
# ops/goat-trashgoat). The empty table below declares that to cargo.
[workspace]

[package]
name = "relay-auth-probe"
version = "0.1.0"
edition = "2021"
description = "Live behavioral probe for deployed goat-relay instances: drives the real WS/Auth handshake and asserts accept/reject under each auth case (unbound, peer-bound, impersonation, wrong-secret, garbage). Standalone crate (not a workspace member), per the ops/* tool pattern."

[dependencies]
goat-relay-protocol = { path = "../../goat-relay-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
ring = "0.17"
bytes = "1"
futures-util = "0.3"
