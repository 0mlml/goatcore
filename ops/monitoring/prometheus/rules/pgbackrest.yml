# pgBackRest alert rules — skeleton source of truth.
#
# Implements docs/design/pgbackrest.md §8 "Monitoring + alerting" against
# the per-site paired-stanza design (docs/design/pgbackrest.md §6):
#   - <site>-a-netbird stanza on Router-A
#   - <site>-b-netbird stanza on Router-B
# Each stanza is independent; each host owns its own NVMe-local repo.
#
# Metric source: pgbackrest-exporter sidecar on each mgmt-host
# (https://github.com/woblerr/pgbackrest_exporter). The exporter scrapes
# `pgbackrest info --output=json` periodically and emits standard
# Prometheus metrics (pgbackrest_backup_*, pgbackrest_archive_*).
#
# `site` and `stanza` labels come from external_labels at scrape time
# (per-node SITE_NAME like <site>-a / <site>-b). Mirror this file under
# ops/compose/mgmt-host/monitoring/rules/ when wiring per-site (the
# spock.yml / ntp.yml / signal-server.yml pattern).
#
# Status: skeleton. The exporter sidecar isn't deployed yet — alerts
# fire only once a pgbackrest-exporter scrape job is added to
# prometheus.yml. Closes the docs/design/pgbackrest.md §11 promised
# rules-file artifact (Block 50D doc-hygiene sweep). Keep
# in sync with the design-doc §8 table; drift between the two is a
# code-review-blocking issue.

groups:

  - name: pgbackrest.jobs
    interval: 60s
    rules:

      # Last backup job exit != 0 on either stanza. §8 row 1.
      # pgbackrest_backup_last_full_status / _diff_status / _incr_status
      # are 0 on success, non-zero on failure.
      - alert: PgBackRestJobFailed
        expr: |
          (pgbackrest_backup_last_full_status != 0)
          or (pgbackrest_backup_last_diff_status != 0)
          or (pgbackrest_backup_last_incr_status != 0)
        for: 5m
        labels:
          severity: critical
          component: pgbackrest
        annotations:
          summary: "pgBackRest backup failed on stanza {{ $labels.stanza }} at {{ $labels.site }}"
          description: "Last backup job exited non-zero. Local NVMe repo for this stanza may be full, the postgres-exporter sidecar may be unable to reach the postgres container, or the stanza config has drifted. Run `docker compose exec pgbackrest pgbackrest --stanza={{ $labels.stanza }} info` on the mgmt-host to inspect."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/pgbackrest.md"

      # No successful full backup on a stanza for > 10 d (cadence 7 d
      # + buffer). §8 row 2.
      - alert: PgBackRestBackupOverdue
        expr: |
          time() - pgbackrest_backup_last_full_timestamp_seconds > 10 * 86400
        for: 30m
        labels:
          severity: critical
          component: pgbackrest
        annotations:
          summary: "pgBackRest stanza {{ $labels.stanza }} at {{ $labels.site }} has no full backup in > 10 days"
          description: "Cadence is full every 7 days + diff daily; > 10 d since last full means the systemd timer / cron is silently failing. Check the per-stanza schedule on this host."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/pgbackrest.md"

  - name: pgbackrest.archive
    interval: 30s
    rules:

      # No WAL segment archived by a stanza in > 15 min. §8 row 3.
      # archive-push lag is the early-warning signal that postgres
      # archive_command is wedged.
      - alert: PgBackRestWALArchiveOverdue
        expr: |
          time() - pgbackrest_archive_last_completed_timestamp_seconds > 15 * 60
        for: 5m
        labels:
          severity: critical
          component: pgbackrest
        annotations:
          summary: "pgBackRest stanza {{ $labels.stanza }} at {{ $labels.site }} has not archived a WAL segment in > 15 min"
          description: "Postgres archive_command is failing or wedged. Risk: WAL accumulates in pg_wal until disk fills, then postgres halts. Check `docker logs postgres | grep archive` on the mgmt-host; check NVMe free space at /opt/docker-data/pgbackrest/."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/pgbackrest.md"

  - name: pgbackrest.config
    interval: 5m
    rules:

      # Router-B's archive_mode != 'always' (config drift). §8 row 4.
      # The replica needs archive_mode=always so WAL archiving continues
      # when it's the streaming replica (otherwise B's stanza freezes
      # at last-promotion LSN until VRRP fails over). Source metric:
      # postgres_settings exporter on B.
      - alert: PgBackRestArchiveModeWrong
        expr: |
          pg_settings_archive_mode_always{router_role="B"} == 0
        for: 10m
        labels:
          severity: warning
          component: pgbackrest
        annotations:
          summary: "Router-B at {{ $labels.site }} has archive_mode != 'always'"
          description: "Router-B must run archive_mode=always so its stanza keeps archiving WAL while it's the streaming replica. Drift means B's stanza is silently frozen — recovery from a B-only catastrophe would lose WAL since last promotion. Check ops/postgres/spock/postgresql.conf on Router-B."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/pgbackrest.md"

      # <site>-a-netbird and <site>-b-netbird last-backup timestamps
      # differ by > 2 h (one host's scheduler is failing silently).
      # §8 row 5. Detection-only — LWW Spock keeps DB state in sync,
      # but if one host's backup scheduler is silently failing, the
      # divergence shows up here before the Backup-Overdue alert hits
      # the 10-day threshold.
      - alert: PgBackRestStanzaDiverged
        expr: |
          abs(
            pgbackrest_backup_last_full_timestamp_seconds{router_role="A"}
            - on(site) group_left
            pgbackrest_backup_last_full_timestamp_seconds{router_role="B"}
          ) > 2 * 3600
        for: 30m
        labels:
          severity: warning
          component: pgbackrest
        annotations:
          summary: "pgBackRest stanzas at {{ $labels.site }} have diverged > 2 h between A and B"
          description: "Router-A's last full backup timestamp differs from Router-B's by more than 2 hours. One scheduler is failing silently. Check `docker compose ps pgbackrest` on both hosts and inspect the systemd timer / cron entries."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/design/pgbackrest.md"
