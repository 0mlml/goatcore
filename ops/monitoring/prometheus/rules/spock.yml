# Spock / Postgres alert rules. Implements the replication-lag, WAL,
# and conflict-log thresholds from docs/design/ha-multi-site.md §7.3.
# Metrics sourced from postgres-exporter + a user-defined queries file
# (see ops/monitoring/prometheus/queries/spock.yml — TBD when wired up).
#
# Metric names assumed here are PRODUCED BY a postgres-exporter query
# config. This is a rule-file sketch that will compile once the query
# file lands. Postgres-exporter syntax:
#   https://github.com/prometheus-community/postgres_exporter#custom-queries

groups:

  - name: spock.replication
    interval: 30s
    rules:

      # Replication lag — any subscription lagging > 60s. LWW conflict
      # resolution starts getting ugly past a minute; Spock itself becomes
      # slow to catch up if it falls much further behind.
      - alert: SpockSubscriptionLag
        expr: spock_subscription_lag_seconds > 60
        for: 2m
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock subscription {{ $labels.subscription_name }} at {{ $labels.site }} lagging >60s for 2m"
          description: "Replication replay lag exceeds 60s. Check network path to provider, provider WAL senders, and subscriber apply worker. Sustained lag past a few minutes can cascade into slot-retention issues."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Replication slot WAL retention near the configured ceiling. Default
      # max_slot_wal_keep_size=1GB (per docs/design/ha-multi-site.md §5.3).
      # If a slot-consumer stays offline long enough that retained WAL
      # approaches the ceiling, the slot will be invalidated and the
      # subscriber must rebuild via pg_basebackup.
      - alert: SpockSlotWALNearLimit
        expr: |
          pg_replication_slot_retained_wal_bytes
            / ignoring(slot_name) group_left() on(instance)
              (max_slot_wal_keep_size_bytes) > 0.8
        for: 5m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ $labels.site }} > 80% of max_slot_wal_keep_size"
          description: "Replication slot is retaining WAL and approaching max_slot_wal_keep_size. If it hits the ceiling, Postgres invalidates the slot and the disconnected peer will require a full pg_basebackup + Spock re-subscribe to recover. Investigate why the subscriber isn't consuming — network partition, crashed apply worker, or a schema mismatch stopping replay."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Slot already invalidated. Urgent — rebuild required.
      - alert: SpockSlotInvalidated
        expr: pg_replication_slot_wal_status{wal_status="lost"} == 1
        for: 1m
        labels:
          severity: critical
          component: spock
        annotations:
          summary: "Spock slot {{ $labels.slot_name }} at {{ $labels.site }} INVALIDATED — rebuild required"
          description: "Slot wal_status is 'lost'. The subscriber cannot resume from this slot. Run the slot-rebuild runbook: docker compose stop postgres on the disconnected node; rm -rf pgdata; pg_basebackup from a healthy peer; spock.sub_create with the new base; monitor catchup."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: spock.conflicts
    interval: 30s
    rules:

      # Any conflict logged. §7.4 says LWW conflicts should be near-zero
      # at our write rate; one = human investigation trigger.
      - alert: SpockConflictLogged
        expr: increase(spock_resolutions_total[5m]) > 0
        labels:
          severity: warning
          component: spock
        annotations:
          summary: "Spock conflict(s) logged at {{ $labels.site }} in last 5m"
          description: "New rows in spock.resolutions (needs spock.save_resolutions=on; Spock 5 has no spock.conflict_log). LWW resolved it automatically, but at our single-digit TPS write rate a conflict means two admins simultaneously changed the same row from two sites. Review the conflict contents, confirm LWW picked the correct winner, and consider operational-discipline adjustments (primary-admin designation per docs/design/ha-multi-site.md §7.4)."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: postgres.availability
    interval: 30s
    rules:

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
          component: postgres
        annotations:
          summary: "postgres-exporter at {{ $labels.site }}:{{ $labels.instance }} unreachable for 2m"
          description: "Prometheus cannot scrape postgres-exporter. Either the exporter is down, or postgres itself is down (exporter fails open on a dead DB). Check `docker compose ps postgres postgres-exporter` on the mgmt-host."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

  - name: spock.ory_narrow
    # Block 21G / ADR 1010 D8 — alert on the narrow Ory repset
    # specifically. The generic spock.replication rules above already
    # cover `ory_sub_*` subscriptions via the catch-all label match;
    # this group adds an Ory-specific signal so the Grafana panel can
    # distinguish "an Ory subscription is lagging" from "the netbird
    # subscription is lagging" without chasing subscription names.
    interval: 30s
    rules:

      # Any subscription in the `ory_sub_*` namespace not in `replicating`
      # state. Fires on initial sync (acceptable, will clear) AND on
      # genuine breakage (won't clear without intervention).
      - alert: OryNarrowSubscriptionNotReplicating
        expr: |
          spock_subscription_status_replicating{subscription_name=~"ory_sub_.*"} == 0
        for: 5m
        labels:
          severity: warning
          component: spock
          subsystem: ory
        annotations:
          summary: "Ory narrow-repset subscription {{ $labels.subscription_name }} at {{ $labels.site }} not replicating for 5m"
          description: "Subscription in the ory_sub_* namespace has status != 'replicating' for 5 minutes. Identity-row changes at the provider site are NOT propagating; cross-site authentication using rows newer than the lag window will fail at this subscriber. Investigate per the post-partition convergence runbook. Possible causes: provider postgres down, network partition, replication slot invalidated (see SpockSlotInvalidated above)."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"

      # Ory-specific lag bound. Tighter than the generic SpockSubscriptionLag
      # because identity-row freshness matters operationally for cross-site
      # login. 60s is the conservative cut; identity-row writes are
      # human-action cadence (login, recover, settings change), so > 60s
      # lag means an operator may see "user not found" at a peer site
      # immediately after registering at this one.
      - alert: OryNarrowSubscriptionLag
        expr: |
          spock_subscription_lag_seconds{subscription_name=~"ory_sub_.*"} > 60
        for: 2m
        labels:
          severity: warning
          component: spock
          subsystem: ory
        annotations:
          summary: "Ory narrow-repset subscription {{ $labels.subscription_name }} at {{ $labels.site }} lag > 60s for 2m"
          description: "Identity-row replication lag exceeds 60s on this subscription. Operators registering at one site will see 'user not found' at peers until the lag clears. Same investigation path as SpockSubscriptionLag but the user-visible impact is more immediate."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/post-partition-convergence-runbook.md"
