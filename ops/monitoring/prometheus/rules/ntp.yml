# NTP hygiene alert rules — skeleton source of truth.
#
# Companion to ops/compose/mgmt-host/monitoring/rules/ntp.yml. The
# vega-site copy is loaded by the Prometheus container on each mgmt-host;
# this file is the canonical skeleton — keep them in lockstep.
#
# Metrics are emitted by github.com/SuperQ/chrony_exporter
# (pinned to v0.13.3 in ops/ansible/roles/ntp-hygiene/defaults/main.yml).
#
# Implements docs/design/mgmt-plane-threat-mitigations.md §1.1 (N1-N5)
# and docs/design/universal-ntp-hygiene.md — the five alerts specified
# for the region A-ship MVP (debt items 18 + 22, v1).

groups:

  - name: ntp.correctness
    interval: 30s
    rules:

      - alert: ChronyClockOffsetHigh
        expr: abs(chrony_tracking_last_offset_seconds) > 0.5
        for: 2m
        labels:
          severity: warning
          component: chrony
        annotations:
          summary: "chrony at {{ $labels.site }}:{{ $labels.instance }} offset >500ms for 2m"
          description: "Last offset exceeds 500ms for 2 minutes. LWW conflict resolution across sites is no longer safe at this skew. Investigate local NTS source health (chronyc sources -v) and network path to NTS servers."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/ntp-runbook.md"

      # Proxy for NTS authentication failure: client-side NTS-KE
      # failures are not surfaced as a distinct metric by
      # chrony_exporter v0.13. Sustained unreachability is the best
      # available signal. Replace with a direct metric when
      # ntp-health-agent v1 lands (debt item 22).
      - alert: ChronyNtsSourceUnreachable
        expr: |
          max by (site, source_name, source_address) (
            chrony_sources_state_info{source_state=~"(?i)unreachable|not.?reachable"}
          ) > 0
        for: 5m
        labels:
          severity: warning
          component: chrony
        annotations:
          summary: "chrony source {{ $labels.source_name }} unreachable at {{ $labels.site }} for 5m"
          description: "NTS source {{ $labels.source_name }} ({{ $labels.source_address }}) has been unreachable for >5 minutes. Either NTS key-exchange is failing or UDP reachability to the source is blocked."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/ntp-runbook.md"

      - alert: ChronyDaemonDown
        expr: |
          up{job="chrony"} == 0
          or absent(chrony_tracking_last_offset_seconds)
        for: 2m
        labels:
          severity: critical
          component: chrony
        annotations:
          summary: "chrony daemon appears down at {{ $labels.site }}:{{ $labels.instance }} for 2m"
          description: "Either chrony_exporter is unscrape-able, or chronyd itself isn't producing tracking data. LWW correctness is at risk — drift will start accumulating immediately."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/ntp-runbook.md"

      - alert: ChronyNoReachableSource
        expr: |
          sum by (site, instance) (chrony_sources_reachability_success) == 0
        for: 5m
        labels:
          severity: critical
          component: chrony
        annotations:
          summary: "chrony at {{ $labels.site }}:{{ $labels.instance }} has NO reachable source for 5m"
          description: "Zero NTS sources reachable for >5 minutes. Host clock is free-running. Restore at least one NTS source."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/ntp-runbook.md"

      - alert: ChronyDriftRateHigh
        expr: abs(chrony_tracking_frequency_ppms) > 50
        for: 10m
        labels:
          severity: warning
          component: chrony
        annotations:
          summary: "chrony at {{ $labels.site }}:{{ $labels.instance }} drifting >50 ppm for 10m"
          description: "Hardware clock drift rate exceeds 50 ppm for 10m. Investigate hypervisor clock-steering (cloud VM) or hardware oscillator (Orin) before shipping."
          runbook_url: "https://github.com/usareur-af/goatcore/blob/main/docs/operations/ntp-runbook.md"
