# cbindgen config for grant-crypto-capi. Regenerate the committed header with:
#   cd ops/grant-crypto/sdk/capi && cbindgen --config cbindgen.toml --crate grant-crypto-capi --output include/grant_crypto.h
# The header is reviewed as source and regenerated by CI to gate drift.
language = "C"
header = "/* grant-crypto C ABI — GENERATED by cbindgen; do not edit by hand. ADR 1106. */"
include_guard = "GRANT_CRYPTO_H"
tab_width = 4
style = "type"
cpp_compat = true
no_includes = false

[export]
prefix = ""

[defines]

[enum]
prefix_with_name = false
