# grant-crypto-capi — the Tier-1 C ABI (ADR 1106), the single audited FFI seam.
# Opaque u64 handles into a process-global, generation-tagged registry; key
# material NEVER crosses the boundary as bytes (only handles), plaintext crosses
# via gc_buf. cdylib + staticlib for the bindings; rlib so the in-crate Rust ABI
# tests can link the extern "C" fns directly. The header at include/grant_crypto.h
# is cbindgen-generated and committed (reviewed as source; regenerated in CI).
[package]
name = "grant-crypto-capi"
version = "0.1.0"
edition = "2021"
# Match the core's patched RustCrypto toolchain minimum.
rust-version = "1.88"
description = "Versioned, opaque-handle C ABI for the grant-crypto SDK (ADR 1106)"
license = "Apache-2.0"
publish = false

[lib]
name = "grant_crypto_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# version alongside path so cargo-deny's wildcard ban is satisfied (the root
# deny.toml policy); must track core's version — they ship in lockstep anyway.
grant-crypto = { path = "../core", version = "0.1.0" }
zeroize = "1"
serde_json = "1"

[dev-dependencies]
# The ABI tests build real signed bundles + identity scalars with the same P-256
# stack the core uses (no path-dep — crates.io, matching core's pins).
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
