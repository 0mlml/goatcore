# grant-crypto SDK workspace (ADR 1106) — the canonical Rust core behind a
# hand-authored, versioned C ABI. Two members, both dependency-light and CI-fast:
#   - core: the `grant-crypto` crypto reference (RustCrypto-only, conformance-vector
#           gated) — read/write of the WIRE-FORMAT envelope + bundle.
#   - capi: `grant-crypto-capi`, the audited FFI seam (cdylib + staticlib + rlib)
#           the Go/Python/TS bindings link against.
#
# Split-readiness invariant (ADR 1106 open-item 3): NO cargo path-dep points
# outside this subtree, so the later move to a `usareur-af` sibling repo is a
# directory move, not a refactor. The `grant-keyd` service (../keyd) consumes the
# core from OUTSIDE and is deliberately NOT a member here — its heavy zenoh tree
# never enters the fast SDK build. The shared conformance vectors live at
# ../envelope/testdata/vectors and travel WITH the SDK at split time.
[workspace]
members = ["core", "capi"]
resolver = "2"
