# grant-crypto Python binding (ADR 1106, Phase 2). A thin, hand-written ctypes
# wrapper over the audited C ABI — zero runtime pip dependencies (stdlib only).
# The version tracks the single SDK release tag shared across all bindings.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grant-crypto"
version = "0.1.0"
description = "Endpoint forward-secrecy for the goat data fabric — Python binding over the grant-crypto C ABI (ADR 1106)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
keywords = ["grant-crypto", "forward-secrecy", "goat", "zenoh"]
dependencies = []

[project.optional-dependencies]
# Nothing extra is needed to run the tests — they use stdlib unittest.
test = []

[tool.hatch.build.targets.wheel]
packages = ["grant_crypto"]
