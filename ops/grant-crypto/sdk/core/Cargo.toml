# Rust production reference for grant-keyed encryption (data-access M2, decision
# §7.9) and the canonical grant-crypto SDK core (ADR 1106). Read side first:
# parse + verify + unwrap + open, validated against the language-neutral
# conformance vectors the Go reference produces (../../envelope/testdata/vectors).
# A member of the `sdk/` workspace (../Cargo.toml) alongside the `grant-crypto-capi`
# C-ABI crate; the `grant-keyd` service consumes it from outside the subtree.
[package]
name = "grant-crypto"
version = "0.1.0"
edition = "2021"
# The patched RustCrypto dependency graph requires Rust 1.88.
rust-version = "1.88"
description = "Rust production reference for grant-keyed payload encryption (read side); conforms to ../../WIRE-FORMAT.md"
license = "Apache-2.0"
publish = false

[dependencies]
aes-gcm = "0.10"
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# v2 post-quantum hybrid KEM (suite v2-x25519-mlkem768): the X-Wing construction
# (draft-connolly-cfrg-xwing-kem) — the reviewed hybrid-KEM standard — implemented
# directly over ML-KEM-768 + X25519 with X-Wing's fixed SHA3-256 combiner. (The
# `x-wing` crate requires rand_core 0.10, which conflicts with the aes-gcm/p256
# stack here on rand_core 0.6; swap to it once that settles — construction is
# byte-identical.)
ml-kem = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
# Best-effort key-material hygiene (Phase-1, ADR 1106; ceiling stated in
# grant-crypto-sdk.md): volatile-write + fences on drop for held DEKs and local
# KEK/DEK intermediates. `derive` pulls the ZeroizeOnDrop macro. Honest ceiling —
# by-value returns, Vec/String realloc, and the AES key schedule remain uncovered.
zeroize = { version = "1", features = ["derive"] }
