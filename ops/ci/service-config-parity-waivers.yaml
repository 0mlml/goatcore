# Declared exceptions to check-service-config-parity.py.
#
# A waiver says: "this goatnet runs the service, another goatnet declares this
# key, and omitting it here is DELIBERATE." Every waiver carries a reason — an
# undeclared exception is indistinguishable from the oversight the check exists
# to catch.
#
# THIS FILE IS A RATCHET, not an amnesty. Everything below is the state of the
# fleet on the day the check was written: pre-existing gaps, NONE of them
# triaged, each one a capability that one goatnet decided and another inherited
# by silence. They are waived so the gate can go green on NEW gaps immediately
# rather than waiting for a bulk cleanup. The list may only SHRINK — same
# discipline as ops/pins/unmigrated-pins.txt.
#
# Ratchet: this list may only shrink. Rank by shape: every SECURITY-shaped row
# (a fence that defaults off, an empty middleware list, an identity layer that
# silently turns off) outranks a hostname or a textfile path. Triage the
# remaining rows the same way — fail-open first, cosmetics last.
#
# To retire a row: declare the key for that goatnet, or replace the reason with
# a real one saying why that environment genuinely does not want the capability.

waivers: {}
