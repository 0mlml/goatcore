# goat — PostgreSQL 16 host-based authentication
# Mounted into the Postgres container.

# TYPE  DATABASE        USER            ADDRESS         METHOD

# Local connections (Unix socket)
local   all             all                             trust

# Loopback (container-internal)
host    all             all             127.0.0.1/32    scram-sha-256
host    all             all             ::1/128         scram-sha-256

# Docker networks (Netbird containers on the same host)
host    all             all             172.16.0.0/12   scram-sha-256

# Replication — local standby (Router-B on same LAN)
# Update these CIDRs to match your site's LAN and overlay IPs.
host    replication     replicator      10.47.0.0/24    scram-sha-256
host    replication     replicator      192.168.1.0/24  scram-sha-256

# Replication — cloud standby (over Netbird overlay)
host    replication     replicator      100.64.0.0/10   scram-sha-256
