# goat — PostgreSQL 16 custom config
# Mounted into the Postgres container alongside the default config.
# Only settings that differ from defaults are listed here.

# -- Replication (HA failover) --
wal_level = replica
max_wal_senders = 5
wal_keep_size = 256MB

# synchronous_standby_names and synchronous_commit are set when
# the local standby (Router-B) is online. Not enabled by default
# because there is no standby yet on a fresh single-node deploy.
# To enable after Router-B is streaming:
#   synchronous_standby_names = 'local_standby'
#   synchronous_commit = remote_write

# -- Connection limits --
max_connections = 100
listen_addresses = '*'
