# aggregator.example.yaml — the CF-7 cross-goatnet aggregator config
# (docs/design/consistency-foundation.md §7.8, ADR 1110 D5).
#
# Copy to aggregator.local.yaml (gitignored) beside this file, drop the
# per-goatnet client certs under certs/<goatnet>/ (gitignored), open the
# env-door forwards named in serve.sh, then run serve.sh.
#
# One entry per goatnet the aggregator LISTENS to. Separate fabrics, separate
# CAs, one mTLS session each. Relative paths resolve against THIS file.
# Nothing here grants the aggregator anything: the cert subject is the same
# subscribe-only console subject each goatnet already ACLs, and the page is
# read-only — it may render, it may not decide.
goatnets:
  - name: zagros
    # The ops/consistency/health/<site> scope this goatnet's rollup publishes on.
    site: zagros-sandbox
    # Laptop-local env-door forward of the router's :7447 — see serve.sh
    # header for the exact ssh -L command.
    endpoint: tls/127.0.0.1:17447
    intent_file: ../intent/zagros/intent.json
    pubkey_dir: ../../enrollment/public-keys
    # Leaf signed by the goatnet's zenoh CA — the subscribe-only console subject
    # (CN=goat-consistency-console-trial-peer), ACL'd on its routers.
    # Files are operator-local, never committed.
    cert: certs/zagros/leaf-cert.pem
    key: certs/zagros/leaf-key.pem
    root_ca: certs/zagros/ca-root-cert.pem

  - name: zagros-prod
    # The rollup publishes on ops/consistency/health/<site>.
    site: zagros-prod
    endpoint: tls/127.0.0.1:27447
    intent_file: ../intent/zagros_prod/intent.json
    pubkey_dir: ../../enrollment/public-keys
    # Leaf signed by this goatnet's zenoh CA — the same console subject its own
    # router ACLs for the deployed console.
    cert: certs/zagros-prod/leaf-cert.pem
    key: certs/zagros-prod/leaf-key.pem
    root_ca: certs/zagros-prod/ca-root-cert.pem
