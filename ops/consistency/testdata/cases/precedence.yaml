---
# Worst-wins. The order under test is the one ops/consistency/grammar.yaml
# declares: unreadable > indeterminate > unaccountable > SKEW > declared > match.
#
# The two ungrounded states outrank everything on purpose. A row that contains
# one value nobody could read and five that agree is NOT a match — reporting it
# as one is the false green the whole surface exists to prevent.

- name: empty-is-indeterminate
  why_this_case: >-
    A scope with nothing in it has not been observed. ADR 1109 P15's most-copied
    line: a node that has not reported is never compliant, and a reading with no
    inputs is not a green reading.
  grades: []
  expect: indeterminate

- name: single-grade-is-itself
  why_this_case: Collapsing one grade must be the identity, or nothing below holds.
  grades: [match]
  expect: match

- name: all-match
  why_this_case: The ordinary green row.
  grades: [match, match, match]
  expect: match

- name: declared-beats-match
  why_this_case: >-
    A row where one column is a declared deviation is `declared`, not `match` —
    the deviation is carried as a badge rather than hidden.
  grades: [match, declared]
  expect: declared

- name: skew-beats-declared
  why_this_case: >-
    One undeclared difference makes the row a finding even when another column's
    difference is declared. Declaring some of a row does not declare it.
  grades: [declared, SKEW, match]
  expect: SKEW

- name: unaccountable-beats-skew
  why_this_case: >-
    A node running something no generation explains outranks a node that is
    merely behind. Folding them together would make the most interesting row in
    the matrix indistinguishable from the most boring one.
  grades: [SKEW, unaccountable]
  expect: unaccountable

- name: indeterminate-beats-unaccountable
  why_this_case: >-
    Ungrounded outranks grounded-and-bad. A scope where something did not report
    cannot be graded red on the strength of what did.
  grades: [unaccountable, indeterminate]
  expect: indeterminate

- name: unreadable-beats-indeterminate
  why_this_case: >-
    `unreadable` and `indeterminate` are kept apart deliberately — read it and
    could not evaluate it, versus there was nothing to read — and the first
    outranks the second so a missing key cannot hide behind a templating excuse.
  grades: [indeterminate, unreadable]
  expect: unreadable

- name: unreadable-beats-everything
  why_this_case: The full ladder, collapsed in one step.
  grades: [match, declared, SKEW, unaccountable, indeterminate, unreadable]
  expect: unreadable
