[package]
name = "goat-consistency"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The consistency grading grammar, executed in Rust. The SECOND of the two implementations ADR 1110 D2 requires; the grammar itself is data (ops/consistency/grammar.yaml) and neither implementation may define a grade."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
# CF-5 verify-at-read: the ADR 1082 signature scheme (DER ECDSA P-256 over
# SHA-256 of the exact file bytes), the same crate + version goat-cli verifies
# name snapshots and enrollment bundles with (crates/goat-cli).
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"

[dev-dependencies]
# The shared golden corpus runner. Cases are YAML, generations are JSON — both
# read from ops/consistency/testdata/, the SAME BYTES the Python implementation
# reads. That is what makes "one grammar, two executions" a guarantee.
