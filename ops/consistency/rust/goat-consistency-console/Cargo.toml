[package]
name = "goat-consistency-console"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The CF-6 consistency console — a stateless, mesh-internal, read-only projection of the consistency rollup (consistency-foundation.md §7, ADR 1110 D5)."

[dependencies]
goat-consistency = { path = "../goat-consistency" }
goat-consistency-wire = { path = "../goat-consistency-wire" }
zenoh = { version = "=1.9.0", features = ["unstable"] }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CF-7 aggregator config is authored by a human (comments carry the
# per-goatnet reasons), so it is YAML like every other authoring surface —
# same version the grading library already pins.
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
