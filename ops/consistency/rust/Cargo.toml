[workspace]
resolver = "2"
members = [
    "goat-consistency",
    "goat-consistency-wire",
    "goat-consistency-health",
    "goat-consistency-console",
]

# Its own workspace, detached from the repo root — the convention every
# ops/zenoh-trial-peers/* crate follows, so a `cargo build` here never drags in
# the goat-cli tree or its lockfile.

[profile.release]
lto = "thin"
codegen-units = 16
