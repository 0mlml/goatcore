[package]
name = "goat-consistency-wire"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "The ConsistencyV1 wire types (EnvHealthV1 arm 15) shared by the rollup meter and the CF-6 console — one definition per workspace, so the two readers cannot drift."

# protobuf via prost-derive on hand-written structs (no protoc/build.rs); the
# canonical schema is ops/zenoh-trial-peers/time-health/proto/env_health_v1.proto.

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
