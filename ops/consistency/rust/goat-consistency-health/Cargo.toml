[package]
name = "goat-consistency-health"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "The consistency domain of the environment-health surface (ADR 1036 / ADR 1110): a per-node convergence publisher and the passive per-goatnet rollup."

# protobuf via prost-derive on hand-written structs (no protoc/build.rs); the
# canonical schema is ops/zenoh-trial-peers/time-health/proto/env_health_v1.proto
# — the same convention every sibling env-health meter follows.

[dependencies]
goat-consistency = { path = "../goat-consistency" }
goat-consistency-wire = { path = "../goat-consistency-wire" }
zenoh = { version = "=1.9.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Test-only signing for the CF-5 red-then-reverted refusal tests: mint a
# scratch P-256 key, sign a scratch artifact, prove the meter refuses a
# tamper and accepts the revert. Same crate + version the library verifies
# with, so the tests exercise the production decode path.
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
base64 = "0.22"
