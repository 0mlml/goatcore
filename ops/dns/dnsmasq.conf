# goat — mesh DNS server
# Serves *.netbird.legacy.example from a local hosts file.
# Forwards everything else to public resolvers.
# Runs on the NETHOST infrastructure node.

# Listen on localhost (containers/scripts) and mesh interface (peer queries).
# Port 5353 to avoid conflict with Netbird's DNS proxy on 100.127.1.34:53.
# Netbird nameserver group must be configured to query 100.127.1.34:5353.
listen-address=127.0.0.1
listen-address=100.127.1.34
bind-interfaces
port=5353

# All records live in mesh-hosts — single source of truth synced to all DNS nodes.
# Includes enrollment round-robin (netbird.legacy.example → VPS relays)
# and service subdomains (*.netbird.legacy.example → NETHOST mesh IP).
# Do NOT use address= directives — they swallow subdomains.
addn-hosts=/etc/mesh-hosts

# Forward non-mesh queries to public DNS
server=1.1.1.1
server=8.8.8.8

# Don't read the host's /etc/resolv.conf
no-resolv

# Don't read the host's /etc/hosts (we manage our own)
no-hosts

# Cache DNS responses (survives upstream outages for cached entries)
cache-size=1000

# Log queries (useful for debugging, disable in production)
# log-queries

# Never forward plain names (without dots) upstream
domain-needed
bogus-priv
