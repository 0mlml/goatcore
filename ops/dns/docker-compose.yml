## Block 13A complete: migrated from jpillora/dnsmasq:latest (P0 supply chain risk) to CoreDNS.
## Image: coredns/coredns (official CNCF project image, Docker Hub verified publisher).
## Chainguard cgr.dev/chainguard/coredns requires a paid subscription — swap to it once Chainguard procurement lands (Block 13C; see docs/project/chainguard-procurement.md).
## Corefile replaces dnsmasq.conf — same mesh-hosts file format, no changes to sync-peers.sh / publish-service.sh.
## See docs/design/os-supply-chain-security.md §8.2 + §8.10, impl-plan Block 13A.
services:
  coredns:
    container_name: mesh-dns
    image: coredns/coredns:1.11.3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
      - ./mesh-hosts:/etc/mesh-hosts:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
