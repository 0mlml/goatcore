# hello-galaxy — the reference port-set vocabulary. WORK IN PROGRESS.
#
# This is the PUBLIC half of warrant (ADR 1129, docs/project/warrant-plan.md
# §3A): the mechanism ships open, the policy does not. This directory is a
# complete, runnable policy that belongs to nobody — an example goatnet so a
# reader can see the whole shape without access to anyone's real network.
#
# WHY THE NAMES ARE BORING, AND DELIBERATELY SO. A port-set is named for the
# MECHANISM, not for what the traffic is for: `shell` is tcp/22, not
# "administration" or anything about who is doing it. The reference vocabulary
# has to survive being read by someone in a different organisation with
# different words for the same ports.
#
# Run it:  ops/warrant/demo/run.sh
#
# WIP — see README.md for what is not finished.

port_sets:

  - name: substrate
    purpose: >
      Reach the goatnet's own services — web (443), DNS (53), and the data
      fabric (7447 tcp / 7448 udp). This is what a participant needs in order
      to be a participant. Databases and metrics stores are deliberately NOT
      here: they are not peer-facing, and a set that grows to include them
      stops meaning anything.
    owner: platform-admin
    members:
      - { protocol: tcp, ports: ["443", "53", "7447"] }
      - { protocol: udp, ports: ["53", "7448"] }
    required_by:
      - { src: CREW, dst: HUB }
      - { src: PROBE, dst: HUB }

  - name: substrate-restricted
    purpose: >
      The substrate surface minus the fabric — web and DNS only. What a peer
      keeps while it is quarantined: it can still resolve names and read the
      page explaining why it is quarantined, and it cannot publish or subscribe.
      The containment IS the absence of the fabric ports, so widening this set
      silently ends quarantine for everyone in it.
    owner: platform-admin
    members:
      - { protocol: tcp, ports: ["443", "53"] }
      - { protocol: udp, ports: ["53"] }
    required_by:
      - { src: QUARANTINED, dst: HUB }

  - name: shell
    purpose: >
      Interactive login — tcp/22 and nothing else. Named for the mechanism
      rather than the purpose, because "admin access" means different things
      in different organisations and tcp/22 does not.
    owner: platform-admin
    members:
      - { protocol: tcp, ports: ["22"] }
    required_by:
      - { src: BREAKGLASS, dst: HUB }

  - name: fabric
    purpose: >
      The data fabric alone — a publish/subscribe leg, no web and no DNS.
      Held separately from `substrate` so a peer can be given a fabric leg
      without the rest of the service surface.
    owner: platform-admin
    members:
      - { protocol: tcp, ports: ["7447"] }
      - { protocol: udp, ports: ["7448"] }
    required_by:
      - { src: PROBE, dst: HUB }

  - name: web
    purpose: >
      One HTTPS service and nothing else. Whatever sits behind the TLS port
      does its own authorization; this set only says the port is reachable.
    owner: platform-admin
    members:
      - { protocol: tcp, ports: ["443"] }
    required_by:
      - { src: OBSERVER, dst: HUB }
