# Clippy configuration for the crates/ workspace.
#
# This workspace is deliberately separate from the repo-root goat-relay
# workspace (see crates/Cargo.toml header): different trust domain, no
# shard-pinned hot path. Clippy walks up from a crate looking for the
# nearest clippy.toml; without this file the repo-root clippy.toml (ADR
# 0709 D7 layer 3, which bans tokio::spawn for goat-relay's single-shard
# hot path) was being inherited here and failing crates with no such
# constraint, e.g. panoscope-core's test-only tokio::spawn in portal.rs.
#
# This file intentionally sets no disallowed-methods: nothing in crates/
# is subject to ADR 0709.
