# `release --help`: the flags and the contract a reader relies on.
bin.name = "goatbuilder"
args = ["release", "--help"]
status.code = 0
stdout = """
Take a release candidate from a tag on main through the dev goatnet's live validation to the preprod
rung (ADR 1173); after the soak, with `--from prod`, graduate it, fold it into fleet:, deploy prod
and re-verify every rung. Replaces ops/scripts/rc.sh step for step

Usage: goatbuilder release [OPTIONS] <COMPONENT>

Arguments:
  <COMPONENT>  The component (a fleet-pins key)

Options:
  -o, --output <OUTPUT>    Output format: a table for a person; JSON or YAML for a program [default:
                           table] [possible values: table, json, yaml]
      --version <VERSION>  X.Y.Z — the version to cut (or pass --tag to validate an existing tag)
  -C, --repo <DIR>         The repository root. Defaults to the checkout this binary is run in
      --rc <RC>            The rc number; default the next free one on origin
      --ack <NAME>         Who nominates (required: a candidate reaches preprod and is attributed)
                           [default: ""]
      --yes                Confirm a declarative verb without prompting (for automation)
      --from <FROM>        Resume at a step: tag | dev | rows | preprod | preprod-rows | prod
                           (preprod-rows: preprod already runs the tag; redo only its deploy check,
                           live rows and evidence, without reopening the record or re-pinning)
                           [default: tag]
      --frozen             Refuse any run that would need to fast-forward the checkout (strict C3)
      --offline            An islanded site: do not fetch the trunk; judge the checkout against the
                           cached one, and record the run as offline (C3;
                           ops/scripts/fresh-source.sh)
      --tag <TAG>          An existing tag to validate as-is instead of cutting one
      --dry-run            Print every command; mutate nothing
      --mock <DIR>         Run against a fixture directory instead of hosts: no registry, no
                           transport, deterministic (goatbuilder-conformance.md §"The fixture")
      --lang <TAG>         Language for help and error explanations (a tag such as fr, uk, de);
                           output a pipeline reads stays English. Default: the OS locale [env:
                           GOAT_LANG=]
      --color <COLOR>      Color the table's ok/FAIL glyph and verdict (auto|always|never). `auto`
                           colors only a terminal; NO_COLOR and CLICOLOR_FORCE override. JSON and
                           YAML are never colored [default: auto] [possible values: auto, always,
                           never]
  -v, --verbose            Log what a run does — the external commands it shells out to, and the
                           network phase of `update` — to stderr, so `-o json|yaml` stays a clean
                           document. Or set RUST_LOG=goatbuilder=debug
      --timeout <SECS>     Seconds to bound the connect/reach phase before failing fast — the one
                           phase that can block on an unreachable host (`update`'s fetch of the
                           served version). Does NOT cap a play's own run or the binary download
                           (stall-bounded). Also reads GOATBUILDER_TIMEOUT [env:
                           GOATBUILDER_TIMEOUT=]
  -h, --help               Print help
"""
stderr = ""
