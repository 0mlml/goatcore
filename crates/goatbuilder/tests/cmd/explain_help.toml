# `explain --help`.
bin.name = "goatbuilder"
args = ["explain", "--help"]
stdout = """
Interpret an error: a code (`GB-007`, `X-SSH-001`, `E_OFF_MESH`), or any error text — this binary's
own, or a tool's words it carried (ansible, ssh, op, aws, git, gh, cosign, docker, netbird). Prints
what happened, why, what to do and where to read more; `-` reads the text from stdin

Usage: goatbuilder explain [OPTIONS] [CODE|TEXT]...

Arguments:
  [CODE|TEXT]...  A code, or words of the error. `-` reads stdin. A flag (`-o`, `--lang`) parses
                  wherever it appears; to read text that itself starts with a hyphen, put `--`
                  before it

Options:
  -o, --output <OUTPUT>  Output format: a table for a person; JSON or YAML for a program [default:
                         table] [possible values: table, json, yaml]
      --report           Also write the text and its interpretation to ~/.goat/error-reports/ (a
                         file to share when the catalog does not know the error)
  -C, --repo <DIR>       The repository root. Defaults to the checkout this binary is run in
      --list             List every code the catalog knows
      --yes              Confirm a declarative verb without prompting (for automation)
      --frozen           Refuse any run that would need to fast-forward the checkout (strict C3)
      --offline          An islanded site: do not fetch the trunk; judge the checkout against the
                         cached one, and record the run as offline (C3; ops/scripts/fresh-source.sh)
      --mock <DIR>       Run against a fixture directory instead of hosts: no registry, no
                         transport, deterministic (goatbuilder-conformance.md §"The fixture")
      --lang <TAG>       Language for help and error explanations (a tag such as fr, uk, de); output
                         a pipeline reads stays English. Default: the OS locale [env: GOAT_LANG=]
      --color <COLOR>    Color the table's ok/FAIL glyph and verdict (auto|always|never). `auto`
                         colors only a terminal; NO_COLOR and CLICOLOR_FORCE override. JSON and YAML
                         are never colored [default: auto] [possible values: auto, always, never]
  -v, --verbose          Log what a run does — the external commands it shells out to, and the
                         network phase of `update` — to stderr, so `-o json|yaml` stays a clean
                         document. Or set RUST_LOG=goatbuilder=debug
      --timeout <SECS>   Seconds to bound the connect/reach phase before failing fast — the one
                         phase that can block on an unreachable host (`update`'s fetch of the served
                         version). Does NOT cap a play's own run or the binary download
                         (stall-bounded). Also reads GOATBUILDER_TIMEOUT [env: GOATBUILDER_TIMEOUT=]
  -h, --help             Print help
"""
stderr = ""
