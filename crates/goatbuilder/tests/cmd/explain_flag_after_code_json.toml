# A flag after the positional code parses as a flag, not as more text to
# interpret (#2131, bug 1): `-o json` after `GB-017` must come out identical
# to `-o json` before it, not as the garbled text "GB-017 -o json".
bin.name = "goatbuilder"
args = ["explain", "GB-017", "-o", "json"]
stdout = """
{
  \"code\": \"GB-017\",
  \"tool\": \"goatbuilder\",
  \"title\": \"not converged on every host\",
  \"what\": \"the play ran, and at least one host's ledger does not name the declared digest with action=deploy. Done is read from the ledger, never assumed.\",
  \"causes\": [
    \"the play failed part-way on that host\",
    \"the host is single-homed on another router role and was skipped by design (ADR 1084)\",
    \"the host was unreachable\"
  ],
  \"fixes\": [
    \"goatbuilder deploy --env <env> --component <c> --verify-only\",
    \"read the log named in the deploy row; grep -n 'fatal:' <log>\"
  ],
  \"read\": \"docs/design/universal-deploy-rollback.md\",
  \"exit\": 3,
  \"matches\": [
    \"NOT converged\"
  ]
}
"""
stderr = ""
