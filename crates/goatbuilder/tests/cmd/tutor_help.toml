# `tutor --help`: the flags and the contract a reader relies on.
bin.name = "goatbuilder"
args = ["tutor", "--help"]
stdout = """
Lessons, vimtutor-style: each names the exact command to run against a throwaway copy of a fixture
(or, read-only, against this checkout), then checks what that command actually did — its exit and
its rows — before the next unlocks. `tutor` shows the lesson you are on and marks it done when your
runs satisfy it; `tutor <n>`, `--list`, `--reset`

Usage: goatbuilder tutor [OPTIONS] [LESSON]

Arguments:
  [LESSON]  The lesson to open (1..); default the first not yet done. A finished lesson opens to
            read again and changes nothing

Options:
      --lesson <N>             The same as the number on its own: `tutor --lesson 2`
  -o, --output <OUTPUT>        Output format: a table for a person; JSON or YAML for a program
                               [default: table] [possible values: table, json, yaml]
  -C, --repo <DIR>             The repository root. Defaults to the checkout this binary is run in
      --list                   Every lesson, with done / next / locked / needs-a-newer-build
      --reset                  Start over: a fresh copy of every fixture, no progress
      --yes                    Confirm a declarative verb without prompting (for automation)
      --frozen                 Refuse any run that would need to fast-forward the checkout (strict
                               C3)
      --workspace <WORKSPACE>  Where the fixtures' copies, the progress and the run log live
                               (default $GOATBUILDER_TUTOR, else ~/.goatbuilder/tutor)
      --offline                An islanded site: do not fetch the trunk; judge the checkout against
                               the cached one, and record the run as offline (C3;
                               ops/scripts/fresh-source.sh)
      --mock <DIR>             Run against a fixture directory instead of hosts: no registry, no
                               transport, deterministic (goatbuilder-conformance.md §"The fixture")
      --lang <TAG>             Language for help and error explanations (a tag such as fr, uk, de);
                               output a pipeline reads stays English. Default: the OS locale [env:
                               GOAT_LANG=]
      --color <COLOR>          Color the table's ok/FAIL glyph and verdict (auto|always|never).
                               `auto` colors only a terminal; NO_COLOR and CLICOLOR_FORCE override.
                               JSON and YAML are never colored [default: auto] [possible values:
                               auto, always, never]
  -v, --verbose                Log what a run does — the external commands it shells out to, and the
                               network phase of `update` — to stderr, so `-o json|yaml` stays a
                               clean document. Or set RUST_LOG=goatbuilder=debug
      --timeout <SECS>         Seconds to bound the connect/reach phase before failing fast — the
                               one phase that can block on an unreachable host (`update`'s fetch of
                               the served version). Does NOT cap a play's own run or the binary
                               download (stall-bounded). Also reads GOATBUILDER_TIMEOUT [env:
                               GOATBUILDER_TIMEOUT=]
  -h, --help                   Print help
"""
stderr = ""
