# preflight on the fixture: a stateless, pin-revert, single rollout grades clean
# (exit 0) and prints the three facts and the validated pin flip (ADR 1211).
bin.name = "goatbuilder"
args = ["preflight", "-C", "../..", "--mock", "../../ops/goatbuilder/fixtures/preflight", "netvis", "--env", "zagros-dev"]
status.code = 0
[env]
GOAT_PREFLIGHT_PULL = "0"
GOAT_MESH_PROBE = "0"
stdout = """
ok    preflight/state               State: stateless
ok    preflight/rollback            Rollback: pin-revert
ok    preflight/scope               Scope: single
ok    preflight/candidate-ref       [..]is digest-pinned
ok    preflight/rollback-validated  rollback --dry-run confirms the earlier ref would be declared and converged
ok    preflight                     netvis on zagros-dev: ready — stateless · rollback: pin-revert · single
preflight: ok (6 checks)
"""
