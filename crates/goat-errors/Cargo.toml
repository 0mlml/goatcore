[package]
name = "goat-errors"
version = "0.1.0"
edition = "2021"
description = "The error catalog goat and goatbuilder share: look a code up, or interpret any error text — the binary's own words and the words of the tools it called (ADR 1199)"
publish = false

[dependencies]
# Localized prose for the entries (docs/design/goat-cli-i18n.md §"The error
# catalog"): the same Fluent stack goat-cli uses, embedded, no runtime files.
fluent-bundle = "0.15"
unic-langid = "0.9"
rust-embed = "8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
