# cargo-i18n / i18n-embed configuration (ADR 1024 / docs/design/goat-cli-i18n.md).
# English is the canonical arbiter and the fallback for every other
# language; the `fl!` macro compile-time-checks ids against it.
fallback_language = "en"

[fluent]
# Catalogs live under crates/goat-cli/i18n/<lang>/goat_cli.ftl and are
# embedded into the binary via rust-embed (no runtime file reads).
assets_dir = "i18n"
