# `goat topic create --dry-run` doesn't touch the portal — it only
# validates the key shape and renders the POST body. Lifted out of
# the portal-backed path so an operator can preview a command before
# `goat profile init`. Locks in the dry-run line shape so scripts can
# grep on it.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-topic-create-dry-run-fixture", "topic", "create", "acme/test/v1", "--format", "protobuf:Foo", "--description", "demo", "--dry-run"]
status.code = 0
stderr = """
dry-run: POST <portal>/api/orgs/acme/topics
  body: {"key_pattern":"acme/test/v1","format":"protobuf:Foo","description":"demo","publish_to_storage":false}
"""
