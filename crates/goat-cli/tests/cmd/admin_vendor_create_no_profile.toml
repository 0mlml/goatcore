# `goat admin vendor create` against an uninitialized profile must
# surface E_PROFILE_MISSING + exit 3 before any portal request fires.
# An operator signal (GOAT_OPERATOR_HANDLE) is set so the operator-only
# capability guard passes and we reach the profile check — the guard's
# own no-credentials path is covered by admin_not_admin_no_credentials.toml.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-admin-fixture", "admin", "vendor", "create", "test-vendor"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-admin-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
[env]
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator" }
