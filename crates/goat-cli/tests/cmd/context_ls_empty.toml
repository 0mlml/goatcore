# `goat context ls` against an uninitialized profile (no contexts dir
# at all) emits a friendly hint instead of crashing. Pure-local; no
# portal call so this should exit 0.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-context-fixture", "context", "ls"]
status.code = 0
stdout = """
(no contexts — run `goat profile init <bundle.cbor>` to create one)
"""
