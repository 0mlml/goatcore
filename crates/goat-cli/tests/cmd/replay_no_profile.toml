# `goat replay` (Phase G.6 audit-tail read) against an uninitialized profile
# surfaces E_PROFILE_MISSING + exit 3 before any portal/MinIO call — it needs
# the portal token to mint presigned URLs.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-replay-fixture", "replay", "org11x/**"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-replay-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
