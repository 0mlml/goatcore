# `goat admin <action>` by a non-operator — an uninitialized profile AND no
# operator environment — is refused up front, INERT (nothing is sent), with
# E_NOT_ADMIN + exit 4. This is the operator-only capability guard; the message
# names what to do and points non-operators at the everyday surface. A fresh
# --profile-dir guarantees "uninitialized"; every operator signal is forced
# empty so the guard fires deterministically regardless of the runner's env
# (an operator's own laptop carries GOAT_OPERATOR_* — a clean CI runner does
# not — so we neutralize them here rather than rely on the ambient env).
bin.name = "goat"
args = ["--profile-dir", "/tmp/goat-trycmd-not-admin-fixture", "admin", "vendor", "create", "test-vendor"]
status.code = 4
stderr = """
error: operator-only action — you are not authorized (`goat admin` is inert for non-admins)
  help: [..]
  code: E_NOT_ADMIN
"""
[env]
add = { GOAT_OPERATOR_HANDLE = "", GOAT_OPERATOR_AGE_RECIPIENTS = "", GOAT_NB_API_TOKEN = "", DEFAULT_NB_API_TOKEN = "", GOAT_DEV_CA_ID = "", GOAT_DEV_CA_KEY = "", GOAT_DEV_CA_AGE_IDENTITY = "" }
