# The `--json` machine contract, in the one failure mode CI can exercise
# without a live fabric: when `goat flow --json` cannot run, stdout must be
# EMPTY — never a half-built object, never `{"rows":[]}` (which a script
# would read as "the fabric has no topics" rather than "goat could not
# look"). The error goes to stderr in the house three-line shape and the
# exit code carries the reason.
#
# This is the structural counterpart to the rule inside the command: a row
# whose last-publish is unknown OMITS the field entirely rather than
# emitting 0 — the same bug, at two different altitudes.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-flow-fixture", "flow", "--json"]
status.code = 3
stdout = ""
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-flow-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
