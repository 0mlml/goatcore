# `goat admin lan doctor <name>` fails fast + deterministically on a
# registry miss — BEFORE any interface discovery / sweep / ssh, so the
# operator gets the known-host list instead of a hung probe. Embedded
# registry only (no ~/.goat/lan-hosts.yaml in the trycmd sandbox HOME).
bin.name = "goat"
args = ["--profile-dir", "/tmp/goat-cli-lan-doctor-no-profile-dir", "admin", "lan", "doctor", "no-such-thor"]
status.code = 1
stderr = """
error: no registry host named `no-such-thor` and it is not an IPv4 address — known hosts:  (list hosts in ~/.goat/lan-hosts.yaml)
"""
