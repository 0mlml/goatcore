# `goat explain E_PROFILE_MISSING` prints the catalog entry (ops/errors/
# catalog.yaml, compiled in — ADR 1199): what, why, fix, read, exit.
# Doesn't touch profile / portal / mesh.
bin.name = "goat"
args = ["explain", "E_PROFILE_MISSING"]
status.code = 0
stdout = """
E_PROFILE_MISSING — no profile for this context
  what: [..]
  why:  [..]
[..]
  fix:  goat profile init <bundle.cbor>
[..]
  read: docs/design/goat-cli-error-codes.md
  exit: 3
"""
