# `goat status` against an uninitialized profile must surface
# E_PROFILE_MISSING + exit 3 before any probe runs.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-status-fixture", "status"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-status-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
