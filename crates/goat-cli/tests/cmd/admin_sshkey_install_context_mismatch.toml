bin.name = "goat"
args = ["--profile-dir", ".", "--context", "othername", "admin", "ssh-key", "install", "--env", "testenv", "--check"]
status.code = 1
stderr = """
error: ssh-key install is env-keyed and the active profile carries no `goatnet` binding. Current context is `othername` but --env targets `testenv`. Either switch to the context for `testenv` (`goat --context testenv …` / GOAT_CONTEXT), or — if this context's onboard_endpoint really is `testenv`'s console — add `goatnet = "testenv"` to ./contexts/othername/profile.toml so the binding is a recorded fact instead of a naming convention.
"""
[env]
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator" }
