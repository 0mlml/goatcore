# `goat compose` is TTY-gated by construction — running under
# trycmd (which captures stdout/stderr via pipes, not a tty)
# must refuse to launch rather than hang waiting for input.
# Phase D.C v0 invariant per ADR 1019 §14.
bin.name = "goat"
args = ["compose"]
status.code = 1
stderr = """
error: `goat compose` requires an interactive terminal. Non-TTY invocations (pipes / CI) are refused by construction so a script can't accidentally hang waiting for input. See ADR 1019 §14 + docs/design/goat-cli.md §compose.
"""
