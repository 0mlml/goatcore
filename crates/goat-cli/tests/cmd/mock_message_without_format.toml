# `goat mock --message <name>` without --format is a usage error
# (the operator asked for a specific message but didn't say where
# the descriptor lives). Anyhow surfaces as exit 1.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-mock-fixture", "mock", "acme/test/v1", "--message", "Foo"]
status.code = 1
stderr = """
error: --message / --payload-template require --format (the .fds path)
"""
