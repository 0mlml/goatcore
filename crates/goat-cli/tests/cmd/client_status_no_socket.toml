# `goat client status` against a missing daemon socket surfaces a
# specific message naming the path + "is goat-clientd running?" hint
# instead of an opaque OS error.
bin.name = "goat"
args = ["client", "status", "--socket", "/tmp/goat-cli-phase-f-3-no-such.sock"]
status.code = 1
stderr = """
error: daemon socket /tmp/goat-cli-phase-f-3-no-such.sock unreachable: No such file or directory (os error 2) — is goat-clientd running?
"""
