# Standalone `goat narrate` (audit-tail reflection, Phase G.6) reads the
# audit-tail over the portal-presign path, so against an uninitialized
# profile it surfaces E_PROFILE_MISSING + exit 3 before any network call —
# same posture as `goat sub` / `goat status`.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-narrate-fixture", "narrate"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-narrate-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
