# `goat mock --format <path>` without --message is a usage error
# (the operator pointed at a descriptor set but didn't say which
# message inside to encode).
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-mock-fixture", "mock", "acme/test/v1", "--format", "/dev/null"]
status.code = 1
stderr = """
error: --message is required when --format is set
"""
