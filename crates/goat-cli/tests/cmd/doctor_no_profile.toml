# `goat doctor` against an uninitialized profile must surface
# E_PROFILE_MISSING + exit 3 with an "init first" hint, BEFORE
# attempting any network probe.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-doctor-fixture", "doctor"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-doctor-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
