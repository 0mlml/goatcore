# Machine-surface byte-stability under a non-English locale (ADR 1024 /
# docs/design/goat-cli-i18n.md CI guard). Same E_PROFILE_MISSING path as
# doctor_no_profile.toml, but GOAT_LANG=uk: the human `summary` line
# localizes to Ukrainian while the contract — exit code 3, the
# `code: E_PROFILE_MISSING` line, and the error:/help:/code: labels —
# stays byte-identical. The `help:` hint is producer-supplied free text,
# not localized in this slice, so it remains English.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-doctor-uk-fixture", "doctor"]
status.code = 3
stderr = """
error: немає профілю для контексту `default`
  help: no profile at [..]/goat-trycmd-doctor-uk-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""

# GOAT_I18N_NO_WARN keeps this case focused on machine-surface stability;
# the machine-translation notice is asserted separately in
# doctor_machine_translation_warning.toml.
[env]
add = { GOAT_LANG = "uk", GOAT_I18N_NO_WARN = "1" }
