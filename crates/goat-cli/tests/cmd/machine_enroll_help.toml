# `goat machine enroll --help` names the node-classes the mint accepts (#1400).
# Only the --node-class block is pinned; ops/ci/check-enroll-help-classes.py
# checks the same text against the portal's class sets.
bin.name = "goat"
args = ["machine", "enroll", "--help"]
status.code = 0
stdout = """
...
      --node-class <NODE_CLASS>      Node-class — the function the box performs (ADR 1116), or a
                                     standalone appliance boundary; enroll once per function.
                                     Custodian self-service: SENSOR-FEED / SENSOR-TELEMETRY /
                                     SENSOR-ARBITER, EFFECTOR-CUE / EFFECTOR-TRACK /
                                     EFFECTOR-TELEMETRY / EFFECTOR-ARBITER, POD / MOON / KID /
                                     EXTERNAL-KID / EXTERNAL-INTERMEDIARY, FUSION, CONTROL; or
                                     PLATFORM, a composition that needs `--workloads`. NETWORK
                                     (bearer gear — routers, switches, radios) and EDGE-SERVER (a
                                     server that supports edge devices): operator, or a custodian
                                     holding the network-admin entitlement for its own site (ADR
                                     1113, ADR 1216). Operator-only infrastructure: MGMT-HOST /
                                     ZENOH / SNITCH / SERVICES / BREAKGLASS / NETWORK-JUMP. Refused
                                     at the mint: SENSOR and EFFECTOR (reserved), SENSOR-TASKING and
                                     EFFECTOR-COMMAND (intake-only, never a primary class),
                                     PROCESSOR (legacy, no mesh group — use FUSION).
...
      --workloads <WORKLOADS>        PLATFORM sub-workload composition: a comma-separated list of
                                     the composable gear functions the box performs (e.g.
                                     `effector-cue,effector-arbiter`); its mesh groups are their
                                     union. POD and MOON are standalone classes, not PLATFORM
                                     workloads. Valid only when `--node-class PLATFORM`.
...
"""
