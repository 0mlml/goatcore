# `goat explain BOGUS` matches nothing in the catalog: it says so, names
# `--report` to share the text, points at `--list`, and exits 1.
bin.name = "goat"
args = ["explain", "BOGUS"]
status.code = 1
stdout = """
BOGUS
  not recognised: no catalog entry matches this text.
  share it: goat explain --report -   (reads the text from stdin, writes ~/.goat/error-reports/<stamp>.txt)
"""
stderr = """
error: no catalog entry matches `BOGUS` — `goat explain --list` shows the [..] codes it knows
"""
