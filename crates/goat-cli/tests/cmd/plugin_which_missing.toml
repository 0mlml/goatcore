# `goat plugin which <name>` exits non-zero with a specific message
# when no `goat-<name>` is on PATH. Operators can wrap this in
# scripts to detect plugin availability before depending on it.
bin.name = "goat"
args = ["plugin", "which", "no-such-plugin-xyz123"]
status.code = 1
stderr = """
error: no goat-no-such-plugin-xyz123 on PATH
"""
