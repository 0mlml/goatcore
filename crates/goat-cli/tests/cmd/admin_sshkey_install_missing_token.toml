bin.name = "goat"
args = ["--profile-dir", ".", "--context", "testenv", "admin", "ssh-key", "install", "--env", "testenv", "--check"]
status.code = 1
stderr = """
error: ssh-key install needs your PERSONAL onboard API key for goatnet `testenv` — export $TESTENV_PORTAL_OPERATOR_API_KEY in your operator env (for example in .envrc.local.d/30-site-services.envrc) after collecting it via `goat admin operator-key collect`.
"""
[env]
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator" }
