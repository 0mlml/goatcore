# `goat sub --decode` against an uninitialized profile must surface
# E_PROFILE_MISSING + exit 3. PortalClient is constructed up-front
# (before any Zenoh session open) so a missing profile errors right
# away rather than after the first sample arrives.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-sub-decode-fixture", "sub", "org11x/**", "--decode"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-sub-decode-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
