# `--watch` and `--json` are mutually exclusive by construction: a repaint
# loop emitting a stream of complete JSON objects is not a parseable
# document, and the machine contract is one object per invocation. clap
# enforces it, so the refusal is exit 2 (EXIT_USAGE) rather than a runtime
# error — and it fires before any profile read, which is why this passes
# without a fixture profile.
bin.name = "goat"
args = ["flow", "--watch", "--json"]
status.code = 2
stdout = ""
stderr = """
error: the argument '--watch' cannot be used with '--json'

Usage: goat flow --watch [KEY_EXPR]

For more information, try '--help'.
"""
