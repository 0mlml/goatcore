# `goat tutor` on a non-TTY must NOT block on stdin — it prints the lesson
# outline + how to start, and exits. Locks the non-blocking guardrail.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-tutoroutline-fixture", "tutor"]
stdout = """
goat tutor — a hands-on tour of the fabric (11 lessons).
Run it on a terminal to step through interactively:
   1. Orientation — what the fabric is
   2. Identity & profile
   3. Reachability — goat doctor
   4. Publish & subscribe
   5. Compose — build a command with live substrate context
   6. Diagnose — goat inspect
   7. Cascade — the --narrate flag
   8. Access — who can read what
   9. Sealed data — encryption that carries its own read cut
  10. Rotate your key — forward secrecy on your terms
  11. Wrap — from sandbox to the real thing

Start:  goat tutor      (resumable · `--reset` to start over)
"""
