# `goat topic ls` against an uninitialized profile must surface
# E_PROFILE_MISSING + exit 3 before attempting any portal call.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-topic-fixture", "topic", "ls"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-topic-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
