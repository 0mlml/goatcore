# A topic key starting with `/` parses to an empty vendor prefix.
# vendor_prefix_from_key rejects this before any portal call, even
# in --dry-run mode, with a specific structural-error message.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-topic-invalid-fixture", "topic", "create", "/missing/vendor", "--format", "json", "--dry-run"]
status.code = 1
stderr = """
error: topic key must include an org prefix, e.g. `acme/topic/v1`
"""
