# `goat init --sandbox` on a non-TTY: the first-run wizard goes straight to
# the sandbox, delivers the instant win (a hello round-trip), and points at
# the tutor — without ever blocking on stdin.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-init-fixture", "init", "--sandbox"]
stdout = """
Welcome to goat — the operator command-line for the data fabric.

Let's prove it works — a round-trip through the sandbox:

◇ SANDBOX — simulated fabric, no real mesh. Run `goat init` to attach a real env.
goat hello — saying `lo` to the fabric as `default` on topic `hello/default`
  [t+[..]ms] portal     accepted topic `hello/default` (simulated)
  [t+[..]ms] fabric     routed `lo` to `hello/default` over the WireGuard P2P path (simulated)
  [t+[..]ms] subscriber your subscriber received `lo` — round-trip complete (simulated)
  └─ `lo`: the first message ever sent over a network (ARPANET, 29 Oct 1969) — they typed "LOGIN" and the link crashed after two letters.
round-trip complete.
next: `goat tutor` to learn the fabric · `goat sub <key>` to watch live traffic.

That was simulated. When you have a bundle:
  goat ca add <bundle-ca.pem>      # verify its fingerprint with your operator
  goat profile init <bundle.cbor>  # attach a real env

Ready to learn it hands-on?  ->  goat tutor
"""
