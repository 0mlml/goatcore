# `goat flow` against an uninitialized profile must surface
# E_PROFILE_MISSING + exit 3 BEFORE any snapshot GET, portal read, or
# Zenoh session. A missing profile is a structural failure, not a
# degraded read — the per-tier degradation in `flow` is for observers
# that are configured but unreachable, which is a different fact and
# reports as `unreachable` in the sources table rather than as an error.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-flow-fixture", "flow"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-flow-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
