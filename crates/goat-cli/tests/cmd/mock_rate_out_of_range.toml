# `goat mock --rate 0` (and negative / >1000) refused before any
# session open. Prevents the operator footgun of a 0-Hz busy loop
# OR a 1MHz traffic flood.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-mock-fixture", "mock", "acme/test/v1", "--rate", "0"]
status.code = 1
stderr = """
error: --rate must be in (0, 1000] Hz; got 0
"""
