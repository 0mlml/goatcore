# `goat who` opens the interactive identity COP (ADR 1047), which is
# TTY-gated by construction. Running under trycmd (stdout/stderr are pipes,
# not a tty) must refuse to launch — BEFORE any portal read or session open —
# rather than hang waiting for input. `--once` is the scriptable path; the
# bare interactive form is gated as the outermost frame, like `goat ui`.
bin.name = "goat"
args = ["who"]
status.code = 1
stderr = """
error: `goat who` requires an interactive terminal. Non-TTY invocations (pipes / CI) are refused by construction so a script can't accidentally hang waiting for input. See docs/design/goat-cli-tui.md.
"""
