# `goat flow --watch` is deliberately NOT TTY-gated: it reads no input, the
# sibling line-oriented watchers (`health --watch`, `presence --watch`) are
# ungated too, and gating would forbid `goat flow --watch | tee flow.log` —
# which is one of the stated reasons this command uses a repaint loop rather
# than a TUI (ADR 1121 D5). `crate::tui::require_tty` is for full-screen
# surfaces that would hang waiting for a keypress.
#
# What must hold instead is that a piped `--watch` cannot spin forever on a
# broken setup: the profile check runs on the first tick, so this exits 3
# immediately rather than looping. Under trycmd stdout/stderr are pipes, so
# this case IS the non-TTY path.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-flow-fixture", "flow", "--watch"]
status.code = 3
stdout = ""
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-flow-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
