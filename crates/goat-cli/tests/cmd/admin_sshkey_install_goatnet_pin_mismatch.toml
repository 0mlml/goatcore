bin.name = "goat"
args = ["--profile-dir", ".", "--context", "testenv", "admin", "ssh-key", "install", "--env", "testenv", "--check"]
status.code = 1
stderr = """
error: ssh-key install is env-keyed: the active profile (./contexts/testenv/profile.toml) is pinned to goatnet `otherenv` but --env targets `testenv`. Switch to a profile for `testenv` (`goat --context <name> …`) — never re-point this one.
"""
[env]
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator" }
