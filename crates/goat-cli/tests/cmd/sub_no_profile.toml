# `goat sub` against an uninitialized profile surfaces
# E_PROFILE_MISSING + exit 3 before any Zenoh open attempt.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-sub-fixture", "sub", "org11x/**"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-sub-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
