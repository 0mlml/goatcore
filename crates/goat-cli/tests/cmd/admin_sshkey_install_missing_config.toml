bin.name = "goat"
args = ["--profile-dir", ".", "--context", "testenv", "admin", "ssh-key", "install", "--env", "testenv", "--check"]
status.code = 1
stderr = """
error: ssh-key install needs an `onboard_endpoint` for goatnet `testenv` in the active profile (./contexts/testenv/profile.toml). Run `goat profile init <bundle.cbor>` for this goatnet, or add an onboard_endpoint line to profile.toml.
"""
[env]
add = { GOAT_OPERATOR_HANDLE = "trycmd-operator" }
