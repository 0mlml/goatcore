# `goat ui` opens the interactive merged picker (Phase D), which is
# TTY-gated by construction (docs/design/goat-cli-tui.md). Running under
# trycmd (stdout/stderr are pipes, not a tty) must refuse to launch —
# BEFORE any portal/snapshot read — rather than hang waiting for input.
# The refusal needs no profile and no mesh: the TTY gate is the
# outermost frame, same as the Diagnose/Tail lenses.
bin.name = "goat"
args = ["ui"]
status.code = 1
stderr = """
error: `goat ui` requires an interactive terminal. Non-TTY invocations (pipes / CI) are refused by construction so a script can't accidentally hang waiting for input. See docs/design/goat-cli-tui.md.
"""
