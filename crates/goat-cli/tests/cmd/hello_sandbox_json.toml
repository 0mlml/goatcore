# `goat hello --json` is the machine surface: ONE clean JSON object, no
# SANDBOX banner / footnote / hints / flourish. `mode` distinguishes a
# sandbox proof from a real one. elapsed_ms is masked (varies per run).
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-hellojson-fixture", "hello", "--json"]
stdout = """
{"mode":"sandbox","topic":"hello/default","payload":"lo","round_trip":true,"hops":[{"label":"portal","detail":"accepted topic `hello/default` (simulated)","elapsed_ms":[..]},{"label":"fabric","detail":"routed `lo` to `hello/default` over the WireGuard P2P path (simulated)","elapsed_ms":[..]},{"label":"subscriber","detail":"your subscriber received `lo` — round-trip complete (simulated)","elapsed_ms":[..]}]}
"""
