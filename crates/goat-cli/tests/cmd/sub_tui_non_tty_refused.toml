# `goat sub --tui` opens the interactive Tail lens, which is TTY-gated
# by construction (docs/design/goat-cli-tui.md, Phase C). Running under
# trycmd (stdout/stderr are pipes, not a tty) must refuse to launch —
# BEFORE any profile resolution or Zenoh session open — rather than
# hang waiting for input. The refusal needs no profile and no mesh,
# which is the point: the TTY gate is the outermost frame.
bin.name = "goat"
args = ["sub", "--tui", "org11x/**"]
status.code = 1
stderr = """
error: `goat sub --tui` requires an interactive terminal. Non-TTY invocations (pipes / CI) are refused by construction so a script can't accidentally hang waiting for input. See docs/design/goat-cli-tui.md.
"""
