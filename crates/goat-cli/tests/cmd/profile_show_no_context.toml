# `goat profile show` against an empty profile dir must surface
# E_PROFILE_MISSING + exit 3 with a clear "init first" hint.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-empty-fixture", "profile", "show"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-empty-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
