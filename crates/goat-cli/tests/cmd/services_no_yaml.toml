# `goat services` against a directory with no services.yaml surfaces
# the read-failure path with a specific message naming the missing
# file. The probe loop never fires.
bin.name = "goat"
args = ["services", "--repo-root", "/tmp/goat-cli-phase-f-2-no-such-repo-root"]
status.code = 1
stderr = """
error: read /tmp/goat-cli-phase-f-2-no-such-repo-root/ops/serve/services.yaml: No such file or directory (os error 2)
"""
