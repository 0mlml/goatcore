# `goat inspect` against a malformed target (no `=`) surfaces a
# specific hint naming the expected shape (`vendor=` / `topic=` /
# `system=`) before any network IO fires.
bin.name = "goat"
args = ["inspect", "drs", "--endpoint", "https://stethoscope.invalid"]
status.code = 1
stderr = """
error: target must be `vendor=<prefix>` | `topic=<key>` | `system=<name>`; got `drs`
"""
