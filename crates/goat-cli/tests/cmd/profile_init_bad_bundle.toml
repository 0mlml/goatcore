# malformed-CBOR-shaped hint + exit 3 (per exit_codes.rs).
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-init-fixture", "profile", "init", "/dev/null"]
status.code = 3
stderr = """
error: bundle signature or expiry verification failed
  help: malformed CBOR: [..]
  code: E_BUNDLE_INVALID
"""
