# Unknown subcommand ⇒ clap exits 2 (documented exit code). Stable
# CI-grep contract per docs/design/goat-cli.md §Exit codes. The exact
# usage message changes with clap upgrades; we only assert exit code +
# that *some* stderr was produced.
bin.name = "goat"
args = ["definitely-not-a-subcommand"]
status.code = 2
stderr = """
...
"""
