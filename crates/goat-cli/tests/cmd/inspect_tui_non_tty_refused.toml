# `goat inspect --tui` opens the interactive Diagnose lens, which is
# TTY-gated by construction (docs/design/goat-cli-tui.md, Phase B).
# Running under trycmd (stdout/stderr are pipes, not a tty) must refuse
# to launch — BEFORE any profile/endpoint resolution — rather than hang
# waiting for input. The refusal needs no profile, which is the point:
# the TTY gate is the outermost frame.
bin.name = "goat"
args = ["inspect", "--tui", "vendor=drs"]
status.code = 1
stderr = """
error: `goat inspect --tui` requires an interactive terminal. Non-TTY invocations (pipes / CI) are refused by construction so a script can't accidentally hang waiting for input. See docs/design/goat-cli-tui.md.
"""
