# `goat heal` against an uninitialized profile must surface
# E_PROFILE_MISSING + exit 3 before any probe or actuation runs —
# heal never bounces a mesh client it can't verify against a profile.
bin.name = "goat"
args = ["--profile-dir", "[..]/goat-trycmd-heal-fixture", "heal"]
status.code = 3
stderr = """
error: no profile for context `default`
  help: no profile at [..]/goat-trycmd-heal-fixture/contexts/default. Run `goat profile init <bundle.cbor>` first.
  code: E_PROFILE_MISSING
"""
